/* ===== 60-ai.js ===== */
/* ---------- Intelligence artificielle ----------
   Appels directs depuis le navigateur, avec la clé de l'utilisateur rangée dans le coffre chiffré.
   La politique de sécurité (CSP) limite les destinations possibles à ces deux API.
   Les vins gardés pour des amis ne sont jamais envoyés au sommelier. */
const AI = {
  anthropic: { label: 'Claude (Anthropic)', model: 'claude-sonnet-5-5', keyUrl: 'console.anthropic.com', url: 'https://api.anthropic.com/v1/messages' },
  mistral: { label: 'Mistral (hébergé en Europe)', model: 'mistral-large-latest', keyUrl: 'console.mistral.ai', url: 'https://api.mistral.ai/v1/chat/completions' },
};
const aiCfg = () => S?.settings.ai || {};
const aiReady = () => !!aiCfg().key;
const aiClaude = () => (aiCfg().provider || 'anthropic') === 'anthropic';
const aiModel = () => aiCfg().model || AI[aiCfg().provider || 'anthropic'].model;
let aiNoFallback = false;
class AIError extends Error {}

async function apiError(r) {
  let detail = '';
  try { const t = (await r.text()).slice(0, 500); try { const j = JSON.parse(t); detail = j.error?.message || j.message || j.detail || ''; } catch { detail = t; } } catch {}
  detail = String(detail).replace(/\s+/g, ' ').trim().slice(0, 160);
  const base = r.status === 401 ? 'Clé refusée (401) : elle est invalide, expirée, ou pas encore active.'
    : r.status === 402 ? 'Paiement requis (402) : le compte n’a pas de moyen de paiement actif.'
    : r.status === 403 ? 'Accès refusé (403) : la clé n’a pas accès à ce modèle.'
    : r.status === 404 ? 'Modèle introuvable (404) : vérifie le nom du modèle dans les réglages.'
    : r.status === 429 ? 'Quota atteint (429) : trop de requêtes, ou crédit épuisé. Réessaie dans un instant.'
    : r.status === 529 || r.status >= 500 ? `Service momentanément indisponible (${r.status}). Réessaie plus tard.`
    : `Erreur ${r.status}.`;
  return { msg: detail ? `${base}\nRéponse du service : ${detail}` : base, detail };
}
function addUsage(model, u, searches = 0) {
  const [pi, po, pr, pw] = priceOf(model);
  const usd = ((u.input || 0) * pi + (u.output || 0) * po + (u.cacheRead || 0) * pr + (u.cacheWrite || 0) * pw) / 1e6 + searches * WEB_SEARCH_USD;
  const k = monthKey(), m = S.usage[k] ||= { usd: 0, n: 0 };
  m.usd += usd; m.n++;
  return usd;
}
function budgetCheck() {
  const b = aiCfg().budget;
  if (b && monthSpend() >= b) throw new AIError(`Plafond mensuel atteint (${fmtE2.format(b)}). Tu peux le relever dans Plus › Intelligence artificielle.`);
}
// Un appel au modèle. system : texte fixe ; context : texte mis en cache (cave) ; content : blocs du dernier message.
// Enveloppe : note chaque appel dans le suivi d'utilisation (type, durée, coût, réussite) et garde les erreurs
async function aiCall(opts) {
  const t0 = Date.now(), tag = opts.tag || 'autre';
  try {
    const r = await aiCall0(opts);
    uLog('ai', tag, `ok,${Date.now() - t0},${(r.usd || 0).toFixed(4)}`);
    return r;
  } catch (e) {
    uLog('ai', tag, `err,${Date.now() - t0},0`); errLog('ia:' + tag, e);
    throw e;
  }
}
async function aiCall0({ system, context = '', history = [], content, schema = null, maxTokens = 4000, effort = 'medium', web = false }) {
  if (!aiReady()) throw new AIError('Aucune clé IA configurée. Va dans Plus › Intelligence artificielle.');
  if (navigator.onLine === false) throw new AIError('Pas de connexion réseau.');
  budgetCheck();
  const cfg = aiCfg(), model = aiModel();
  if (!aiClaude()) return mistralCall({ system, context, history, content, schema, maxTokens, model, cfg });
  const sys = [{ type: 'text', text: system }];
  if (context) sys.push({ type: 'text', text: context, cache_control: { type: 'ephemeral' } });
  const msgs = [...history, { role: 'user', content: typeof content === 'string' ? [{ type: 'text', text: content }] : content }];
  const body = { model, max_tokens: maxTokens, system: sys, messages: msgs, output_config: { effort } };
  if (schema) body.output_config.format = { type: 'json_schema', schema };
  if (web) body.tools = [{ type: 'web_search_20260209', name: 'web_search', max_uses: 3 }];
  const fb = !aiNoFallback && /sonnet-5-5|opus-5/.test(model);
  let out = { text: '', sources: [], usd: 0 };
  for (let turn = 0; turn < 4; turn++) {
    const headers = { 'content-type': 'application/json', 'x-api-key': cfg.key, 'anthropic-version': '2026-10-21', 'anthropic-dangerous-direct-browser-access': 'true' };
    const b = { ...body };
    if (fb && !aiNoFallback) { b.fallbacks = 'default'; headers['anthropic-beta'] = 'server-side-fallback-2026-07-01'; }
    let r;
    try { r = await fetch(AI.anthropic.url, { method: 'POST', headers, body: JSON.stringify(b) }); }
    catch { throw new AIError('Impossible de joindre le service. Vérifie ta connexion.'); }
    if (!r.ok) {
      const e = await apiError(r);
      // Le paramètre de repli n'est pas accepté par ce compte ou ce modèle : on réessaie sans lui
      if (r.status === 400 && b.fallbacks && /fallback/i.test(e.detail)) { aiNoFallback = true; turn--; continue; }
      throw new AIError(e.msg);
    }
    const j = await r.json();
    const u = j.usage || {};
    out.usd += addUsage(j.model || model, { input: u.input_tokens, output: u.output_tokens, cacheRead: u.cache_read_input_tokens, cacheWrite: u.cache_creation_input_tokens }, u.server_tool_use?.web_search_requests || 0);
    for (const c of j.content || []) {
      if (c.type === 'text') out.text += c.text;
      if (c.type === 'web_search_tool_result' && Array.isArray(c.content)) for (const s of c.content) if (s.url) out.sources.push({ url: s.url, title: s.title });
    }
    if (j.stop_reason === 'refusal') throw new AIError('Le modèle a refusé de répondre à cette demande. Reformule-la.');
    if (j.stop_reason === 'pause_turn') { body.messages = [...msgs, { role: 'assistant', content: j.content }]; continue; }
    if (j.stop_reason === 'max_tokens') throw new AIError('Réponse trop longue, interrompue. Réessaie avec une demande plus courte.');
    break;
  }
  if (mode === 'app') save();
  out.text = out.text.trim();
  if (schema) { try { out.json = JSON.parse(out.text); } catch { throw new AIError('Réponse illisible. Réessaie.'); } }
  return out;
}
async function mistralCall({ system, context, history, content, schema, maxTokens, model, cfg }) {
  if (typeof content !== 'string') {
    if (content.some(c => c.type !== 'text')) throw new AIError('La lecture d’images et de PDF n’est disponible qu’avec Claude. Change de fournisseur dans Plus › Intelligence artificielle.');
    content = content.map(c => c.text).join('\n');
  }
  const flat = m => typeof m.content === 'string' ? m.content : m.content.map(c => c.text || '').join('\n');
  const sys = system + (context ? '\n\n' + context : '') + (schema ? '\n\nRéponds uniquement par un objet JSON conforme à ce schéma :\n' + JSON.stringify(schema) : '');
  const body = { model, max_tokens: maxTokens, messages: [{ role: 'system', content: sys }, ...history.map(m => ({ role: m.role, content: flat(m) })), { role: 'user', content }] };
  if (schema) body.response_format = { type: 'json_object' };
  let r;
  try { r = await fetch(AI.mistral.url, { method: 'POST', headers: { 'content-type': 'application/json', authorization: 'Bearer ' + cfg.key }, body: JSON.stringify(body) }); }
  catch { throw new AIError('Impossible de joindre le service. Vérifie ta connexion.'); }
  if (!r.ok) throw new AIError((await apiError(r)).msg);
  const j = await r.json();
  const usd = addUsage(model, { input: j.usage?.prompt_tokens, output: j.usage?.completion_tokens });
  if (mode === 'app') save();
  const text = (j.choices?.[0]?.message?.content || '').trim();
  const out = { text, sources: [], usd };
  if (schema) { try { out.json = JSON.parse(text.replace(/^```(json)?|```$/g, '')); } catch { throw new AIError('Réponse illisible. Réessaie.'); } }
  return out;
}
// Extrait le dernier objet JSON d'un texte libre (réponse avec recherche web)
function lastJson(t) {
  const fences = [...t.matchAll(/```(?:json)?\s*([\s\S]*?)```/g)].map(m => m[1]);
  for (const c of fences.reverse()) { try { return JSON.parse(c); } catch {} }
  const end = t.lastIndexOf('}');
  for (let i = t.lastIndexOf('{', end); i >= 0; i = i ? t.lastIndexOf('{', i - 1) : -1) { try { return JSON.parse(t.slice(i, end + 1)); } catch {} }
  return null;
}

/* ---------- Contexte de cave envoyé au sommelier ---------- */
function caveContext(allSites) {
  const y = thisYear(), cur = S.settings.site, multi = isMulti();
  const rows = [], ws = S.wines.filter(w => kindOn(w) && myBottles(w.id).length);
  for (const w of ws) {
    const bs = myBottles(w.id).filter(b => allSites || !multi || siteOfBottle(b) === cur);
    const elsewhere = multi && !allSites ? myBottles(w.id).length - bs.length : 0;
    if (!bs.length && !elsewhere) continue;
    const locs = [...new Set(bs.map(b => locLabel(b, multi)))].map(l => `${l} ×${bs.filter(b => locLabel(b, multi) === l).length}`).join(' ; ');
    const ts = S.tastings.filter(t => t.wineId === w.id), tn = ts.filter(t => t.note != null), avg = tn.length ? tn.reduce((n, t) => n + t.note, 0) / tn.length : null;
    const st = status(w), a = w.apogee;
    const parts = [`id=${w.id}`, w.kind === 'spirit' ? `SPIRITUEUX ${SPIRIT_CATS[w.cat]}` : COLORS[w.couleur]?.label, wineTitle(w), w.domaine && `domaine ${w.domaine}`,
      w.kind === 'spirit' ? [w.age && w.age + ' ans', w.fut, w.degre && w.degre + ' %'].filter(Boolean).join(', ') : [w.appellation, w.region].filter(Boolean).join(', '),
      w.cepages && `cépages ${w.cepages}`, `${bs.length} bouteille(s) ici${bs.length ? ' : ' + locs : ''}${elsewhere ? `, ${elsewhere} sur l’autre site` : ''}`,
      w.kind !== 'spirit' && (a?.fin ? `fenêtre ${a.debut || '?'}–${a.fin}${a.pic ? ' apogée ' + a.pic : ''} (${STATUS[st].label.toLowerCase()})` : 'fenêtre inconnue'),
      bs.some(b => b.state === 'open') && `ouverte, niveau ${bs.find(b => b.state === 'open').level ?? 100} %`,
      w.service && `servir à ${w.service}`, w.notes && /Accords Ploc/.test(w.notes) && w.notes.match(/Accords Ploc : [^\n]{0,160}/)?.[0],
      w.achat?.prix != null && `prix ${Math.round(w.achat.prix)} €`, w.format && w.format !== '75' && w.format !== '70' && `format ${w.format} cl`,
      avg != null && `déjà dégusté : ${numFr(avg)}/20${ts.at(-1)?.comment ? ' « ' + ts.at(-1).comment.slice(0, 80) + ' »' : ''}`];
    rows.push({ w, line: '- ' + parts.filter(Boolean).join(' | ') });
  }
  // Grosse cave : on ne détaille que les vins les plus utiles (à boire, prêts, bientôt prêts, dégustés récemment), 300 au plus
  let lines = rows.map(o => o.line), reduced = '';
  if (rows.length > 300) {
    const since = new Date(Date.now() - 180 * 864e5).toISOString().slice(0, 10), recent = new Set(S.tastings.filter(t => (t.at || '') >= since).map(t => t.wineId));
    const rank = w => { const st = status(w); return w.kind === 'spirit' ? 2 : st === 'prio' ? 0 : st === 'apogee' ? 1 : st === 'tot' && w.apogee?.debut <= y + 1 ? 2 : recent.has(w.id) ? 3 : 9; };
    const keep = rows.filter(o => rank(o.w) < 9).sort((a, b) => rank(a.w) - rank(b.w) || (a.w.apogee?.fin || 9999) - (b.w.apogee?.fin || 9999)).slice(0, 300);
    const kept = new Set(keep.map(o => o.w.id)), rest = rows.filter(o => !kept.has(o.w.id));
    const count = f => Object.entries(rest.reduce((m, o) => { const k = f(o.w); m[k] = (m[k] || 0) + 1; return m; }, {})).map(([k, n]) => `${k} ${n}`).join(', ');
    lines = keep.map(o => o.line);
    reduced = `\nCave volumineuse : ${rest.length} autres références ne sont pas détaillées (par couleur : ${count(w => w.kind === 'spirit' ? 'spiritueux' : COLORS[w.couleur]?.label || '?')} ; par statut : ${count(w => STATUS[status(w) || 'inconnu']?.short || '?')}). Si la demande porte sur elles, dis-le à l’utilisateur.`;
  }
  const sites = S.sites.map(s => `${s.name} (${s.role === 'stock' ? 'stockage' : 'consommation'}${s.id === cur ? ', l’utilisateur y est actuellement' : ''})`).join(' ; ');
  const top = [...S.tastings].filter(t => t.note != null && wine(t.wineId)).sort((a, b) => b.note - a.note);
  const liked = top.slice(0, 6).map(t => `${wineTitle(wine(t.wineId) || {})} ${numFr(t.note)}/20`).filter(x => !x.startsWith('undefined'));
  const disliked = top.filter(t => t.note < 12).slice(-4).map(t => `${wineTitle(wine(t.wineId) || {})} ${numFr(t.note)}/20`);
  const tw = t => wine(t.wineId) || {};
  const outside = S.tastings.filter(t => !t.bottleId && wine(t.wineId) && !isFriend(tw(t))).sort((a, b) => (b.at || '').localeCompare(a.at || '')).slice(0, 15)
    .map(t => `${wineTitle(tw(t))} (${[COLORS[tw(t).couleur]?.label, tw(t).region].filter(Boolean).join(', ')}) ${t.note != null ? numFr(t.note) + '/20' : ''}${t.type ? ', ' + TASTE_TYPES[t.type].toLowerCase() : ''}${t.comment ? ' « ' + t.comment.slice(0, 70) + ' »' : ''}`);
  const accords = S.tastings.filter(t => t.accord && t.plat && wine(t.wineId)).slice(-12).map(t => `${t.plat} + ${wineTitle(tw(t))} : ${ACCORDS[t.accord].toLowerCase()}`);
  const wishes = S.wishes.map(x => wine(x.wineId)).filter(Boolean).map(wineTitle);
  return `Date du jour : ${today()} (année ${y}).
${outside.length ? `Vins dégustés hors de la cave (récents) : ${outside.join(' ; ')}.` : ''}
${accords.length ? `Accords déjà essayés par l’utilisateur : ${accords.join(' ; ')}.` : ''}
${wishes.length ? `Liste d’envies (vins qu’il veut acheter) : ${wishes.join(' ; ')}.` : ''}
${multi ? `Sites : ${sites}.${allSites ? ' Bouteilles de tous les sites.' : ' Liste limitée au site actuel.'}` : ''}
${liked.length ? `Vins les mieux notés par l’utilisateur : ${liked.join(' ; ')}.` : ''}${disliked.length ? `\nVins peu appréciés : ${disliked.join(' ; ')}.` : ''}
Cave disponible (${lines.length} références détaillées)${reduced} :
${lines.join('\n') || '(aucune bouteille)'}`;
}

/* ---------- Sommelier (conversation) ---------- */
const SOMM_SYS = () => `Tu es le sommelier personnel d’un amateur français. Tu conseilles des bouteilles de SA cave, listée dans le contexte, pour des accords mets-vins, des occasions, ou ce qu’il faut boire en priorité.
Règles :
- Ne recommande que des bouteilles de la liste, en citant leur id exact. N’invente aucune bouteille. Si rien ne convient, dis-le franchement et propose dans « achats » 1 à 3 vins à acheter (appellation, style, budget indicatif).
- Ordre de priorité : 1) vin dans sa fenêtre de dégustation, 2) qualité de l’accord, 3) bouteilles en fin de fenêtre à boire avant les autres, 4) préserve les grandes bouteilles (prix élevé, grands crus) sauf si l’occasion est « grande occasion », 5) respecte le budget de l’occasion : quotidien = bouteilles modestes, entre amis = milieu de gamme, grande occasion = les meilleures.
- Évite de proposer un vin « trop tôt » ou « en déclin » sauf demande explicite ou faute de mieux (et dis-le).
- Propose en général 3 bouteilles au plus, la meilleure en premier. Un vin par plat uniquement si on te demande un menu complet ; indique alors le plat dans « plat ».
- Pour chaque recommandation : raison de l’accord en une ou deux phrases concrètes, température de service (ex. « 16 °C »), carafage (ex. « Carafe 30 min » ou « Sans carafe »).
- Tiens compte des notes et commentaires passés, y compris des vins dégustés hors de la cave, pour les goûts de l’utilisateur. Appuie-toi sur les accords qu’il a jugés parfaits, évite de reproduire ceux qu’il a jugés ratés. Pour les suggestions d’achat, pense à sa liste d’envies.
- Si la liste est limitée au site actuel et qu’une bouteille idéale est sur l’autre site, tu peux le mentionner dans le message.
${spiritsOn() ? `- La cave contient aussi des spiritueux (marqués SPIRITUEUX) : propose-les pour un digestif, une dégustation ou un accord (chocolat, fromage, dessert, cigare).${S.settings.cocktails ? ' Tu peux suggérer un cocktail réalisable avec un spiritueux de la cave, recette courte dans le message.' : ' Ne propose pas de cocktails.'}` : '- Ne propose pas de spiritueux ni de cocktails.'}
- « message » : réponse courte et chaleureuse, en français, en tutoyant, 80 mots maximum, sans markdown. « relances » : 2 ou 3 suggestions de questions de suivi très courtes (moins de 6 mots).`;
const SOMM_SCHEMA = {
  type: 'object', additionalProperties: false, required: ['message', 'recos', 'achats', 'relances'],

      id: { type: 'string' }, role: { type: 'string', description: 'Étiquette courte : « Mon choix », « Plus frais », « Pour le fromage »…' }, raison: { type: 'string' }, temperature: { type: 'string' }, carafe: { type: 'string' }, plat: { type: 'string' } } } },
    achats: { type: 'array', items: { type: 'string' } },
    relances: { type: 'array', items: { type: 'string' } },
  },
};
let chatOpts = { occasion: '', all: false };
const OCCASIONS = { quotidien: 'Quotidien', amis: 'Entre amis', grande: 'Grande occasion' };
function vSomm() {
  const msgs = S.chat;
  const starters = ['Ce soir : poulet rôti', 'Un apéritif pour 6', 'Que boire en priorité ?', 'Un vin pour un plateau de fromages', 'Que cuisiner avec mon meilleur rouge ?', ...(spiritsOn() ? ['Un digestif après le repas', ...(S.settings.cocktails ? ['Un cocktail avec ma cave'] : [])] : [])];
  const body = msgs.length ? msgs.map(chatMsg).join('') : `<div class="card"><b>Que veux-tu boire ?</b><p class="small" style="margin:6px 0 0">Décris ton plat ou l’occasion. Je choisis dans ta cave${isMulti() ? `, d’abord à ${esc(site(S.settings.site)?.name)}` : ''}, en privilégiant les bouteilles à leur apogée.</p>
      <div class="chips wrap">${starters.map(s => `<button class="chip" data-act="chatAsk" data-q="${esc(s)}">${esc(s)}</button>`).join('')}</div></div>
      ${!aiReady() ? `<div class="banner">Pour activer le sommelier, ajoute une clé API dans Plus › Intelligence artificielle.<br><button class="btn small primary" data-act="aiSettings">Configurer</button></div>` : ''}`;
  return `${body}${chatBusy ? '<div class="bubble ai"><span class="typing"><i></i><i></i><i></i></span></div>' : ''}`;

function chatMsg(m, i) {
  if (m.role === 'user') return `<div class="bubble me">${esc(m.text)}</div>`;
  if (m.error) return `<div class="bubble ai err">${esc(m.error)}</div>${i === S.chat.length - 1 ? '<button class="link" style="font-size:13px" data-act="problem">Signaler un problème</button>' : ''}`;
  const d = m.data || {}, last = i === S.chat.length - 1;
  const recos = (d.recos || []).map((r, k) => {
    const w = wine(r.id); if (!w) return '';
    const bs = wineBottles(w.id), st = status(w), b = pickBottle(w);
    return `<div class="reco${k === 0 ? ' first' : ''}"><div class="rk">${k + 1} · ${esc(r.role || (k ? 'Alternative' : 'Mon choix'))}${r.plat ? ' · ' + esc(r.plat) : ''}</div>
      <div class="rn">${esc(wineTitle(w))}</div><div class="rs">${esc(wineSub(w))} · ${plural(bs.length, 'bouteille', 'bouteilles')}</div>
      <div class="why">${esc(r.raison)}</div>
      <div class="tags" style="margin-top:8px">${st && st !== 'inconnu' ? `<span class="tag ${STATUS[st].tag}">${STATUS[st].short}</span>` : ''}${r.temperature ? `<span class="tag">${esc(r.temperature)}</span>` : ''}${r.carafe ? `<span class="tag">${esc(r.carafe)}</span>` : ''}${w.achat?.prix ? `<span class="tag">~${eur(w.achat.prix)}</span>` : ''}</div>
      ${b ? `<div class="loc">${ICON.pin}${esc(locLabel(b))}</div>` : ''}
      ${b ? `<div class="btns2" style="margin-top:10px"><button class="btn primary small" data-act="takeIt" data-w="${w.id}">Je la prends</button><button class="btn small" data-act="wine" data-id="${w.id}">Fiche</button></div>` : '<p class="tiny">Plus de bouteille disponible.</p>'}</div>`;
  }).join('');
  const gone = (d.recos || []).filter(r => !wine(r.id)).length;
  return `<div class="bubble ai">${esc(d.message || '')}</div>${recos}${gone ? `<p class="tiny" style="margin:6px 4px 0">${gone > 1 ? gone + ' recommandations ne correspondent' : 'Une recommandation ne correspond'} plus à ta cave.</p>` : ''}
    ${d.achats?.length ? `<div class="card"><div class="ct">À acheter</div>${d.achats.map(a => `<p class="small" style="margin:4px 0;color:var(--ink)">• ${esc(a)}</p>`).join('')}</div>` : ''}
    ${last && d.relances?.length ? `<div class="chips wrap">${d.relances.map(q => `<button class="chip" data-act="chatAsk" data-q="${esc(q)}">${esc(q)}</button>`).join('')}</div>` : ''}`;
}
// Bouteille à sortir pour un vin : sur le site actuel, dans l'espace de consommation, rangée, déjà ouverte d'abord
function pickBottle(w) {
  const bs = myBottles(w.id).length ? myBottles(w.id) : wineBottles(w.id);
  const score = b => (b.state === 'open' ? 8 : 0) + (siteOfBottle(b) === S.settings.site ? 4 : 0) + (space(b.spaceId)?.use === 'conso' ? 2 : 0) + (b.unitId ? 1 : 0);
  return bs.sort((a, b) => score(b) - score(a))[0] || null;
}
function composer() {
  return `<div class="composer">
    <div class="chips" style="margin:0 0 6px">${Object.entries(OCCASIONS).map(([k, l]) => `<button class="chip soft${chatOpts.occasion === k ? ' on' : ''}" data-act="chatOcc" data-k="${k}">${l}</button>`).join('')}
      ${isMulti() ? `<button class="chip soft${chatOpts.all ? ' on' : ''}" data-act="chatAll">Inclure tous les sites</button>` : ''}</div>
    <form class="box" data-form="chat">${S.chat.length ? `<button type="button" class="newc" data-act="chatNew" aria-label="Nouvelle conversation" title="Nouvelle conversation" ${chatBusy ? 'disabled' : ''}>${ICON.newchat}</button>` : ''}<textarea name="q" rows="1" placeholder="Demande au sommelier…" data-in="grow" enterkeyhint="send"></textarea>
      <button class="send" type="submit" aria-label="Envoyer" ${chatBusy ? 'disabled' : ''}>${ICON.send}</button></form></div>`;
}
INPUTS.grow = el => { el.style.height = 'auto'; el.style.height = Math.min(120, el.scrollHeight) + 'px'; };
async function chatSend(q) {
  q = (q || '').trim(); if (!q || chatBusy) return;
  if (!aiReady()) return ACT.aiSettings();
  const ctxNote = [chatOpts.occasion && `Occasion : ${OCCASIONS[chatOpts.occasion].toLowerCase()}.`].filter(Boolean).join(' ');
  S.chat.push({ role: 'user', text: q, at: Date.now() });
  chatBusy = true; chatScroll = true; render();
  const hist = S.chat.slice(-13, -1).filter(m => !m.error).map(m => m.role === 'user' ? { role: 'user', content: m.text } : { role: 'assistant', content: JSON.stringify(m.data) });
  // L'historique doit commencer par un message de l'utilisateur et alterner
  while (hist.length && hist[0].role !== 'user') hist.shift();
  const clean = []; for (const m of hist) { if (clean.length && clean.at(-1).role === m.role) clean.pop(); clean.push(m); }
  if (clean.length && clean.at(-1).role === 'user') clean.pop();
  try {
    const r = await aiCall({ tag: 'sommelier', system: SOMM_SYS(), context: caveContext(chatOpts.all), history: clean, content: [{ type: 'text', text: (ctxNote ? ctxNote + '\n' : '') + q, cache_control: { type: 'ephemeral' } }], schema: SOMM_SCHEMA, maxTokens: 3000, effort: 'medium' });
    S.chat.push({ role: 'assistant', data: r.json, at: Date.now(), usd: r.usd });
  } catch (e) {
    S.chat.push({ role: 'assistant', error: e instanceof AIError ? e.message : 'Erreur inattendue : ' + (e.message || e), at: Date.now() });
  }
  chatBusy = false; chatScroll = true;
  if (S.chat.length > 60) S.chat = S.chat.slice(-60);
  await save(); if (view === 'somm') render();
}
FORMS.chat = (f, d) => chatSend(d.q);
Object.assign(ACT, {
  chatAsk: t => chatSend(t.dataset.q),
  chatNew: async () => {
    if (chatBusy || !S.chat.length || !confirm('Commencer une nouvelle conversation ? La conversation actuelle sera effacée.')) return;
    S.chat = []; await save(); render(); window.scrollTo(0, 0);
  },
  chatOcc: t => { chatOpts.occasion = chatOpts.occasion === t.dataset.k ? '' : t.dataset.k; $$('.composer [data-act=chatOcc]').forEach(b => b.classList.toggle('on', b.dataset.k === chatOpts.occasion)); },
  chatAll: t => { chatOpts.all = !chatOpts.all; t.classList.toggle('on', chatOpts.all); },
  takeIt: t => { const b = pickBottle(wine(t.dataset.w)); if (b) showSheet(() => outSheet(b.id)); },
});

/* ---------- Fenêtre de dégustation (apogée) ---------- */
const APO_SYS = `Tu es un sommelier expert du vieillissement des vins. On te donne un vin d’une cave personnelle et ses conditions de stockage.
Estime sa fenêtre de dégustation : année de début (le vin devient agréable), année d’apogée, année de fin (au-delà il décline). Tiens compte du millésime, de l’appellation, du producteur, de la cuvée, du format (un magnum évolue plus lentement) et des conditions de stockage (une cave de qualité moyenne ou faible raccourcit la garde). S’il y a des notes de dégustation récentes, elles priment sur la théorie.
Si un outil de recherche web est disponible, fais une ou deux recherches ciblées (critiques, fiches du producteur, appréciation du millésime) avant de conclure.
Termine ta réponse par un bloc JSON : {"debut": année, "pic": année, "fin": année, "justification": "deux phrases maximum en français", "confiance": "haute|moyenne|faible"}.`;
function wineBrief(w) {
  const bs = wineBottles(w.id), sps = [...new Set(bs.map(b => b.spaceId))].map(space).filter(Boolean);
  const ts = S.tastings.filter(t => t.wineId === w.id).slice(-3);
  return [`Vin : ${wineTitle(w)}`, `Couleur : ${COLORS[w.couleur]?.label || '?'}`, w.domaine && `Producteur : ${w.domaine}`, w.cuvee && `Cuvée : ${w.cuvee}`,
    w.appellation && `Appellation : ${w.appellation}`, (w.region || w.pays) && `Région : ${[w.region, w.pays].filter(Boolean).join(', ')}`, w.cepages && `Cépages : ${w.cepages}`,
    `Millésime : ${w.millesime || 'non millésimé'}`, w.format && w.format !== '75' && `Format : ${w.format} cl`,
    sps.length && `Stockage : ${sps.map(s => `${s.name} (qualité ${qualityLabel(spaceQuality(s)).toLowerCase()} : ${Object.entries(s.q || {}).map(([k, v]) => QUALITY[k]?.opts[v]).filter(Boolean).join(', ') || 'conditions non renseignées'})`).join(' ; ')}`,
    ts.length && `Dégustations : ${ts.map(t => `${t.at} ${t.note != null ? numFr(t.note) + '/20' : ''} ${t.full?.evolution ? '(' + t.full.evolution + ')' : ''} ${t.comment || ''}`.trim()).join(' ; ')}`,
    `Année actuelle : ${thisYear()}`].filter(Boolean).join('\n');
}
const yearOk = (y, w) => Number.isInteger(y) && y >= 1900 && y <= 2200 && (!w.millesime || y >= w.millesime);
async function estimateApogee(wid, { quiet = false } = {}) {
  const w = wine(wid); if (!w || w.kind === 'spirit') return;
  if (!quiet) toast('Le sommelier étudie ce vin…');
  try {
    const r = await aiCall({ tag: 'apogee', system: APO_SYS, content: wineBrief(w), maxTokens: 6000, effort: 'medium', web: aiClaude() && aiCfg().web });
    const j = lastJson(r.text);
    if (!j) throw new AIError('Estimation illisible. Réessaie.');
    const cw = cleanWindow(j.debut, j.pic, j.fin, w.millesime);
    if (!cw) throw new AIError('Estimation incohérente (années dans le désordre ou impossibles) : elle a été ignorée. Réessaie.');
    w.apogee = { ...cw, why: String(j.justification || '').slice(0, 400), conf: j.confiance, src: 'ia', sources: r.sources.slice(0, 5), at: Date.now() };
    await save(); render(); if (sheetStack.length) refreshSheet();
    toast(`Fenêtre estimée : ${windowLabel(w.apogee)}`);
  } catch (e) {
    if (quiet) toast('Apogée non estimée : ' + (e.message || '').split('\n')[0]);
    else errSheet('Estimation impossible', e.message || String(e));
  }
}
// Estimation groupée, sans recherche web (import, vins sans fenêtre)
const BATCH_SCHEMA = { type: 'object', additionalProperties: false, required: ['items'], properties: { items: { type: 'array', items: { type: 'object', additionalProperties: false, required: ['i', 'debut', 'pic', 'fin'], properties: { i: { type: 'integer' }, debut: { type: 'integer' }, pic: { type: 'integer' }, fin: { type: 'integer' } } } } } };
async function estimateBatch(ws, onStep) {
  let done = 0;
  for (let k = 0; k < ws.length; k += 30) {
    const chunk = ws.slice(k, k + 30);
    const r = await aiCall({ tag: 'apogee-lot', system: APO_SYS.replace(/Si un outil[\s\S]*?conclure\.\n/, '').replace(/Termine ta réponse[\s\S]*$/, 'Réponds pour chaque vin avec son numéro i.'), content: chunk.map((w, i) => `#${i}\n${wineBrief(w)}`).join('\n\n'), schema: BATCH_SCHEMA, maxTokens: 6000, effort: 'low' });
    for (const it of r.json.items || []) {
      const w = chunk[it.i], cw = w && cleanWindow(it.debut, it.pic, it.fin, w.millesime); if (!cw) continue;
      w.apogee = { ...cw, src: 'ia', why: 'Estimation groupée, sans recherche web.', at: Date.now() };
      done++;
    }
    onStep?.(Math.min(ws.length, k + 30), ws.length);
  }
  await save();
  return done;
}
Object.assign(ACT, {
  estimate: t => { if (!aiReady()) return ACT.aiSettings(); closeSheet(); estimateApogee(t.dataset.id).then(() => showSheet(() => wineSheet(t.dataset.id))); },
  estimateMissing: async () => {
    if (!aiReady()) return ACT.aiSettings();
    const ws = S.wines.filter(w => w.kind === 'vin' && !w.apogee?.fin && wineBottles(w.id).length);
    if (!ws.length) return toast('Toutes les fenêtres sont connues');
    if (!confirm(`Estimer la fenêtre de ${plural(ws.length, 'vin', 'vins')} ? Coût indicatif : moins de ${fmtE2.format(Math.max(0.02, ws.length * 0.004))}.`)) return;
    toast('Estimation en cours…');
    try { const n = await estimateBatch(ws); render(); toast(`${plural(n, 'fenêtre estimée', 'fenêtres estimées')}`); }
    catch (e) { errSheet('Estimation impossible', e.message || String(e)); }
  },
});

/* ---------- Lecture d'étiquette ---------- */
const LABEL_SCHEMA = {
  type: 'object', additionalProperties: false,

/* ---------- Import depuis Ploc (PDF) ----------
   Un export Ploc porte sur une cave : un plan (grille de ronds numérotés), une légende (numéro → vin)
   et une fiche par vin. Les champs remplis dans Ploc sont repris tels quels ; le sommelier ne complète
   que les champs vides et donne son avis sur la fenêtre de garde. Le rapprochement avec les sites se fait
   ici, sur l'appareil : la liste des sites n'est jamais envoyée à l'IA. */
const PLOC_SCHEMA = { type: 'object', additionalProperties: false, required: ['caves', 'vins'], properties: {
  caves: { type: 'array', items: { type: 'object', additionalProperties: false, required: ['nom', 'lignes', 'colonnes', 'cases'], properties: {
    nom: { type: 'string' }, lignes: { type: 'integer' }, colonnes: { type: 'integer' },
    cases: { type: 'array', items: { type: 'object', additionalProperties: false, required: ['ligne', 'colonne', 'numero'], properties: { ligne: { type: 'integer' }, colonne: { type: 'integer' }, numero: { type: 'integer' } } } } } } },
  vins: { type: 'array', items: { type: 'object', additionalProperties: false,
    required: ['numero', 'titre', 'millesime', 'couleur', 'alcool', 'apogee', 'estimation', 'producteur', 'pays', 'region', 'appellation', 'cepages', 'cuvee', 'contenance', 'stock', 'caves', 'servir', 'accords', 'note'],
    properties: { numero: { type: 'integer' }, titre: { type: 'string' }, millesime: { type: 'string' }, couleur: { type: 'string' }, alcool: { type: 'string' }, apogee: { type: 'string' },
      estimation: { type: 'string' }, producteur: { type: 'string' }, pays: { type: 'string' }, region: { type: 'string' }, appellation: { type: 'string' }, cepages: { type: 'string' },
      cuvee: { type: 'string' }, contenance: { type: 'string' }, stock: { type: 'integer' }, servir: { type: 'string' }, accords: { type: 'string' }, note: { type: 'string' },
      caves: { type: 'array', items: { type: 'object', additionalProperties: false, required: ['nom', 'quantite'], properties: { nom: { type: 'string' }, quantite: { type: 'integer' } } } } } } } } };
const PLOC_SYS = `Tu lis un PDF exporté par l’application Ploc et tu en recopies le contenu, sans rien inventer ni corriger.
Structure habituelle : une page de plan (une grille de ronds ; un rond occupé porte le numéro d’un vin), une page de légende (numéro → millésime et nom du vin), puis une fiche par vin (tableau COULEUR, ALCOOL, APOGÉE, ESTIMATION, PRODUCTEUR, PAYS, RÉGION, APPELLATION, CÉPAGES, STOCK, CONTENANCE, CAVE ou CAVES, SERVIR À, ACCORDS, CLASSEMENT, CUVÉE…).
- « caves » : un élément par plan présent dans le PDF. « nom » : le nom de la cave tel qu’écrit au-dessus du plan. « lignes » et « colonnes » : dimensions de la grille, ronds vides compris. « cases » : uniquement les ronds occupés, avec ligne (1 = en haut) et colonne (1 = à gauche) et le numéro inscrit. Aucun plan : liste vide.
- « vins » : une entrée par fiche. « numero » : son numéro dans la légende (0 si absent). « titre » : le grand titre de la fiche, sans le millésime. « millesime » : l’année affichée, ou vide.
- Recopie chaque champ de la fiche tel qu’écrit (« 2021/2028 », « 15€ », « 750ml », « 10-12° »…) ; chaîne vide si le champ est vide sur la fiche.
- « caves » d’un vin : chaque cave citée dans CAVE ou CAVES avec sa quantité (« Cave A : 1, Étagère B : 2 » donne deux éléments). « stock » : le nombre STOCK.
- « note » : le nombre écrit en haut à droite, au-dessus du trait et de « 100 » (ex. « 75 »). S’il n’y a que « 100 » sous le trait, la note est vide.
- Un autre format (simple liste) : remplis ce que tu trouves, caves vide.`;
const PLOC_FILL_SCHEMA = { type: 'object', additionalProperties: false, required: ['items'], properties: { items: { type: 'array', items: { type: 'object', additionalProperties: false,
  required: ['i', 'producteur', 'appellation', 'region', 'pays', 'cepages', 'couleur', 'debut', 'pic', 'fin', 'justification'],
  properties: { i: { type: 'integer' }, producteur: { type: 'string' }, appellation: { type: 'string' }, region: { type: 'string' }, pays: { type: 'string' }, cepages: { type: 'string' },
    couleur: { type: 'string', enum: ['', 'rouge', 'blanc', 'rose', 'effervescent', 'liquoreux', 'orange'] }, debut: { type: 'integer' }, pic: { type: 'integer' }, fin: { type: 'integer' }, justification: { type: 'string' } } } } } };
const PLOC_FILL_FIELDS = { producteur: 'producteur', appellation: 'appellation', region: 'région', pays: 'pays', cepages: 'cépages', couleur: 'couleur' };
let plocData = null;

/* Lecture des valeurs Ploc */
const plocText = (s, n = 200) => String(s ?? '').replace(/\s+/g, ' ').trim().slice(0, n);
function plocColor(s) {
  const x = norm(s);
  if (!x) return '';
  if (/efferv|petill|mousseu|champagne|cremant/.test(x)) return 'effervescent';
  if (/liquor|moelleu|doux/.test(x)) return 'liquoreux';
  if (/ros/.test(x)) return 'rose';
  if (/rouge/.test(x)) return 'rouge';
  if (/orange/.test(x)) return 'orange';
  if (/blanc/.test(x)) return 'blanc';
  return '';
}
// « 750ml » → '75', « 1,5 l » → '150', « 37,5 cl » → '37.5' ; inconnu → bouteille
function plocFormat(s) {
  const m = String(s || '').toLowerCase().replace(/\s/g, '').match(/(\d+(?:[.,]\d+)?)(ml|cl|l)/);
  if (!m) return '75';
  const v = +m[1].replace(',', '.'), cl = m[2] === 'ml' ? v / 10 : m[2] === 'l' ? v * 100 : v;
  const f = FORMATS.vin.find(([k]) => Math.abs(+k - cl) < 0.6);
  return f ? f[0] : '75';
}
// « 2021/2028 » → fenêtre 2021–2028, apogée au milieu
function plocWindow(s, mill) {
  const ys = (String(s || '').match(/\b(19|20|21)\d{2}\b/g) || []).map(Number);
  if (ys.length < 2) return null;
  const deb = Math.min(ys[0], ys[1]), fin = Math.max(ys[0], ys[1]);
  return cleanWindow(deb, Math.round((deb + fin) / 2), fin, mill);
}
// Note sur 100 → sur 20, au demi-point
function plocNote(s) {
  const n = num(String(s || '').replace(/\/\s*100/, ''));
  return n != null && n > 0 && n <= 100 ? Math.round(n / 5 * 2) / 2 : null;
}
// Retire une suite de mots (producteur, appellation) du titre, sans tenir compte des accents ni de la casse
function plocStrip(title, part) {
  const tk = String(title || '').split(/\s+/).filter(Boolean), pk = String(part || '').split(/\s+/).filter(Boolean).map(norm);
  if (!pk.length) return tk.join(' ');
  for (let i = 0; i + pk.length <= tk.length; i++) if (pk.every((p, j) => norm(tk[i + j]) === p)) { tk.splice(i, pk.length); break; }
  return tk.join(' ');
}
const plocCuvee = (title, prod, app) => plocStrip(plocStrip(title, prod), app).replace(/^[\s\-–—,·:]+|[\s\-–—,·:]+$/g, '').trim();
// Site d'une cave Ploc : « Maison - Cave 1 » → site « Maison » ; sinon un site dont le nom figure dans celui de la cave
const plocHint = name => name.includes(' - ') ? name.split(' - ')[0].trim() : '';
const plocWords = s => ' ' + norm(s).replace(/[^a-z0-9]+/g, ' ').trim() + ' ';
function plocSite(name) {
  const h = plocHint(name);
  return (h && S.sites.find(s => norm(s.name) === norm(h))) || S.sites.find(s => plocWords(s.name).trim().length >= 3 && plocWords(name).includes(plocWords(s.name)));
}
const plocUnitName = name => (plocHint(name) ? name.slice(name.indexOf(' - ') + 3) : name).trim() || name;
const plocKey = (w, it) => [norm(w.domaine), norm(w.cuvee || w.appellation), w.millesime || null].join('|') === [norm(it.domaine), norm(it.cuvee || it.appellation), it.millesime || null].join('|');
function plocDefaultUnit(c) {
  if (!c.plan || !c.spaceId) return c.plan ? 'new' : 'none';
  const same = spaceUnits(c.spaceId).find(u => !UNIT_TYPES[u.type].box && norm(u.name) === norm(c.unitName) && u.rows === c.plan.rows && u.cols === c.plan.cols);
  return same ? same.id : 'new';
}

async function onPdf(file) {
  if (!file) return;
  if (file.size > 25e6) return toast('PDF trop volumineux (25 Mo maximum)');
  const step = msg => showSheet(() => `${head('Import depuis Ploc')}<p>${esc(msg)}</p><div class="bubble ai"><span class="typing"><i></i><i></i><i></i></span></div>`, { replace: true });
  step('Lecture du PDF…');
  try {
    const data = b64(await file.arrayBuffer());
    const r = await aiCall({ tag: 'ploc', system: PLOC_SYS, content: [{ type: 'document', source: { type: 'base64', media_type: 'application/pdf', data } }, { type: 'text', text: 'Recopie le plan, la légende et les fiches de ce PDF.' }], schema: PLOC_SCHEMA, maxTokens: 32000, effort: 'low' });
    plocData = plocParse(r.json || {});
    if (!plocData.wines.length) { plocData = null; throw new AIError('Aucun vin trouvé dans ce PDF.'); }
    step(`${plural(plocData.wines.length, 'vin trouvé', 'vins trouvés')}. Le sommelier complète les fiches et vérifie les fenêtres de garde…`);
    await plocFill(plocData.wines, k => step(`Fiches vérifiées : ${k} / ${plocData.wines.length}…`));
    for (const it of plocData.wines) plocFinish(it);
    showSheet(plocReview, { replace: true, full: true });
  } catch (e) { plocData = null; showSheet(() => `${head('Import impossible')}<p style="white-space:pre-wrap">${esc(e.message || String(e))}</p><button class="btn wide" data-act="close">Fermer</button>`, { replace: true }); }
}
// Réponse de l'IA → caves et vins, valeurs bornées
function plocParse(j) {
  const caves = [], caveIdx = name => {

   Trois règles, sans IA :
   1. « Rapatrier » : un vin à boire en priorité qui dort dans un espace de garde → vers un espace de consommation ;
   2. « Mettre en garde » : un vin de longue garde dans un espace de consommation, ou dans une cave de moindre qualité
      qu'une autre disponible → vers le meilleur espace de garde ;
   3. « Réassort » : un espace de consommation avec un nombre de places cible, en dessous de sa cible
      → on le complète avec les vins prêts à boire des espaces de garde (les plus urgents d'abord). */
function moveAdvice() {
  const y = thisYear(), out = [], taken = new Set();
  const sps = S.spaces.map(s => ({ s, q: spaceQuality(s), site: site(s.siteId), known: Object.keys(s.q || {}).length > 0 }));
  const conso = sps.filter(o => o.s.use === 'conso'), garde = sps.filter(o => o.s.use !== 'conso');
  const bestConso = () => conso.sort((a, b) => (b.site?.role === 'conso') - (a.site?.role === 'conso') || (b.s.siteId === S.settings.site) - (a.s.siteId === S.settings.site))[0];
  const bestGarde = () => garde.filter(o => o.known).sort((a, b) => b.q - a.q)[0] || garde[0];
  const push = (kind, w, bs, to, why) => { if (!bs.length || !to) return; bs.forEach(b => taken.add(b.id)); out.push({ kind, w, ids: bs.map(b => b.id), from: bs[0].spaceId, to: to.s.id, why }); };
  const groups = new Map();
  for (const b of S.bottles) if (b.state === 'cave' && b.spaceId && !b.owner && !S.transfer.ids.includes(b.id)) { const k = b.wineId + '|' + b.spaceId; groups.set(k, [...(groups.get(k) || []), b]); }
  for (const [, bs] of groups) {
    const w = wine(bs[0].wineId); if (!w || w.kind === 'spirit') continue;
    const sp = sps.find(o => o.s.id === bs[0].spaceId); if (!sp) continue;
    const st = status(w), a = w.apogee;
    if (st === 'prio' && sp.s.use !== 'conso') { const to = bestConso(); push('rapatrier', w, bs, to, `À boire avant fin ${a.fin}`); continue; }
    const longue = st === 'tot' || (a?.fin && a.fin - y >= 6);
    if (longue) {
      const to = bestGarde();
      if (to && to.s.id !== sp.s.id && (sp.s.use === 'conso' || (sp.known && to.q > sp.q + 1)))
        push('garde', w, bs, to, sp.s.use === 'conso' ? `Vin de garde (jusqu’en ${a?.fin || '?'}) rangé dans un espace de consommation` : `Cave plus adaptée à la garde (qualité ${qualityLabel(to.q).toLowerCase()})`);
    }
  }
  // Réassort des espaces de consommation qui ont une cible
  for (const c of conso) {
    const target = c.s.target; if (!target) continue;
    const have = S.bottles.filter(b => inCave(b) && b.spaceId === c.s.id).length + out.filter(o => o.to === c.s.id).reduce((n, o) => n + o.ids.length, 0);
    let missing = target - have; if (missing <= 0) continue;
    const cands = S.bottles.filter(b => b.state === 'cave' && !taken.has(b.id) && !S.transfer.ids.includes(b.id) && garde.some(g => g.s.id === b.spaceId))
      .filter(b => !b.owner).map(b => ({ b, w: wine(b.wineId) })).filter(o => o.w && o.w.kind === 'vin' && ['prio', 'apogee'].includes(status(o.w)))
      .sort((p, q) => (p.w.apogee?.fin || 9999) - (q.w.apogee?.fin || 9999));
    const by = new Map();
    for (const { b, w } of cands) { if (missing <= 0) break; const k = w.id + '|' + b.spaceId; by.set(k, [...(by.get(k) || []), b]); missing--; }
    for (const [, bs] of by) push('reassort', wine(bs[0].wineId), bs, c, `Réassort de « ${c.s.name} » (cible ${target} bouteilles)`);
  }
  return out;
}
const ADVICE_KIND = { rapatrier: 'À rapprocher', garde: 'À mettre en garde', reassort: 'Réassort' };
function adviceSheet() {
  const adv = moveAdvice();
  const where = id => { const sp = space(id); return sp ? (isMulti() ? site(sp.siteId)?.name + ' › ' : '') + sp.name : '?'; };
  return `${head('Conseils de rangement')}

    ${adv.length ? Object.keys(ADVICE_KIND).map(k => { const l = adv.filter(a => a.kind === k); return l.length ? `<h3>${ADVICE_KIND[k]}</h3><div class="list">${l.map(a => {
      const cross = space(a.from)?.siteId !== space(a.to)?.siteId, i = adv.indexOf(a);
      return `<div class="li"><button class="lb" data-act="tBrief" data-b="${a.ids[0]}"><span class="dot" style="background:${wineColor(a.w)}"></span><div class="it"><b class="ell">${esc(wineTitle(a.w))} ×${a.ids.length}</b><small>${esc(where(a.from))} → <b style="color:var(--green)">${esc(where(a.to))}</b></small><small>${esc(a.why)}</small></div></button>
        <button class="btn small ${cross ? '' : 'primary'}" data-act="adviceGo" data-i="${i}">${cross ? 'Au transfert' : 'Ranger'}</button></div>`; }).join('')}</div>` : ''; }).join('')
    : '<p class="muted">Rien à déplacer pour l’instant : chaque vin est au bon endroit.</p>'}
    ${!S.spaces.some(s => Object.keys(s.q || {}).length) ? '<p class="tiny">Astuce : renseigne les conditions de stockage de tes espaces (Réglages › Sites, espaces et meubles) pour des conseils plus fins.</p>' : ''}`;
}

/* ---------- Sauvegarde ---------- */
async function exportBackup() {
  if (mode !== 'app') return toast('Crée ta cave pour pouvoir sauvegarder');
  const v = await seal();
  v.slots = { pw: slots.pw };   // ni Face ID ni clé d'appareil dans le fichier
  v.photos = {};
  for (const k of await store.keys()) if (String(k).startsWith('ph:')) v.photos[k.slice(3)] = await store.get(k);
  const name = `mycellar-sauvegarde-${today()}.json`;
  const blob = new Blob([JSON.stringify(v)], { type: 'application/json' });
  const file = new File([blob], name, { type: 'application/json' });
  let ok = false;
  if (navigator.canShare && navigator.canShare({ files: [file] })) {
    try { await navigator.share({ files: [file] }); ok = true; } catch (e) { if (e.name === 'AbortError') return; }
  }
  if (!ok) { const u = URL.createObjectURL(blob), a = document.createElement('a'); a.href = u; a.download = name; a.click(); setTimeout(() => URL.revokeObjectURL(u), 4000); }
  S.settings.lastExport = Date.now(); await save(); render(); toast('Sauvegarde exportée');
}
async function onBackupFile(file) {
  if (!file) return;
  try { pendingImport = JSON.parse(await file.text()); if (pendingImport.app !== 'mycellar') throw 0; }
  catch { pendingImport = null; return toast('Ce fichier n’est pas une sauvegarde MyCellar'); }
  showSheet(() => `${head('Restaurer une sauvegarde')}
    <p class="small">Sauvegarde du ${esc(new Date(pendingImport.savedAt || Date.now()).toLocaleDateString('fr-FR', { day: 'numeric', month: 'long', year: 'numeric' }))}. Elle remplacera la cave de cet appareil.</p>
    <form class="form" data-form="import">${USERFIELD}<label>Mot de passe de cette sauvegarde<input type="password" name="p" autocomplete="current-password" required></label>
      <p class="err" id="ierr" hidden></p><button class="btn primary wide" type="submit">Restaurer</button></form>`);
}
FORMS.import = async (f, d) => {
  const btn = f.querySelector('[type=submit]'); btn.disabled = true; btn.textContent = 'Déchiffrement…';
  try {
    const o = await openVault(pendingImport, { pass: d.p });
    if (mode === 'app' && S.wines.length && !confirm('Remplacer la cave actuelle de cet appareil par cette sauvegarde ?')) { btn.disabled = false; btn.textContent = 'Restaurer'; return; }
    for (const k of await store.keys()) if (String(k).startsWith('ph:')) await store.del(k);
    for (const [id, e] of Object.entries(pendingImport.photos || {})) await store.set('ph:' + id, e);
    await devDisable();
    await adopt({ raw: o.raw, data: o.data, slots: { pw: pendingImport.slots.pw } });
    S.settings.stay = false; S.settings.lastExport = pendingImport.savedAt || Date.now();
    await save(); navigator.storage?.persist?.(); pendingImport = null;
    closeSheet(); enterApp('restauration'); toast('Cave restaurée');
  } catch (e) {
    btn.disabled = false; btn.textContent = 'Restaurer'; const er = $('#ierr'); er.hidden = false;
    // Une structure invalide se repère ; un déchiffrement refusé peut venir du mot de passe ou d'un fichier altéré
    er.textContent = e?.message === 'format' ? 'Sauvegarde incomplète ou endommagée : elle ne peut pas être restaurée.' : 'Mot de passe incorrect, ou fichier endommagé.';
  }
};
Object.assign(ACT, {
  export: () => exportBackup(),
  import: () => { const i = $('#f-backup'); i.value = ''; i.click(); },

  chpw: () => showSheet(() => `${head('Changer le mot de passe')}
    <form class="form" data-form="chpw">${USERFIELD}
      <label>Mot de passe actuel<input type="password" name="c0" autocomplete="current-password" required></label>
      <label>Nouveau mot de passe<input type="password" name="c1" autocomplete="new-password" required></label>
      <label>Confirmation<input type="password" name="c2" autocomplete="new-password" required></label>
      <p class="err" id="cerr" hidden></p><button class="btn primary wide" type="submit">Changer le mot de passe</button></form>
    <p class="tiny">Les anciennes sauvegardes restent lisibles avec l’ancien mot de passe : exporte une nouvelle sauvegarde ensuite.</p>`),
});
FORMS.chpw = async (f, d) => {
  const er = $('#cerr'), fail = m => { er.hidden = false; er.textContent = m; };
  if (d.c1.length < 10) return fail('Au moins 10 caractères.');
  if (d.c1 !== d.c2) return fail('Les deux mots de passe ne correspondent pas.');
  try { const raw = await openPwSlot(slots.pw, d.c0); if (!sameBytes(raw, dekRaw)) throw 0; }
  catch { await noteFail(); return fail('Mot de passe actuel incorrect.'); }
  await clearFails();
  slots = { ...slots, pw: await makePwSlot(dekRaw, d.c1) };
  await save(); closeSheet(); toast('Mot de passe modifié. Pense à exporter une nouvelle sauvegarde.');
};

/* ---------- Synthèse ---------- */
const U_DONE = new Set(['tasteSave', 'placeOk', 'putHere', 'receive', 'transferDone', 'chatAsk', 'export', 'applyReeval', 'applyAdvice', 'adviceGo', 'wishToggle',

function uSummary() {

  for (const list of bySess.values()) {

    const close = t => { if (cur && since != null) { const d = t - since; dur += d; const o = screens[cur]; o.ms += d; o.d.push(d); } since = null; };
    for (const [t, , k, a, , x] of list) {

        o.n++; o.taps.push(path.length);

      } else if (k === 'pause' || k === 'end') close(t);
      else if (k === 'resume') since = t;

      else if (k === 'ai') { const o = ai[a] ||= { n: 0, err: 0, ms: [], usd: 0 }; const [st, ms, usd] = String(x || '').split(','); o.n++; if (st !== 'ok') o.err++; o.ms.push(+ms || 0); o.usd += +usd || 0; }

        acts[name] = (acts[name] || 0) + 1;
        const d = new Date(t); hours[d.getHours()]++; days[(d.getDay() + 6) % 7]++;
        if (k !== 'submit') gestures++;

        path.push(name); seq.push(name);

  return 0;
}

function versionsHtml(list) {
  return list.map(e => `<div class="card"><div class="ct"><span>Version ${esc(e.version)}${e.titre ? ' · ' + esc(e.titre) : ''}</span><span class="small">${esc(fmtDate(e.date))}</span></div>
    <ul class="notes">${(e.items || []).map(i => `<li>${esc(i)}</li>`).join('')}</ul></div>`).join('');
}
// Au déverrouillage : la fenêtre « Nouveautés » s'affiche une fois après une mise à jour
async function afterEnter(via) {
  let last = null; try { last = await store.get('lastVersion'); } catch {}
  try { await store.set('lastVersion', APP_VERSION); } catch {}
  if (via === 'creation' || via === 'restauration' || last === APP_VERSION) return;   // nouvel appareil : rien à annoncer
  // Sans trace de version : l'app vient d'une version antérieure à la 1.6, qui ne la notait pas
  const list = last ? newerThan(CHANGELOG, last) : CHANGELOG.filter(e => e.version === APP_VERSION);
  if (!list.length || introAt != null) return;
  setTimeout(() => { if (!sheetStack.length) showSheet(() => `${head('Nouveautés')}<p class="small" style="margin-top:-6px">${last ? `Depuis la version ${esc(last)}` : `Version ${esc(APP_VERSION)}`}</p>${versionsHtml(list)}
    <button class="btn primary wide" style="margin-top:12px" data-act="close">C’est noté</button>`); }, 300);
}
function historySheet() {
  return `${head('Historique des versions')}<p class="small" style="margin-top:-6px">Version installée : <b style="color:var(--ink)">${esc(APP_VERSION)}</b></p>${versionsHtml(newerThan(CHANGELOG, null))}`;
}
// Contenu d'une mise à jour disponible : journal publié en ligne, filtré depuis la version installée
async function loadNews() {
  code.news = 'chargement'; refreshSheet();
  try {
    const r = await fetch('./changelog.json?fresh=' + Date.now(), { cache: 'no-store' });
    if (!r.ok) throw new Error(String(r.status));
    const j = await r.json();
    if (!Array.isArray(j)) throw new Error('format');
    code.news = newerThan(j.filter(e => e && typeof e.version === 'string' && Array.isArray(e.items)).map(e => ({ version: e.version, date: String(e.date || ''), titre: String(e.titre || ''), items: e.items.map(String).slice(0, 30) })), APP_VERSION);
  } catch { code.news = 'erreur'; }
  refreshSheet();
}
function newsBlock() {
  if (code.news === 'chargement' || code.news == null) return '<p class="small">Chargement du contenu de la mise à jour…</p>';
  if (code.news === 'erreur') return '<p class="small">Le contenu de la mise à jour n’a pas pu être récupéré (pas de connexion, ou journal absent).</p>';
  if (!code.news.length) return '<p class="small">Le journal des versions ne décrit pas encore cette mise à jour.</p>';
  return `<h3>Ce qui change depuis ta version (${esc(APP_VERSION)})</h3>${versionsHtml(code.news)}`;
}
Object.assign(ACT, { historySheet: () => showSheet(historySheet) });


/* ===== 90-boot.js ===== */
/* ---------- Événements ---------- */
// Un double appui ne doit pas enregistrer deux fois : les formulaires et les actions qui écrivent
// des données sont bloqués pendant leur exécution, puis encore 350 ms.
const busyForms = new Set(), busyActs = new Set();
const GUARDED = new Set(['tasteSave', 'placeOk', 'plocGo', 'transferDone', 'receive', 'applyReeval', 'applyAdvice', 'adviceGo', 'delWine', 'delUnit', 'delTaste',
  'delSession', 'delSite', 'delSpace', 'estimateMissing', 'putHere', 'openBottle', 'wishToggle', 'wishBought', 'toTransfer', 'revealWine', 'blindAI', 'export',
  'usageClear', 'chatNew', 'tasteAbandon', 'awayTransfer', 'pkOffer', 'pkunlock', 'demo', 'estimate', 'takeIt', 'rateNow', 'rateLater', 'backupLater', 'tAdd', 'tPick', 'placeToTransfer', 'tPlaceNow', 'todoSkip', 'todoSkipAll', 'setOwner', 'boxMoveTo', 'boxTransfer', 'boxTransferTo']);
const release = (set, k) => setTimeout(() => set.delete(k), 350);
document.addEventListener('click', e => {
  const t = e.target.closest('[data-act]'); if (!t || !ACT[t.dataset.act]) return;
  if (t.tagName === 'INPUT' || t.tagName === 'SELECT') return;
  e.preventDefault();
  const act = t.dataset.act;
  if (GUARDED.has(act)) { if (busyActs.has(act)) return; busyActs.add(act); }
  uPending = act; uLog('tap', act, uDetail(t));
  Promise.resolve().then(() => ACT[act](t, e)).catch(err => { console.error(err); errLog('action:' + act, err); errSheet('Une erreur est survenue', String(err.message || err)); })
    .finally(() => { if (GUARDED.has(act)) release(busyActs, act); });
});
document.addEventListener('submit', async e => {
  e.preventDefault();
  const f = e.target, name = f.dataset.form; if (!FORMS[name]) return;
  const btn = f.querySelector('[type=submit]');
  if (btn?.disabled || busyForms.has(name)) return;
  busyForms.add(name); if (btn) btn.disabled = true;
  uPending = name; uLog('submit', name);
  try { await FORMS[name](f, formData(f)); }
  catch (err) { console.error(err); errLog('formulaire:' + name, err); errSheet('Une erreur est survenue', String(err.message || err)); }
  finally { if (btn?.isConnected) btn.disabled = false; release(busyForms, name); }
});
document.addEventListener('input', e => {
  const t = e.target;
  if (t.type === 'search') { const x = t.closest('.search')?.querySelector('.sx'); if (x) x.hidden = !t.value; }
  const k = t.dataset?.in; if (k && INPUTS[k]) INPUTS[k](t, e);
});
document.addEventListener('change', e => {
  const t = e.target;
  if (t.id === 'f-photo') return onPhoto(t.files[0]);
  if (t.id === 'f-photo2') return onTastePhoto(t.files[0]);
  if (t.id === 'f-pdf') return onPdf(t.files[0]);
  if (t.id === 'f-backup') return onBackupFile(t.files[0]);
  if (t.type !== 'password' && t.type !== 'file') { const nm = t.dataset?.ch || t.dataset?.in || t.name; if (nm && !/^(p|p1|p2|c0|c1|c2|key)$/.test(nm)) uLog('change', nm); }
  const k = t.dataset?.ch; if (k && CHANGES[k]) Promise.resolve(CHANGES[k](t, e)).catch(err => { errLog('champ:' + k, err); toast('Erreur : ' + (err.message || err)); });
});
// Entrée envoie la question au sommelier (Maj+Entrée pour aller à la ligne)
document.addEventListener('keydown', e => {
  if (e.key === 'Enter' && !e.shiftKey && e.target.matches?.('.composer textarea')) { e.preventDefault(); e.target.form.requestSubmit(); }
  // Touche « Rechercher » : un seul emplacement trouvé, on y va ; sinon on replie le clavier
  if (e.key === 'Enter' && e.target.matches?.('input[data-in=caveSearch]')) { e.preventDefault(); e.target.blur(); caveEnter(); }
});

/* ---------- Verrou : création, ouverture ---------- */
FORMS.setup = async (f, d) => {
  if (d.p1.length < 10) return renderLock('setup', 'Le mot de passe doit faire au moins 10 caractères. Une phrase de quelques mots est simple à retenir et sûre.');
  if (d.p1 !== d.p2) return renderLock('setup', 'Les deux mots de passe ne correspondent pas.');
  const btn = f.querySelector('[type=submit]'); btn.disabled = true; btn.textContent = 'Création…';
  const raw = rand(32);
  await adopt({ raw, data: seedStructure(emptyData()), slots: { pw: await makePwSlot(raw, d.p1) } });
  await save(); navigator.storage?.persist?.(); await clearFails();
  enterApp('creation'); toast('Cave créée');
  if (pkAvailable()) setTimeout(() => showSheet(() => `${head('Face ID')}<p>Veux-tu ouvrir ta cave avec Face ID plutôt qu’avec ton mot de passe ?</p>
    <div class="btns"><button class="btn primary wide" data-act="pkOffer">${ICON.face} Activer Face ID</button><button class="btn ghost wide" data-act="close">Plus tard</button></div>`), 400);
};
FORMS.unlock = async (f, d) => {
  const fl = await getFails();
  if (fl.until > Date.now()) return renderLock('unlock', `Trop d’essais. Réessaie dans ${Math.ceil((fl.until - Date.now()) / 1000)} secondes.`);
  const btn = f.querySelector('[type=submit]'); btn.disabled = true; btn.textContent = 'Ouverture…';
  try {
    await adopt(await openVault(await store.get('vault'), { pass: d.p1 }));
    await clearFails(); enterApp('motdepasse');
  } catch {
    const n = await noteFail();
    renderLock('unlock', n.until > Date.now() ? `Mot de passe incorrect. Réessaie dans ${Math.ceil((n.until - Date.now()) / 1000)} secondes.` : 'Mot de passe incorrect.');
  }
};
Object.assign(ACT, {
  pkunlock: async () => {
    try {
      const vault = await store.get('vault');
      await adopt(await openVault(vault, { prf: await prfGet(vault.slots.pk) }));
      await clearFails(); enterApp('faceid');
    } catch (e) { renderLock('unlock', e.name === 'NotAllowedError' ? '' : pkError(e)); }
  },
  pkOffer: async () => {
    try { const { slot, secret } = await pkCreate(); await pkStore(slot, secret || await prfGet(slot)); closeSheet(); toast('Face ID activé'); }
    catch (e) { sheetMsg('Face ID', pkError(e)); }
  },
  demo: async () => { S = normalize(demoData()); mode = 'demo'; enterApp(); },
});

/* ---------- Verrouillage automatique ---------- */
const veil = on => document.documentElement.classList.toggle('veil', on && mode === 'app');
document.addEventListener('visibilitychange', () => {
  if (document.hidden) { hiddenAt = Date.now(); veil(true); uLog('pause'); uFlush(); return; }
  const min = S?.settings.lockMin ?? 5;
  if (mode === 'app' && !S.settings.stay && min && hiddenAt && Date.now() - hiddenAt > min * 60e3) { veil(false); lockNow(); }
  else { veil(false); hiddenAt = 0; uLog('resume'); }
});
window.addEventListener('pagehide', () => veil(true));
window.addEventListener('pageshow', () => { if (!document.hidden) veil(false); });

/* ---------- Démarrage ---------- */
async function boot() {
  wipeKeys(); view = 'cave'; caveSpace = null; caveQuery = '';
  if (!window.crypto?.subtle) { app.innerHTML = '<main class="lock"><h1 class="lock-title">MyCellar</h1><p class="lock-text">Le chiffrement n’est pas disponible ici. Ouvre l’app depuis son adresse https.</p></main>'; return; }
  store ||= await openStore();
  checkCode();
  const vault = await store.get('vault');
  lockHasPk = !!vault?.slots?.pk;
  if (vault) {
    const raw = await devOpen();
    if (raw) { try { await adopt(await openVault(vault, { raw })); return enterApp('appareil'); } catch { await devDisable(); } }
  }
  renderLock(vault ? 'unlock' : 'setup');
  if (!vault && !(await store.get('introSeen'))) showIntro(0, false);
}
if (location.search.includes('u=')) history.replaceState({}, '', location.pathname);
// Le service worker ne doit jamais changer : une mise à jour approuvée passe par une désinstallation complète.
// Si l'hébergeur remplace sw.js, on alerte tout de suite, tant que le code approuvé tourne encore.
const swHadController = !!navigator.serviceWorker?.controller;
function swAlarm() {
  if (!swHadController || code.status === 'sw') return;
  code.status = 'sw'; paintCode();
  if (mode === 'app') lockNow();
}
if ('serviceWorker' in navigator && window.isSecureContext) {
  navigator.serviceWorker.register('sw.js', { updateViaCache: 'none' }).then(reg => {
    if (reg.installing || reg.waiting) swAlarm();
    reg.addEventListener('updatefound', swAlarm);
  }).catch(() => {});
  navigator.serviceWorker.addEventListener('controllerchange', swAlarm);
}
boot();


/* ===== 95-intro.js ===== */
/* ---------- Présentation de l'app (premier lancement, puis Réglages › Aide) ----------
   Le fait de l'avoir vue est rangé hors du coffre (« introSeen ») : ce n'est pas une donnée sensible. */
const INTRO = [
  ['logo', 'Bienvenue dans MyCellar', 'Ta cave à vin sur ton iPhone, avec un sommelier qui la connaît. Tes données restent sur l’appareil, chiffrées par ton mot de passe.'],
  ['cave', 'Décris ta cave', 'Sites, espaces et meubles : armoire, rack, étagère, caisses, cartons. Le plan affiche chaque bouteille à sa place, et la recherche la retrouve d’un coup d’œil.'],
  ['camera', 'Ajoute tes bouteilles', 'Touche + puis « Nouveau vin » : photographie l’étiquette et la fiche se remplit, ou saisis-la à la main. L’app te propose une place libre. Tu viens de Ploc ? L’import se trouve dans les réglages.'],
  ['boire', 'Bois au bon moment', 'Chaque vin a sa fenêtre de dégustation. L’onglet À boire montre les priorités, et te conseille quoi rapprocher ou mettre en garde.'],
  ['somm', 'Ton sommelier', 'Décris ton plat : il choisit dans ta cave, et t’indique la température, le carafage et l’emplacement exact. Il fonctionne avec ta propre clé API (environ 1 € par mois), à ajouter dans les réglages.'],
  ['notes', 'Tes dégustations', 'Note les vins de ta cave ou bus ailleurs, en séance ou à l’aveugle, avec la roue des arômes. Garde tes coups de cœur dans la liste d’envies.'],
  ['up', 'Pense à sauvegarder', 'Ta cave n’existe que sur cet iPhone. Exporte régulièrement une sauvegarde chiffrée vers Fichiers ou iCloud Drive : Réglages › Sauvegarder.'],
  ['info', 'Aide à améliorer l’app', 'Tu testes MyCellar en avant-première ? Active le suivi d’utilisation dans Réglages › Aide : il note tes gestes, jamais tes vins. Tu pourras envoyer le rapport avec ton avis, ou signaler un problème.'],
];
let introAt = null, introInApp = false;
function showIntro(i = 0, inApp = false) { introAt = i; introInApp = inApp; paintIntro(); }
function paintIntro() {
  let el = $('#intro');
  if (introAt == null) { el?.remove(); return; }
  if (!el) { el = document.createElement('div'); el.id = 'intro'; el.className = 'intro'; el.setAttribute('role', 'dialog'); el.setAttribute('aria-modal', 'true'); document.body.appendChild(el); }
  const [ic, t, d] = INTRO[introAt], last = introAt === INTRO.length - 1;
  el.innerHTML = `<div class="intro-top">${introAt ? `<button class="icon-btn" data-act="introPrev" aria-label="Précédent">${ICON.back}</button>` : '<span></span>'}
      ${last ? '<span></span>' : `<button class="link" data-act="introDone">Passer</button>`}</div>
    <div class="intro-body"><div class="intro-art">${ic === 'logo' ? LOGO : ICON[ic]}</div><h2>${esc(t)}</h2><p>${esc(d)}</p></div>
    <div class="intro-foot"><div class="intro-dots">${INTRO.map((_, k) => `<i class="${k === introAt ? 'on' : ''}"></i>`).join('')}</div>
      <button class="btn primary wide" data-act="${last ? 'introDone' : 'introNext'}">${last ? (introInApp ? 'Terminer' : 'Créer ma cave') : 'Suivant'}</button></div>`;
}
Object.assign(ACT, {
  introNext: () => { introAt = Math.min(INTRO.length - 1, introAt + 1); paintIntro(); },
  introPrev: () => { introAt = Math.max(0, introAt - 1); paintIntro(); },
  introDone: async () => { introAt = null; paintIntro(); try { await store.set('introSeen', 1); } catch {} if (!introInApp) $('input[name=p1]')?.focus(); },
  introShow: () => showIntro(0, true),
});
// Glisser vers la gauche ou la droite pour changer d'écran
let introX = null;
document.addEventListener('touchstart', e => { if (introAt != null) introX = e.touches[0].clientX; }, { passive: true });
document.addEventListener('touchend', e => {
  if (introAt == null || introX == null) return;
  const dx = e.changedTouches[0].clientX - introX; introX = null;
  if (Math.abs(dx) > 50) ACT[dx < 0 ? 'introNext' : 'introPrev']();
}, { passive: true });

</script>
