<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="MyCellar">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="theme-color" content="#F7F3EC">
<meta name="referrer" content="no-referrer">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'sha256-/81wTbonwHgMO1zAkEXLfh3R0xoInz6Bc7atld/3g8A='; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; connect-src 'self' https://api.anthropic.com https://api.mistral.ai; worker-src 'self'; manifest-src 'self'; object-src 'none'; frame-src 'none'; form-action 'none'; base-uri 'none'">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<title>MyCellar</title>
<style>
:root{
  --bg:#F7F3EC; --surface:#FFFFFF; --sunk:#EFE8DD; --ink:#2A1F1D; --muted:#7D716B; --line:#E7DFD4;
  --bx:#6E1E2F; --bx-soft:#F3E6E7; --on-bx:#FFFFFF;
  --green:#2F5240; --green-soft:#E4EEE7; --gold:#A8844E; --gold-soft:#F4ECDD; --red:#B03A2E; --red-soft:#F6DCD8;
  --rouge:#8E2435; --blanc:#E3CB6B; --rose:#E59CA2; --bulle:#CDBB8C; --liquo:#C4852A; --orange:#D98B3A; --spirit:#8A5A2B;
  --st-prio:#6E1E2F; --st-apogee:#2F5240; --st-tot:#A8844E; --st-declin:#9A5B4D; --st-inconnu:#B9AFA6;
  --txt:-apple-system,BlinkMacSystemFont,"SF Pro Text",system-ui,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
  --safe-b:env(safe-area-inset-bottom,0px); --safe-t:env(safe-area-inset-top,0px);
  color-scheme:light;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.4 var(--txt);-webkit-font-smoothing:antialiased;font-variant-numeric:tabular-nums;-webkit-tap-highlight-color:transparent}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--bx);outline-offset:2px;border-radius:8px}
.muted{color:var(--muted)} .small{font-size:13px;color:var(--muted)} .tiny{font-size:11.5px;color:var(--muted)}
.sr-only{position:absolute!important;width:1px!important;height:1px!important;min-height:0!important;padding:0!important;margin:-1px!important;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap;border:0!important;left:0;top:0}
.row{display:flex;align-items:center;gap:8px} .between{justify-content:space-between} .wrap{flex-wrap:wrap} .grow{flex:1;min-width:0}
.dot{width:10px;height:10px;border-radius:50%;display:inline-block;flex:none}
.ell{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
html.veil #app,html.veil #layer,html.veil #toast{visibility:hidden}

/* Verrou */
.lock{min-height:100dvh;display:flex;flex-direction:column;justify-content:center;padding:calc(32px + var(--safe-t)) 28px calc(32px + var(--safe-b));max-width:440px;margin:0 auto}
.lock-mark svg{width:64px;height:64px}
.lock-title{font-size:34px;font-weight:700;letter-spacing:-.02em;margin:18px 0 10px}
.lock-text{color:var(--muted);margin:0 0 26px;max-width:36ch}
.lock-form{display:grid;gap:14px}
.lock-links{display:grid;gap:4px;margin-top:22px;justify-items:start}
.or{text-align:center;color:var(--muted);margin:14px 0;font-size:14px}
.err{color:var(--red);margin:0;font-size:15px}
.codebar{padding:calc(12px + var(--safe-t)) 18px 14px;background:var(--gold-soft);font-size:14px;line-height:1.4}
.codebar.bad{background:var(--red-soft)}
.codebar p{margin:0 0 10px}
.fp{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:15px;letter-spacing:.04em}

/* Champs */
label{display:grid;gap:6px;font-size:13.5px;color:var(--muted);font-weight:500}
input[type=text],input[type=password],input[type=number],input[type=date],input[type=search],input:not([type]),select,textarea{width:100%;min-height:44px;padding:10px 12px;font-size:16px;border:1px solid var(--line);border-radius:12px;background:var(--surface);color:var(--ink);-webkit-appearance:none;appearance:none}
textarea{min-height:80px;line-height:1.4;resize:vertical}
select{background-image:linear-gradient(45deg,transparent 50%,var(--muted) 50%),linear-gradient(135deg,var(--muted) 50%,transparent 50%);background-position:calc(100% - 18px) 50%,calc(100% - 13px) 50%;background-size:5px 5px;background-repeat:no-repeat;padding-right:32px}
input[type=date]{display:block}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.grid3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px}
.form{display:grid;gap:12px}
.fieldset{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:12px;display:grid;gap:10px}
.fieldset > .ft{font-size:12px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.5px}
.check{display:flex;align-items:center;gap:10px;font-size:15px;color:var(--ink);font-weight:500}
.check input{width:22px;height:22px;accent-color:var(--bx);margin:0}

/* Boutons */
.btn{border:0;border-radius:12px;min-height:44px;padding:0 16px;font-weight:600;font-size:15px;background:var(--sunk);color:var(--ink);display:inline-flex;align-items:center;justify-content:center;gap:8px;text-align:center}
.btn.primary{background:var(--bx);color:var(--on-bx)}
.btn.green{background:var(--green);color:#fff}
.btn.ghost{background:transparent;border:1px solid var(--line)}
.btn.outline{background:transparent;border:1px solid var(--bx);color:var(--bx)}
.btn.danger{background:transparent;color:var(--red);border:1px solid var(--line)}
.btn.small{min-height:34px;padding:0 12px;font-size:13.5px;border-radius:10px}
.btn.wide{width:100%}
.btn:disabled{opacity:.5}
.btn svg{width:18px;height:18px}
.link{background:none;border:0;padding:8px 0;color:var(--bx);font-weight:600;text-align:left;font-size:15px}
.icon-btn{width:40px;height:40px;border:0;border-radius:12px;background:transparent;display:grid;place-items:center;color:var(--ink);flex:none}
.icon-btn svg{width:22px;height:22px}
.btns{display:grid;gap:8px}
.btns2{display:grid;grid-template-columns:1fr 1fr;gap:8px}

/* Structure */
.top{position:sticky;top:0;z-index:5;padding:calc(8px + var(--safe-t)) 16px 8px;background:color-mix(in srgb,var(--bg) 92%,transparent);-webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px)}
.top-row{display:flex;align-items:center;gap:8px;min-height:44px}
.top h1{font-size:30px;font-weight:700;letter-spacing:-.5px;margin:0;flex:1;min-width:0}
.sitepill{display:inline-flex;align-items:center;gap:6px;background:var(--surface);border:1px solid var(--line);border-radius:20px;padding:6px 12px;font-size:13.5px;font-weight:600;max-width:52vw}
.sitepill span.ell{max-width:34vw}
.view{padding:0 14px calc(110px + var(--safe-b));max-width:620px;margin:0 auto}
.banner{margin:8px 0 0;padding:10px 14px;border-radius:12px;background:var(--gold-soft);font-size:14px;line-height:1.4}
.banner.bx{background:var(--bx);color:#fff}
.banner.green{background:var(--green-soft)}
.banner .btn{margin-top:8px}
.empty{text-align:center;color:var(--muted);padding:40px 20px;font-size:15px}
.empty svg{width:44px;height:44px;opacity:.5;margin-bottom:8px}
.sect{font-size:12px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.5px;margin:18px 4px 6px}

/* Recherche, segments, pastilles */
.search{margin-top:8px;display:flex;align-items:center;gap:8px;background:var(--sunk);border-radius:12px;padding:0 10px}
.search svg{width:18px;height:18px;color:var(--muted);flex:none}
.search input{border:0;background:transparent;min-height:40px;padding:8px 0;font-size:16px}
.search input:focus{outline:none}
.search input::-webkit-search-cancel-button{-webkit-appearance:none;appearance:none}
.sx{flex:none;width:28px;height:28px;border:0;border-radius:50%;background:var(--line);color:var(--ink);display:grid;place-items:center;padding:0;margin-right:-4px}
.sx svg{width:14px;height:14px}
.sx[hidden]{display:none}
.seg{display:flex;background:#EAE2D6;border-radius:10px;padding:2px;margin-top:10px}
.seg button{flex:1;border:0;background:none;font-size:13.5px;font-weight:600;padding:7px 4px;border-radius:8px;color:var(--muted)}
.seg button.on{background:var(--surface);color:var(--ink);box-shadow:0 1px 2px rgba(0,0,0,.08)}
.chips{display:flex;gap:6px;margin-top:10px;overflow-x:auto;padding-bottom:2px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chips.wrap{flex-wrap:wrap;overflow:visible}
.chip{flex:none;font-size:13px;padding:7px 12px;border-radius:16px;background:var(--surface);border:1px solid var(--line);white-space:nowrap;font-weight:500;color:var(--ink);display:inline-flex;align-items:center;gap:6px}
.chip.on{background:var(--bx);color:#fff;border-color:var(--bx)}
.chip.soft.on{background:var(--bx-soft);color:var(--bx);border-color:var(--bx);font-weight:600}
.chip.dash{border-style:dashed;color:var(--muted)}
.tag{font-size:11.5px;padding:3px 8px;border-radius:10px;background:#F2ECE3;font-weight:500;white-space:nowrap}
.tag.g{background:var(--green-soft);color:var(--green)} .tag.b{background:var(--bx-soft);color:var(--bx)} .tag.o{background:var(--gold-soft);color:#7A5C2E} .tag.r{background:var(--red-soft);color:var(--red)}
.tags{display:flex;gap:5px;flex-wrap:wrap}

/* Cartes */
.card{background:var(--surface);border-radius:16px;padding:12px;margin-top:10px;border:1px solid var(--line)}
.card.tap{cursor:pointer}
.ct{font-size:14px;font-weight:700;display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:8px}
.ct span.small{font-weight:500}
.ct .icon-btn{width:32px;height:32px;margin:-6px -6px -6px 0}
.ct .icon-btn svg{width:18px;height:18px}

/* Plan : armoire / étagère */
.shelf-l{font-size:10px;color:var(--muted);margin:8px 0 3px;font-weight:600;letter-spacing:.3px;text-transform:uppercase}
.shelf{display:grid;gap:4px}
.slot{background:#FAF7F2;border:1px solid var(--line);border-radius:7px;min-height:42px;padding:4px 3px 4px 8px;position:relative;overflow:hidden;text-align:left;font-size:9.5px;line-height:1.2;min-width:0}
.slot i{position:absolute;left:0;top:0;bottom:0;width:4px}
.slot b{display:block;font-size:10px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;letter-spacing:-.1px}
.slot small{display:block;color:var(--muted);font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.slot.empty{background:transparent;border-style:dashed}
.slot.hl{outline:2px solid var(--bx);outline-offset:1px;background:var(--bx-soft)}
.slot.dim{opacity:.35}
.slot.ami{background:repeating-linear-gradient(135deg,#FAF7F2 0 5px,#EFE8DD 5px 7px)}
.slot .ini{position:absolute;right:3px;bottom:2px;font-size:8.5px;background:var(--gold);color:#fff;border-radius:6px;padding:0 3px;font-weight:700}
.slot.sel{outline:2px solid var(--green);outline-offset:1px;background:var(--green-soft)}
/* Plan : rack */
.rack{display:grid;gap:6px 4px;justify-content:space-between}
.rc{width:100%;max-width:36px;aspect-ratio:1;height:auto;justify-self:center;border-radius:50%;border:1px solid var(--line);background:#FAF7F2;display:flex;align-items:center;justify-content:center;font-size:9px;font-weight:700;color:#fff;padding:0;position:relative;letter-spacing:-.2px}
.rc.hl{box-shadow:0 0 0 2px var(--bg),0 0 0 4px var(--bx)}
.rc.dim{opacity:.3}
.rc.sel{box-shadow:0 0 0 2px var(--bg),0 0 0 4px var(--green)}
.rc.ami::after{content:attr(data-ini);position:absolute;right:-3px;bottom:-3px;background:var(--gold);color:#fff;font-size:8px;border-radius:6px;padding:0 3px}
.rc.light{color:#4a3d10}
.rack-scroll{overflow-x:auto;padding:4px 2px}
/* Plan : caisses */
.pile{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.crate{background:#EADCC4;border:1px solid #D8C5A5;border-radius:8px;padding:8px;font-size:12px;font-weight:600;line-height:1.3;text-align:left;min-width:0}
.crate.carton{background:#E6D3B5;border-color:#CFB892}
.crate small{display:block;font-weight:500;color:#6E5A3E}
.crate .cnt{display:inline-block;margin-top:5px;background:#fff;border-radius:8px;padding:1px 7px;font-size:11px}
.crate.hl{outline:2px solid var(--bx);outline-offset:1px}
.crate.dim{opacity:.35}
.unplaced{display:flex;gap:6px;flex-wrap:wrap}

/* Listes */
.list{background:var(--surface);border:1px solid var(--line);border-radius:16px;margin-top:10px;overflow:hidden}
.li{display:flex;gap:10px;align-items:center;padding:11px 12px;border-bottom:1px solid var(--line);text-align:left;width:100%;background:none;border-left:0;border-right:0;border-top:0}
.li:last-child{border-bottom:0}
.li .it{flex:1;min-width:0}
.li .it b{font-size:14.5px;display:block;font-weight:600}
.li .it small{font-size:12.5px;color:var(--muted);display:block}
.qty{font-size:13px;font-weight:700;background:#F2ECE3;border-radius:9px;padding:3px 8px;flex:none}
.chev{color:var(--muted);flex:none}
.chev svg{width:16px;height:16px}
.thumb{width:40px;height:52px;border-radius:6px;object-fit:cover;flex:none;background:var(--sunk)}

/* Fenêtre de dégustation */
.win{position:relative;height:6px;background:#EFE8DD;border-radius:3px;margin-top:7px}
.win .w{position:absolute;top:0;bottom:0;border-radius:3px;background:linear-gradient(90deg,var(--gold) 0%,var(--green) 40%,var(--green) 70%,var(--st-declin) 100%)}
.win .now{position:absolute;top:-3px;width:2px;height:12px;background:var(--ink);border-radius:1px}
.win.big{height:10px;border-radius:5px}
.win.big .now{height:18px;top:-4px}
.winlab{display:flex;justify-content:space-between;font-size:11.5px;color:var(--muted);margin-top:4px}

/* À boire */
.kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin-top:10px}
.kpi{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:8px 4px;text-align:center}
.kpi b{display:block;font-size:21px}
.kpi span{font-size:10.5px;color:var(--muted);font-weight:600}
.kpi.on{border:1.5px solid var(--bx)}
.bars{display:flex;align-items:flex-end;gap:6px;height:90px}
.bars div,.bars button{flex:1;border-radius:4px 4px 0 0;min-height:2px;position:relative;border:0;padding:0}
.bars.sel button:not(.on){opacity:.4}
.bars button.on{box-shadow:0 0 0 2px var(--bg),0 0 0 4px var(--ink)}
.bars div span,.bars button span{position:absolute;top:-16px;left:0;right:0;text-align:center;font-size:10.5px;font-weight:700;color:var(--ink)}
.barl{display:flex;gap:6px;font-size:10.5px;color:var(--muted);margin-top:4px;text-align:center}
.barl span{flex:1}

/* Barre d'onglets */
.tabs{position:fixed;left:0;right:0;bottom:0;z-index:6;display:grid;grid-template-columns:1fr 1fr 72px 1fr 1fr;padding:6px 4px calc(6px + var(--safe-b));background:color-mix(in srgb,var(--surface) 94%,transparent);-webkit-backdrop-filter:blur(16px);backdrop-filter:blur(16px);border-top:1px solid var(--line)}
.tab{display:flex;flex-direction:column;align-items:center;gap:3px;font-size:10.5px;color:var(--muted);font-weight:500;background:none;border:0;padding:4px 0}
.tab svg{width:24px;height:24px}
.tab.on{color:var(--bx)}
.tab.plus span{width:56px;height:56px;border-radius:50%;background:var(--bx);color:#fff;display:flex;align-items:center;justify-content:center;margin-top:-26px;box-shadow:0 6px 16px rgba(110,30,47,.35);border:4px solid var(--bg)}
.tab.plus svg{width:26px;height:26px}

/* Feuilles */
.backdrop{position:fixed;inset:0;z-index:20;background:rgba(30,15,12,.38)}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:21;max-height:92dvh;overflow:auto;overscroll-behavior:contain;background:var(--bg);border-radius:22px 22px 0 0;padding:8px 16px calc(24px + var(--safe-b));max-width:620px;margin:0 auto;animation:up .22s ease-out}
.sheet.full{top:calc(10px + var(--safe-t));max-height:none}
@keyframes up{from{transform:translateY(30px);opacity:.4}to{transform:none;opacity:1}}
.sheet .grab{height:18px;position:relative;margin-bottom:2px}
.sheet .grab::after{content:'';position:absolute;left:50%;top:6px;transform:translateX(-50%);width:40px;height:5px;border-radius:9px;background:var(--line)}
.sheet h2{font-size:21px;font-weight:700;margin:2px 0 12px;letter-spacing:-.2px}
.sheet h3{font-size:15px;font-weight:700;margin:20px 0 8px}
.shead{display:flex;align-items:center;gap:8px;margin:0 0 10px}
.shead h2{flex:1;margin:0;min-width:0}
.shead .link{padding:6px 0}
.toast{position:fixed;left:50%;bottom:calc(96px + var(--safe-b));transform:translateX(-50%);z-index:30;background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:12px;font-size:15px;font-weight:600;opacity:0;pointer-events:none;transition:opacity .2s;max-width:90vw;text-align:center}
.toast.show{opacity:1}
@media (prefers-reduced-motion: reduce){.sheet{animation:none}.toast{transition:none}}
.kv{display:grid;grid-template-columns:auto 1fr;gap:6px 12px;font-size:14px;margin:0}
.kv dt{color:var(--muted)} .kv dd{margin:0;font-weight:500;text-align:right}
.photo{width:100%;height:240px;object-fit:contain;border-radius:12px;background:var(--sunk);display:block}
.photo[hidden],.thumb[hidden]{display:block;visibility:hidden}
.big-actions{display:grid;gap:10px}
.big-action{display:flex;align-items:center;gap:14px;text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:14px;width:100%}
.big-action svg{width:28px;height:28px;color:var(--bx);flex:none}
.big-action b{display:block;font-size:15.5px}
.big-action small{color:var(--muted);font-size:13px}

/* Interrupteur */
.switch{position:relative;width:48px;height:28px;flex:none}
.switch input{opacity:0;width:100%;height:100%;margin:0;position:absolute;inset:0;z-index:1;cursor:pointer}
.switch span{position:absolute;inset:0;border-radius:14px;background:#E2D9CC;transition:background .15s}
.switch span::after{content:"";position:absolute;top:2px;left:2px;width:24px;height:24px;border-radius:50%;background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.2);transition:left .15s}
.switch input:checked + span{background:var(--green)}
.switch input:checked + span::after{left:22px}
.switch input:disabled + span{opacity:.45}
.set{display:flex;align-items:center;gap:10px;padding:11px 0;border-bottom:1px solid var(--line);width:100%;text-align:left;background:none;border-left:0;border-right:0;border-top:0}
.set:last-child{border-bottom:0}
.set .it{flex:1;min-width:0}
.set .it b{display:block;font-size:15px;font-weight:600}
.set .it small{display:block;font-size:12.5px;color:var(--muted)}
.set .val{font-size:13.5px;color:var(--bx);font-weight:600;flex:none}
.meter{height:8px;background:var(--sunk);border-radius:4px;overflow:hidden;margin-top:8px}
.meter i{display:block;height:100%;background:var(--green);border-radius:4px}
.meter i.warn{background:var(--gold)} .meter i.over{background:var(--red)}

/* Sommelier */
.chat{padding-bottom:170px}
.bubble{max-width:86%;padding:10px 13px;border-radius:18px;font-size:15px;line-height:1.4;margin-top:10px;white-space:pre-wrap;word-wrap:break-word}
.bubble.me{background:var(--bx);color:#fff;margin-left:auto;border-bottom-right-radius:6px}
.bubble.ai{background:var(--surface);border:1px solid var(--line);border-bottom-left-radius:6px}
.bubble.err{background:var(--red-soft);border:0}
.reco{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:12px;margin-top:8px}
.reco.first{border:1.5px solid var(--bx)}
.rk{font-size:11px;font-weight:700;color:var(--bx);letter-spacing:.4px;text-transform:uppercase}
.rn{font-size:15.5px;font-weight:700;margin-top:3px}
.rs{font-size:12.5px;color:var(--muted);margin-top:1px}
.why{font-size:13.5px;line-height:1.4;margin-top:7px}
.loc{display:flex;align-items:center;gap:6px;margin-top:8px;font-size:12.5px;font-weight:600;color:var(--green)}
.loc svg{width:14px;height:14px;flex:none}
.composer{position:fixed;left:0;right:0;bottom:calc(68px + var(--safe-b));z-index:5;padding:8px 14px;background:linear-gradient(to bottom,transparent,var(--bg) 16px);max-width:620px;margin:0 auto}

.typing{display:inline-flex;gap:4px}

@keyframes blink{0%,80%,100%{opacity:.25}40%{opacity:1}}

/* Dégustation */
.score{font-size:42px;font-weight:700;color:var(--bx);text-align:center;line-height:1.1}
.score small{font-size:17px;color:var(--muted);font-weight:600}
input[type=range]{-webkit-appearance:none;appearance:none;width:100%;height:28px;background:transparent;margin:0}
input[type=range]::-webkit-slider-runnable-track{height:4px;border-radius:2px;background:linear-gradient(to right,var(--bx) var(--p,50%),#EAE2D6 var(--p,50%))}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:24px;height:24px;border-radius:50%;background:#fff;border:1px solid var(--line);box-shadow:0 1px 4px rgba(0,0,0,.22);margin-top:-10px}
input[type=range]::-moz-range-track{height:4px;border-radius:2px;background:#EAE2D6}
input[type=range]::-moz-range-progress{height:4px;border-radius:2px;background:var(--bx)}
input[type=range]::-moz-range-thumb{width:22px;height:22px;border-radius:50%;background:#fff;border:1px solid var(--line)}
.sl{display:grid;grid-template-columns:84px 1fr 36px;align-items:center;gap:8px;font-size:13px}
.sl output{font-size:12px;color:var(--muted);text-align:right}
.lbl{font-size:12px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.4px;margin:16px 0 6px}
.wheel{display:flex;justify-content:center;margin:4px 0}
.wheel svg{max-width:100%;height:auto;touch-action:manipulation}
.wheel path{cursor:pointer}
.wheel text{pointer-events:none;user-select:none}
.teintes{display:flex;gap:8px;flex-wrap:wrap}
.teinte{width:38px;height:38px;border-radius:50%;border:2px solid #fff;box-shadow:0 0 0 1px var(--line);padding:0}
.teinte.on{box-shadow:0 0 0 2px var(--bx)}
.level{display:flex;align-items:center;gap:10px}
.bottle-level{width:18px;height:40px;border:2px solid var(--muted);border-radius:6px 6px 4px 4px;position:relative;overflow:hidden;flex:none}

@media (min-width:700px){ .pile{grid-template-columns:repeat(3,1fr)} }

.gear{border:1px solid var(--line);background:var(--surface);border-radius:50%;width:38px;height:38px}
.gear svg{width:20px;height:20px}
.rank{width:22px;height:22px;border-radius:50%;background:var(--sunk);font-size:12px;font-weight:700;display:grid;place-items:center;flex:none}
.li:first-of-type > .rank, .card > .li:nth-child(2) > .rank{background:var(--gold);color:#fff}
.empty .btn{margin-top:12px}
.card.tap > svg,.card.row > svg{width:22px;height:22px;flex:none;color:var(--bx)}
/* Présentation */
.intro{position:fixed;inset:0;z-index:40;background:var(--bg);display:flex;flex-direction:column;padding:calc(10px + var(--safe-t)) 24px calc(24px + var(--safe-b));max-width:620px;margin:0 auto}

.intro-art{width:120px;height:120px;border-radius:36px;background:var(--bx-soft);color:var(--bx);display:grid;place-items:center;margin-bottom:18px}
.intro-art svg{width:64px;height:64px}
.intro-art svg[viewBox="0 0 64 64"]{width:120px;height:120px;border-radius:36px}
.intro h2{font-size:26px;font-weight:700;letter-spacing:-.3px;margin:0}
.intro p{color:var(--muted);font-size:16px;line-height:1.5;max-width:34ch;margin:8px 0 0}
.intro-dots{display:flex;justify-content:center;gap:7px;margin-bottom:16px}
.intro-dots i{width:7px;height:7px;border-radius:50%;background:var(--line)}
.intro-dots i.on{background:var(--bx);width:20px;border-radius:4px}
.cmp{width:100%;border-collapse:collapse;font-size:13.5px}
.cmp th{text-align:left;font-size:11px;color:var(--muted);font-weight:600;padding:0 6px 4px 0}

input.bad,select.bad,textarea.bad{border-color:var(--red);box-shadow:0 0 0 1px var(--red)}
input[type=range].unset::-webkit-slider-runnable-track{background:#EAE2D6}

.pgrid{display:grid;gap:4px;justify-content:start;padding:2px}
.pd{width:22px;height:22px;border-radius:50%;display:grid;place-items:center;font-size:10px;font-weight:700;color:#fff}

<script>
'use strict';
const CHANGELOG = [{"version":"1.7.5","date":"2026-11-05","titre":"Primeurs","items":["Le choix « En cave » ou « En primeur » est désormais bien visible sous la quantité, avec la date de livraison prévue.","Il est disponible partout où l’on ajoute des bouteilles : nouveau vin, « Mêmes bouteilles » et « Nouveau millésime ».","Réglages › Primeurs : un bouton « Ajouter un primeur », pour un vin de la cave (millésime suivant) ou un nouveau vin."]},{"version":"1.7.4","date":"2026-11-05","titre":"Millésimes, amis et caisses","items":["Nouveau millésime : depuis la fiche d’un vin ou « Racheter un vin », une saisie courte (millésime, quantité, source, prix) reprend tout le reste. La fenêtre est estimée pour le nouveau millésime. Un millésime déjà en cave reçoit les bouteilles, sans doublon.","La fiche d’un vin liste ses autres millésimes en cave.","Bouteilles d’un ami : le propriétaire est désormais fixé bouteille par bouteille. À l’ajout, « dont 6 pour Paul » ; après coup, « Répartir entre propriétaires » sur la fiche du vin, ou « Appartient à » sur une bouteille. Tes données ont été converties sans perte.","Le sommelier, À boire, les conseils et les transferts ne comptent que tes bouteilles.","Caisses et cartons : un seul vin par caisse. Depuis la caisse : sortir plusieurs bouteilles d’un coup, déplacer la caisse avec son contenu, l’ajouter au transfert (elle arrive avec ses bouteilles dedans), attribuer des bouteilles à un ami, modifier le vin ou l’achat."]},{"version":"1.7.3","date":"2026-11-05","titre":"Bouteilles à noter, sites en glissant","items":["Dégustations › À noter : toutes les bouteilles sorties sans fiche t’y attendent, au lieu de la seule dernière. Pour chacune : note rapide, fiche complète (date, plat et convives déjà remplis) ou « Sans fiche ».","Après une sortie, un nouveau choix : « Sortir sans fiche », sans rappel.","Le rappel du lendemain compte les bouteilles à noter, et « Plus tard » ne les oublie plus.","Les bouteilles bues ces 30 derniers jours sans dégustation ont été ajoutées à la liste.","Onglet Cave : glisse vers la gauche ou la droite pour changer de site. Des points sous le titre indiquent le site affiché."]},{"version":"1.7.2","date":"2026-11-05","titre":"Transferts dans les deux sens","items":["Transferts : une section par sens (vers la consommation, vers le stockage), chacune avec ses arrivées. Tu peux emporter tes achats à la campagne et rapporter des vins prêts à boire dans le même trajet.","Arrivées au stockage : les bouteilles vont dans le meilleur espace de garde, avec « Ranger maintenant ».","Suggestions vers le stockage : les vins à garder achetés récemment en ville. Et quand tu ajoutes un vin trop jeune en ville, l’app propose de l’emporter au prochain transfert.","Toucher une bouteille dans un transfert ou un conseil de rangement ouvre un résumé du vin : fenêtre, statut, bouteilles par site, dernière note.","À boire : touche une barre du graphique « À boire avant la fin de… » pour voir les bouteilles et leurs emplacements, avec accès direct à la case."]},{"version":"1.7.1","date":"2026-11-05","titre":"Recherche et sommelier","items":["La recherche de l’onglet Cave porte sur tous tes sites d’un coup. Les résultats s’affichent sous la barre, avec chaque emplacement : touche-en un pour y aller, la case clignote sur le plan.","Une seule bouteille trouvée ? La touche « Rechercher » du clavier t’y emmène directement.","« Voir sur le plan » depuis la fiche d’une bouteille, et l’épingle à côté de chaque emplacement sur la fiche d’un vin.","Une croix efface la recherche d’un coup, sur toutes les barres de recherche.","Sommelier : le bouton « Nouvelle conversation » est dans l’encart de saisie, toujours visible, et demande confirmation. La dernière réponse n’est plus cachée sous l’encart."]},{"version":"1.7","date":"2026-11-05","titre":"Import Ploc complet","items":["Import Ploc : les fiches sont reprises telles quelles (couleur, degré, fenêtre de garde, contenance, cépages). Le sommelier ne complète que les champs vides, et l’écran de vérification les signale.","Les bouteilles sont posées à leur case : le meuble est créé à l’identique du plan Ploc, ou associé à un meuble existant. Un aperçu du plan permet de vérifier la lecture.","Les caves Ploc sont rapprochées de tes sites, sur ton iPhone, sans envoyer la liste de tes sites à l’IA. Un site non reconnu est demandé une fois, et peut prendre le nom utilisé dans Ploc.","Le sommelier donne son avis sur chaque fenêtre de Ploc : s’il la juge décalée, il propose la sienne et tu choisis.","L’estimation de Ploc devient le prix d’achat, et la note sur 100 une dégustation sur 20. Les accords sont ajoutés aux notes du vin.","Plusieurs exports peuvent être importés à la suite, sans doublon.","Nouveau champ « Servir à » sur la fiche vin, affiché au moment de déguster. Le sommelier le voit, ainsi que les accords."]},{"version":"1.6.2","date":"2026-11-05","titre":"Fiabilité","items":["Un double appui sur un bouton ne crée plus deux bouteilles, deux sorties ou deux dégustations.","La fiche vin vérifie le millésime, le prix, le degré et la quantité, et explique sous le champ ce qui ne va pas. Un millésime sur deux chiffres est complété (« 19 » devient 2019), et les nombres comme « 1.234,50 » sont reconnus.","Les fenêtres de dégustation restent cohérentes (début, apogée, fin), qu’elles soient saisies ou proposées par le sommelier.","Une dégustation enregistrée sans toucher au curseur n’a plus de note, au lieu d’un 14/20 par défaut.","Rangement : l’app prévient quand les places manquent et propose l’espace le plus libre.","Spiritueux désactivés : leurs cases restent sur le plan, grisées.","Import Ploc, lecture d’étiquette et restauration de sauvegarde : contrôles et messages plus clairs.","Les très grandes caves restent économes en appels au sommelier."]},{"version":"1.6.1","date":"2026-11-04","titre":"Confort et corrections","items":["Les fenêtres ne clignotent plus et ne remontent plus en haut quand tu touches un choix (fiche de dégustation, rangement, liste d’envies, transfert…).","Fiche de dégustation : le bouton « OK » en haut disparaît, on enregistre avec le bouton du bas. Fermer une fiche commencée demande confirmation.","Dans la cave fictive, les réglages indisponibles (suivi d’utilisation, Face ID, Rester déverrouillé) expliquent pourquoi.","Réglages › Contenu : la ligne « Vins · Toujours actif » est retirée."]},{"version":"1.6","date":"2026-11-04","titre":"Retours d’utilisation et suivi des versions","items":["Suivi d’utilisation (désactivé par défaut, Réglages › Aide) : l’app note, sur ton iPhone uniquement, les écrans et les gestes, jamais tes vins ni tes notes. Tu peux consulter la synthèse et exporter un rapport à envoyer, avec ton avis.","« Signaler un problème » : décris ce qui s’est passé, l’app prépare un rapport avec les dernières minutes d’utilisation et les erreurs récentes. Raccourci aussi dans les messages d’erreur.","Mises à jour : « Plus d’infos » montre le contenu d’une nouvelle version avant de l’installer, une fenêtre « Nouveautés » s’affiche après, et l’historique des versions est dans Réglages › Aide."]},{"version":"1.5.2","date":"2026-11-04","titre":"Dégustation à l’aveugle et finitions","items":["Dégustation à l’aveugle : la fiche d’abord sur un « vin mystère », tes hypothèses, puis la révélation, la comparaison et l’analyse du sommelier.","Le bouton + est le même partout : « Nouvelle dégustation » ou « Nouveau vin ».","Présentation de l’app au premier lancement, à revoir dans Réglages › Aide.","Recherche dans « Racheter un vin ». L’import Ploc est désormais dans les réglages.","Nouvelles icônes : un bouchon pour « Déguster », un carnet pour les dégustations."]},{"version":"1.5","date":"2026-11-04","titre":"Dégustations et conseils de rangement","items":["Onglet Dégustations : le journal de tous tes vins dégustés, en cave ou ailleurs (restaurant, salon, domaine…), avec recherche, filtres et vue par vin.","Séances de dégustation avec classement, et liste d’envies avec « Acheté ».","Conseils de rangement dans À boire : vins à rapprocher, à mettre en garde, réassort de la cave de consommation.","Le sommelier propose d’ajuster la fenêtre d’un vin après une dégustation, et tient compte de tes vins bus ailleurs et de tes accords.","Les réglages passent sous l’icône engrenage."]},{"version":"1.0.1","date":"2026-11-04","titre":"Corrections","items":["L’app se rouvre correctement sur iPhone après un premier lancement.","La création de la cave ne pose plus de question : un site « Site 1 », renommable, et le mode plusieurs sites dans les réglages.","La vue Urgence de la page Cave est retirée : l’onglet À boire fait référence."]},{"version":"1.0","date":"2026-11-04","titre":"Première version","items":["Ta cave sur ton iPhone, chiffrée par ton mot de passe ou Face ID, et utilisable hors ligne.","Sites, espaces et meubles (armoire, rack, étagère, caisses, cartons) avec un plan visuel et une recherche.","Ajout par photo d’étiquette ou saisie, rangement suggéré, sorties, déplacements, transferts, primeurs, vins des amis.","Dégustation rapide ou complète avec la roue des arômes.","Sommelier pour les accords mets-vins, fenêtres de dégustation estimées, onglet À boire.","Option spiritueux, import Ploc, sauvegarde chiffrée."]}];

/* ===== 00-core.js ===== */
// L'app ne doit jamais s'afficher dans un cadre : une page tierce pourrait superposer

if (window.top !== window.self) {

/* ---------- Utilitaires ---------- */
const $ = (s, r = document) => r.querySelector(s);
const $$ = (s, r = document) => [...r.querySelectorAll(s)];
const app = $('#app');
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const uid = () => (crypto.randomUUID ? crypto.randomUUID().replace(/-/g, '') : Math.random().toString(36).slice(2) + Date.now().toString(36)).slice(0, 12);
const plural = (n, one, many) => `${n} ${n > 1 ? many : one}`;
const cap = s => s ? s.charAt(0).toUpperCase() + s.slice(1) : '';
const pad = n => String(n).padStart(2, '0');
const today = () => { const d = new Date(); return `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`; };
const thisYear = () => new Date().getFullYear();
const monthKey = (d = new Date()) => `${d.getFullYear()}-${pad(d.getMonth() + 1)}`;
const fmtDate = s => s ? new Date(s.length === 10 ? s + 'T12:00:00' : s).toLocaleDateString('fr-FR', { day: 'numeric', month: 'short', year: 'numeric' }) : '';
const fmtE = new Intl.NumberFormat('fr-FR', { style: 'currency', currency: 'EUR', maximumFractionDigits: 0 });
const fmtE2 = new Intl.NumberFormat('fr-FR', { style: 'currency', currency: 'EUR', minimumFractionDigits: 2, maximumFractionDigits: 2 });
const eur = v => fmtE.format(Math.round(v || 0));
const numFr = (v, d = 1) => v == null ? '' : Number(v).toLocaleString('fr-FR', { maximumFractionDigits: d });
// Saisie d'un nombre au format français : « 12,5 », « 1 234 », « 25 € »
// « 1.234,50 » : point des milliers et virgule décimale ; « 1.234 » seul = 1234
function num(s) {
  if (s == null) return null;
  s = String(s).replace(/[\s\u00a0\u202f€%]/g, '');
  if (s === '') return null;
  if (s.includes(',') && s.includes('.')) s = s.replace(/\./g, '').replace(',', '.');
  else if (/^-?\d{1,3}(\.\d{3})+$/.test(s)) s = s.replace(/\./g, '');
  else s = s.replace(',', '.');
  if (!/^[-+]?(\d+\.?\d*|\.\d+)(e[-+]?\d+)?$/i.test(s)) return null;
  const n = Number(s);
  return Number.isFinite(n) ? n : null;
}
const int = s => { const n = num(s); return n == null ? null : Math.round(n); };
const norm = s => String(s || '').normalize('NFD').replace(/[̀-ͯ]/g, '').toLowerCase().trim();
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
function toast(msg) {
  const t = $('#toast'); t.textContent = msg; t.classList.add('show');
  clearTimeout(toast.t); toast.t = setTimeout(() => t.classList.remove('show'), 2600);
}
const sleep = ms => new Promise(r => setTimeout(r, ms));

/* ---------- Stockage local (IndexedDB, sinon mémoire) ---------- */
let persistent = true;
const mem = new Map();
const memStore = { get: async k => mem.get(k), set: async (k, v) => { mem.set(k, v); }, del: async k => { mem.delete(k); }, keys: async () => [...mem.keys()] };
function idbStore(db) {
  const os = mode => db.transaction('kv', mode).objectStore('kv');
  const wrap = r => new Promise((res, rej) => { r.onsuccess = () => res(r.result); r.onerror = () => rej(r.error); });
  return { get: k => wrap(os('readonly').get(k)), set: (k, v) => wrap(os('readwrite').put(v, k)), del: k => wrap(os('readwrite').delete(k)), keys: () => wrap(os('readonly').getAllKeys()) };
}
async function openStore() {
  try {
    const db = await Promise.race([
      new Promise((res, rej) => {
        const r = indexedDB.open('mycellar', 1);
        r.onupgradeneeded = () => r.result.createObjectStore('kv');
        r.onsuccess = () => res(r.result); r.onerror = () => rej(r.error); r.onblocked = () => rej(new Error('blocked'));
      }),
      new Promise((_, rej) => setTimeout(() => rej(new Error('timeout')), 3000)),
    ]);
    const s = idbStore(db);
    await s.set('_probe', 1); await s.del('_probe');
    return s;
  } catch (e) { persistent = false; return memStore; }
}
// Délai croissant après 5 mots de passe erronés (30 s, 1 min, 2 min… jusqu'à 15 min)
const getFails = async () => (await store.get('fails')) || { n: 0, until: 0 };
async function noteFail() { const f = await getFails(); f.n++; if (f.n >= 5) f.until = Date.now() + Math.min(15 * 60e3, 30e3 * 2 ** (f.n - 5)); await store.set('fails', f); return f; }
const clearFails = () => store.del('fails');

/* ---------- Chiffrement ----------
   Les données sont chiffrées (AES-GCM 256) avec une clé maître aléatoire.
   Cette clé maître est elle-même chiffrée dans des « emplacements » :
   - pw : clé dérivée du mot de passe (PBKDF2-SHA256, 600 000 itérations) ;

/* ---------- Vérification du code de l'app ----------
   Le service worker sert toujours la version mise en cache : le code ne change

   la compare à celle que tu as approuvée, et te signale toute différence. */

  const parts = [];

/* ---------- Feuilles (modales) ----------
   Chaque feuille est une fonction qui renvoie son HTML : la pile permet de revenir à la feuille
   précédente, et refreshSheet() la redessine après un changement d'état. */
let sheetStack = [];
function showSheet(fn, { replace = false, full = false } = {}) {
  if (replace) sheetStack.pop();
  // La fenêtre recouverte garde sa position de défilement, retrouvée au retour
  const cur = sheetStack[sheetStack.length - 1], el = $('.sheet');
  if (cur && el && el.__top === cur) cur.y = el.scrollTop;
  sheetStack.push({ fn, full, u: uPending || fn.name || 'feuille' });
  paintSheet();
}
// Redessiner la fenêtre déjà affichée la met à jour sur place : elle n'est ni recréée ni réanimée
// (pas de clignotement), et le défilement est restauré une fois tout dessiné (roue, curseurs).
function paintSheet(keepScroll) {
  const top = sheetStack[sheetStack.length - 1];
  if (!top) { $('#layer').innerHTML = ''; return; }
  const old = $('.sheet'), same = !!(keepScroll && old && old.__top === top);
  const y = same ? old.scrollTop : (top.y || 0);
  const back = sheetStack.length > 1 ? `<button class="icon-btn" data-act="sheetback" aria-label="Retour">${ICON.back}</button>` : '';
  let html = top.fn();
  if (html == null) { sheetStack.pop(); return paintSheet(); }
  html = html.replace('<!--back-->', back);
  let sh;
  if (same) { sh = old; sh.innerHTML = `<div class="grab"></div>${html}`; }
  else {
    $('#layer').innerHTML = `<div class="backdrop" data-act="close"></div><div class="sheet${top.full ? ' full' : ''}" role="dialog" aria-modal="true"><div class="grab"></div>${html}</div>`;
    sh = $('.sheet'); sh.__top = top;
  }
  afterSheet(); paintPhotos(sh);
  if (y) sh.scrollTop = y;
  uScreenCheck();
}
const refreshSheet = () => paintSheet(true);
function closeSheet() { sheetStack = []; $('#layer').innerHTML = ''; uScreenCheck(); }
function sheetBack() { sheetStack.pop(); paintSheet(); }
// Feuille ponctuelle (message, confirmation)

function formErrors(f, errs) {

/* ---------- Vue Cave ---------- */
let caveMode = 'plan', caveSpace = null, caveQuery = '', caveJumped = false, caveFilter = { color: null, ready: false, owner: 'all', kind: 'all' };

function wineText(w) {
  return norm([w.domaine, w.cuvee, w.appellation, w.region, w.pays, w.millesime, w.cepages, COLORS[w.couleur]?.label, SPIRIT_CATS[w.cat], ...new Set(heldBottles(w.id).map(b => b.owner).filter(Boolean)), w.notes, w.short].filter(Boolean).join(' '));
}
function matcher(q) {
  const toks = norm(q).split(/\s+/).filter(Boolean);
  if (!toks.length) return null;
  const cache = new Map();
  return w => { if (!cache.has(w.id)) { const t = wineText(w); cache.set(w.id, toks.every(k => t.includes(k))); } return cache.get(w.id); };
}

function caveTools() {
  const sps = visibleSpaces();
  const n = id => S.bottles.filter(b => inCave(b) && b.spaceId === id).length;
  return `<div class="search">${ICON.search}<input type="search" placeholder="Rechercher un vin, un domaine, un millésime…" value="${esc(caveQuery)}" data-in="caveSearch" autocomplete="off" enterkeyhint="search">${sx(caveQuery)}</div>

    ${caveMode !== 'liste' && sps.length > 1 ? `<div class="chips"><button class="chip${!caveSpace ? ' on' : ''}" data-act="caveSpace" data-id="">Tout · ${sps.reduce((t, s) => t + n(s.id), 0)}</button>${sps.map(s => `<button class="chip${caveSpace === s.id ? ' on' : ''}" data-act="caveSpace" data-id="${s.id}">${esc(s.name)} · ${n(s.id)}</button>`).join('')}</div>` : ''}
    ${caveMode === 'liste' ? listFilters() : ''}`;
}
function listFilters() {
  const f = caveFilter, ch = (act, v, on, l) => `<button class="chip soft${on ? ' on' : ''}" data-act="${act}" data-v="${v}">${l}</button>`;
  const usedColors = [...new Set(S.wines.filter(w => w.kind !== 'spirit').map(w => w.couleur).filter(Boolean))];
  return `<div class="chips">${ch('lf', 'ready', f.ready, 'Prêts à boire')}

    ${S.wines.some(hasFriend) ? ch('lfo', 'moi', f.owner === 'moi', 'Mes vins') + ch('lfo', 'amis', f.owner === 'amis', 'Vins des amis') : ''}</div>`;

function vCave() {
  if (caveMode === 'liste') return vCaveList();
  const m = matcher(caveQuery), occ = occupancy();
  if (m && !caveJumped) return caveResults(m);
  let sps = visibleSpaces();
  if (caveSpace && sps.some(s => s.id === caveSpace)) sps = sps.filter(s => s.id === caveSpace);
  const ctx = { occ, m, pick: null };
  let found = 0;
  if (m) found = S.bottles.filter(b => inCave(b) && sps.some(s => s.id === b.spaceId) && m(wine(b.wineId))).length;
  const nothing = !S.wines.length;
  return `${nothing ? `<div class="card"><b>Bienvenue dans ta cave</b><p class="small" style="margin:6px 0 10px">Commence par décrire tes meubles (armoire, rack, caisses), puis ajoute tes bouteilles avec le bouton +.</p>

    ${m ? `<p class="small" style="margin:10px 4px 0">${found ? plural(found, 'bouteille trouvée', 'bouteilles trouvées') + ' ici : elles sont encadrées sur le plan.' : 'Aucune bouteille ne correspond ici.'} <button class="link" style="padding:0;font-size:13px" data-act="caveResults">Tous les résultats</button></p>` : ''}
    ${sps.map(sp => spaceBlock(sp, ctx, sps.length > 1)).join('')}
    ${transferChip()}`;
}
/* ---------- Recherche sur tous les sites ---------- */
// Emplacements des bouteilles trouvées : une ligne par case, par caisse, par lot « non placées » d'un espace, par lot en primeur
function locGroups(bs) {
  const cur = S.settings.site, groups = new Map();
  for (const b of bs) {
    const u = b.unitId && unit(b.unitId);
    const k = b.state === 'primeur' ? 'primeur' : !u ? 'np:' + b.spaceId : UNIT_TYPES[u.type].box ? 'box:' + u.id : 'c:' + b.id;
    if (!groups.has(k)) groups.set(k, { b, n: 0, primeur: b.state === 'primeur' });

  const here = site(space(spId)?.siteId); if (!here || here.role === 'stock') return null;
  return S.sites.find(s => s.id !== here.id && s.role === 'stock')?.id || null;
}

/* ---------- Rangement ---------- */
function startPlace(wineId, ids, spaceId, fresh) {
  // Bouteilles d'un même vin à la suite : une caisse se remplit d'un seul vin
  const order = [...new Set(ids.map(id => byId(S.bottles, id)?.wineId))];
  ids = [...ids].sort((a, b) => order.indexOf(byId(S.bottles, a)?.wineId) - order.indexOf(byId(S.bottles, b)?.wineId));
  draft = { place: { wineId, ids, spaceId: spaceId || suggestSpace(wine(wineId)).id, sel: [], fresh } };
  draft.place.sel = suggestFor(draft.place);
  showSheet(placeSheet, { full: true });
}
// Suggestions par vin, dans l'ordre des bouteilles (une caisse ne reçoit qu'un seul vin)
function suggestFor(p) {
  const occ = occupancyExcept(new Set(p.ids)), used = new Set(), out = [], groups = [];
  for (const id of p.ids) { const w = byId(S.bottles, id)?.wineId, g = groups.at(-1); if (g && g.w === w) g.n++; else groups.push({ w, n: 1 }); }
  for (const g of groups) {
    const sl = suggestSlots(p.spaceId, g.n, used, g.w, occ);
    for (const s of sl) { used.add(`${s.unitId}:${s.r}:${s.c}`); out.push(s); }
    if (sl.length < g.n) break;   // les cases restent alignées sur les bouteilles
  }
  return out;
}
function placeSheet() {
  const p = draft?.place; if (!p) return null;
  const w = wine(p.wineId), occ = occupancyExcept(new Set(p.ids)), sp = space(p.spaceId), nw = new Set(p.ids.map(id => byId(S.bottles, id)?.wineId)).size;
  const ask = p.stockAsk && site(p.stockAsk);
  const ctx = { occ, m: null, pick: p };
  const units = spaceUnits(sp.id), grid = units.filter(u => !UNIT_TYPES[u.type].box), boxes = units.filter(u => UNIT_TYPES[u.type].box);
  return `${head(`Ranger ${p.ids.length > 1 ? p.ids.length + ' bouteilles' : 'la bouteille'}`)}
    <p class="small" style="margin-top:-6px">${nw > 1 ? plural(nw, 'vin', 'vins') : `<span class="dot" style="background:${wineColor(w)}"></span> ${esc(wineTitle(w))}`}</p>
    ${ask ? `<div class="banner green" style="margin-top:6px"><b>Vin à garder</b> : à emporter au prochain transfert vers ${esc(ask.name)} ?
      <div class="row" style="gap:8px"><button class="btn small green" data-act="placeToTransfer">Oui, au transfert</button><button class="btn small ghost" data-act="placeNoAsk">Non</button></div></div>` : ''}
    <div class="chips">${S.spaces.map(s => `<button class="chip${s.id === p.spaceId ? ' on' : ''}" data-act="placeSpace" data-id="${s.id}">${esc(isMulti() ? site(s.siteId)?.name + ' › ' : '')}${esc(s.name)}</button>`).join('')}</div>
    <p class="small"><b style="color:var(--ink)">${p.sel.length} / ${p.ids.length}</b> place${p.ids.length > 1 ? 's' : ''} choisie${p.sel.length > 1 ? 's' : ''}. Touche les cases libres pour choisir.</p>
    ${!units.length ? `<div class="card small">Aucun meuble dans cet espace : les bouteilles y seront rangées sans emplacement précis.</div>` : placeShortage(p, units, occ)}
    ${grid.map(u => `<div class="card">${unitHead(u, ctx)}${renderGrid(u, ctx)}</div>`).join('')}
    ${boxes.length ? `<div class="card"><div class="ct">Caisses et cartons</div>${renderBoxes(boxes, ctx)}</div>` : ''}
    <div class="btns" style="margin-top:14px;position:sticky;bottom:0;background:var(--bg);padding:8px 0">
      <div class="btns2"><button class="btn" data-act="placeSuggest">Suggérer</button><button class="btn" data-act="placeClear">Effacer</button></div>
      <button class="btn primary wide" data-act="placeOk">${p.sel.length ? 'Valider le rangement' : 'Laisser sans emplacement'}</button>
    </div>`;
}
function placeToggle(unitId, r, c) {
  const p = draft.place, i = p.sel.findIndex(s => s.unitId === unitId && s.r === r && s.c === c);
  if (i >= 0) p.sel.splice(i, 1);
  else { if (p.sel.length >= p.ids.length) p.sel.shift(); p.sel.push({ unitId, r, c }); }
  refreshSheet();
}

  rebuy: t => { const pr = !!t.dataset.primeur; showSheet(() => addBottlesSheet(t.dataset.id, { primeur: pr })); },
  placeSpace: t => { draft.place.spaceId = t.dataset.id; draft.place.sel = suggestFor(draft.place); refreshSheet(); },
  pickSlot: t => placeToggle(t.dataset.u, +t.dataset.r, +t.dataset.c),
  pickBox: t => {
    const p = draft.place, u = unit(t.dataset.u), occ = occupancyExcept(new Set(p.ids));
    const mine = p.sel.filter(s => s.unitId === u.id), free = freeSlots(u, occ).filter(([r, c]) => !mine.some(s => s.c === c));
    // Un seul vin par caisse : celui de la prochaine bouteille à ranger
    const wid = byId(S.bottles, p.ids[Math.min(p.sel.length, p.ids.length - 1)])?.wineId, inBox = positions(u).map(([r, c]) => occ.get(`${u.id}:${r}:${c}`)).filter(Boolean);
    const selW = p.sel.map((s, i) => s.unitId === u.id ? byId(S.bottles, p.ids[i])?.wineId : null).filter(Boolean);
    if (!mine.length && (inBox.some(b => b.wineId !== wid) || selW.some(w => w !== wid))) return toast('Cette caisse contient déjà un autre vin : une caisse ou un carton ne reçoit qu’un seul vin.');
    if (!free.length || p.sel.length >= p.ids.length) { p.sel = p.sel.filter(s => s.unitId !== u.id); return refreshSheet(); }
    let same = 0; for (let i = p.sel.length; i < p.ids.length && byId(S.bottles, p.ids[i])?.wineId === wid; i++) same++;
    const room = Math.min(p.ids.length - p.sel.length, same);
    for (const [r, c] of free.slice(0, room)) p.sel.push({ unitId: u.id, r, c });
    refreshSheet();
  },
  placeSuggest: () => { draft.place.sel = suggestFor(draft.place); refreshSheet(); },
  placeNoAsk: () => { draft.place.stockAsk = null; refreshSheet(); },
  placeToTransfer: async () => {
    const p = draft?.place; if (!p?.stockAsk) return;
    transferAdd(p.ids, p.stockAsk); await save(); draft = null; closeSheet(); render();
    toast(`${plural(p.ids.length, 'bouteille', 'bouteilles')} au transfert vers ${site(p.stockAsk)?.name || ''} · sans emplacement d’ici là`);
  },
  placeClear: () => { draft.place.sel = []; refreshSheet(); },
  placeOk: async () => {
    const p = draft.place;
    p.ids.forEach((id, i) => {
      const b = byId(S.bottles, id), s = p.sel[i], from = locOf(b);
      Object.assign(b, { spaceId: p.spaceId, unitId: s?.unitId || null, r: s?.r ?? null, c: s?.c ?? null });
      if (!p.fresh && (from.spaceId !== b.spaceId || from.unitId !== b.unitId || from.r !== b.r || from.c !== b.c)) logMove(b, from.siteId !== siteOfBottle(b) ? 'transfert' : 'move', { from, to: locOf(b) });
    });
    S.transfer.ids = S.transfer.ids.filter(id => !p.ids.includes(id) || !p.sel.length);
    await save(); draft = null; closeSheet();
    caveSpace = p.spaceId; if (isMulti()) S.settings.site = space(p.spaceId).siteId;
    view = 'cave'; render(); toast(p.sel.length ? (p.fresh ? 'Bouteilles rangées' : 'Bouteille déplacée') : 'Enregistré, sans emplacement');
  },
  placeUnplaced: t => {
    const ids = S.bottles.filter(b => b.wineId === t.dataset.w && inCave(b) && !b.unitId && b.spaceId === t.dataset.space).map(b => b.id);
    startPlace(t.dataset.w, ids, t.dataset.space, false);
  },
  putHere: async t => {
    const u = unit(t.dataset.u), cand = S.bottles.filter(b => b.wineId === t.dataset.w && inCave(b) && !b.unitId);
    const b = cand.find(x => x.spaceId === u.spaceId) || cand[0]; if (!b) return;
    const from = locOf(b);
    Object.assign(b, { spaceId: u.spaceId, unitId: u.id, r: +t.dataset.r, c: +t.dataset.c });
    logMove(b, 'move', { from, to: locOf(b) });
    await save(); closeSheet(); render(); toast('Bouteille rangée');
  },
  moveBottle: t => { const b = byId(S.bottles, t.dataset.b); startPlace(b.wineId, [b.id], b.spaceId || suggestSpace(wine(b.wineId)).id, false); },
});

/* ---------- Nouveau millésime d'un vin déjà présent (v1.7.4) ---------- */
const VINTAGE_KEEP = ['kind', 'couleur', 'domaine', 'cuvee', 'appellation', 'region', 'pays', 'cepages', 'degre', 'format', 'service', 'bio', 'nature', 'short', 'abbr'];
function vintageBase(w) { const o = {}; for (const k of VINTAGE_KEEP) if (w[k] !== undefined && w[k] !== null) o[k] = structuredClone(w[k]); return o; }
const sameVintage = (base, mill) => S.wines.find(x => x.kind === base.kind && norm(x.domaine) === norm(base.domaine) && norm(x.cuvee) === norm(base.cuvee) && norm(x.appellation) === norm(base.appellation) && (x.millesime || null) === (mill || null) && x.format === base.format);
const siblings = w => S.wines.filter(x => x.id !== w.id && x.kind === w.kind && norm(x.domaine) === norm(w.domaine) && norm(x.cuvee || x.appellation) === norm(w.cuvee || w.appellation) && heldBottles(x.id).length)
  .sort((a, b) => (a.millesime || 0) - (b.millesime || 0));
function vintageSheet(wid, o = {}) {
  const w = wine(wid); if (!w) return null;
  const st = o.primeur ? 'primeur' : 'cave';
  const last = w.achat || {}, base = { ...w, apogee: null };
  return `${head('Nouveau millésime')}
    <p class="small" style="margin-top:-6px"><span class="dot" style="background:${wineColor(w)}"></span> ${esc(wineName(w))} · ${esc(w.domaine || '')}</p>
    <form class="form" data-form="vintage" data-w="${wid}">
      <div class="grid2"><label>Millésime<input name="millesime" inputmode="numeric" placeholder="${w.millesime ? 'ex. ' + (w.millesime + 1) : 'ex. 2021'}" required autocomplete="off"></label>
        <label>Quantité<input name="qty" inputmode="numeric" value="1" required></label></div>
      ${stateFields(st)}
      <label><span class="dest-l">${st === 'primeur' ? 'Destination à la livraison' : 'Ranger dans'}</span><select name="spaceId">${spaceOptions(suggestSpace(base)?.id)}</select></label>
      <div class="fieldset"><div class="ft">Source</div>
        <label>Lieu d’achat<input name="lieu" placeholder="${esc(last.lieu || 'Caviste, domaine, salon…')}" list="dl-lieu" autocomplete="off"></label>
        <label>Offert par<input name="offertPar" placeholder="Si c’est un cadeau" autocomplete="off"></label>
        <div class="grid2"><label>Prix unitaire (€)<input name="prix" inputmode="decimal" placeholder="${last.prix != null ? esc(numFr(last.prix, 2)) : ''}"></label><label>Date d’achat<input type="date" name="adate" value="${today()}"></label></div>
      </div>
      <div class="fieldset"><div class="ft">Propriétaire</div>${ownerFields()}</div>
      <p class="tiny" style="margin:0">Repris : couleur, domaine, cuvée, appellation, région, cépages, degré, format, service. La fenêtre de dégustation sera estimée pour ce millésime.</p>
      <button class="btn primary wide" type="submit">Ajouter ce millésime</button>
      <button class="btn ghost wide" type="button" data-act="vintageFull" data-w="${wid}">Modifier les autres informations</button>
    </form>${dl('dl-lieu', uniq(x => x.achat?.lieu))}`;
}
FORMS.vintage = async (f, d) => {
  const base = wine(f.dataset.w), m = readYear(d.millesime, thisYear() + 1), errs = [], q = String(d.qty).replace(/\s/g, ''), p = d.prix ? num(d.prix) : null;
  if (m.err) errs.push(['millesime', m.err]); else if (m.bad) errs.push(['millesime', 'Une année, par exemple 2021']); else if (!m.v) errs.push(['millesime', 'Le millésime de ce nouveau vin']);
  if (!/^\d+$/.test(q) || +q < 1 || +q > 500) errs.push(['qty', 'Un nombre entier de 1 à 500']);
  if (d.prix && (p == null || p < 0 || p > 100000)) errs.push(['prix', 'Un prix entre 0 et 100 000 €']);
  if (!errs.length) errs.push(...ownerErrors(d, +q));
  if (formErrors(f, errs)) return;
  if (m.filled) f.elements.millesime.value = m.v;
  const qty = +q, same = sameVintage(base, m.v), lieu = String(d.lieu || '').trim(), gift = String(d.offertPar || '').trim();
  if (same && !confirm(`« ${wineTitle(same)} » est déjà dans ta cave. Ajouter ces ${qty} bouteille(s) à ce vin plutôt que de créer un doublon ?`)) return;
  let w = same;
  if (!w) { w = { id: uid(), ...vintageBase(base), millesime: m.v, createdAt: Date.now(), notes: '' }; S.wines.push(w); }
  if (!same || p != null || lieu) w.achat = { ...(same ? w.achat || {} : {}), ...(p != null ? { prix: p } : {}), date: d.adate || null, ...(lieu ? { lieu } : {}) };
  if (gift) w.cadeau = { de: gift };
  const primeur = d.state === 'primeur';
  const ids = createBottles(w, qty, primeur ? { state: 'primeur', delivery: { date: d.delivery || null, spaceId: d.spaceId } } : { spaceId: d.spaceId });
  applyOwners(ids, d);
  S.wishes = S.wishes.filter(x => x.wineId !== w.id);
  await save(); afterAdd(w, ids, primeur);
};
Object.assign(ACT, {
  newVintage: t => { const pr = !!t.dataset.primeur; showSheet(() => vintageSheet(t.dataset.id, { primeur: pr })); },

/* ---------- Propriétaires (v1.7.4) ---------- */
// Champs « Dont pour un ami » : vide = tout à moi ; un prénom sans nombre = toutes les bouteilles pour cet ami
const ownerFields = (withList = true) => `<div class="grid2"><label>Dont pour un ami<input name="friendQty" inputmode="numeric" placeholder="0" autocomplete="off"></label>
  <label>Prénom de l’ami<input name="owner" list="dl-friends" placeholder="Paul" autocomplete="off"></label></div>
  <p class="tiny" style="margin:0">Exemple : 12 bouteilles, dont 6 pour Paul. Les bouteilles d’un ami ne sont jamais proposées par le sommelier.</p>
  ${withList ? dl('dl-friends', friendNames()) : ''}`;
function ownerErrors(d, qty) {
  const o = String(d.owner || '').trim(), raw = String(d.friendQty || '').replace(/\s/g, '');
  if (raw && (!/^\d+$/.test(raw) || +raw > qty)) return [['friendQty', `Un nombre de 0 à ${qty}`]];
  if (raw && +raw > 0 && !o) return [['owner', 'Le prénom de l’ami']];
  return [];
}
function applyOwners(ids, d) {
  const o = String(d.owner || '').trim().slice(0, 40); if (!o) return;
  const raw = String(d.friendQty || '').replace(/\s/g, ''), n = raw === '' ? ids.length : Math.min(ids.length, +raw || 0);
  ids.slice(0, n).forEach(id => { byId(S.bottles, id).owner = o; });
  if (n && !S.settings.friends.includes(o)) S.settings.friends.push(o);
}
// Répartir les bouteilles d'un vin entre moi et des amis
function ownersSheet(wid) {
  const w = wine(wid), bs = heldBottles(wid); if (!w) return null;
  const by = new Map([['', 0]]); for (const b of bs) by.set(b.owner || '', (by.get(b.owner || '') || 0) + 1);
  const row = (o, n, i) => `<div class="grid2" style="align-items:end"><label>${o ? esc(o) : 'À moi'}<input type="hidden" name="o${i}" value="${esc(o)}"></label><label>Bouteilles<input name="n${i}" inputmode="numeric" value="${n}"></label></div>`;
  const rows = [...by];
  return `${head('Répartir entre propriétaires')}
    <p class="small" style="margin-top:-6px"><span class="dot" style="background:${wineColor(w)}"></span> ${esc(wineTitle(w))} · ${plural(bs.length, 'bouteille', 'bouteilles')}</p>
    <form class="form" data-form="owners" data-w="${wid}">
      ${rows.map(([o, n], i) => row(o, n, i)).join('')}
      <div class="grid2"><label>Autre ami<input name="oNew" list="dl-friends" placeholder="Prénom" autocomplete="off"></label><label>Bouteilles<input name="nNew" inputmode="numeric" placeholder="0"></label></div>
      ${dl('dl-friends', friendNames())}
      <p class="tiny" style="margin:0">Le total doit rester ${bs.length}. Les bouteilles gardent leur emplacement.</p>
      <button class="btn primary wide" type="submit">Enregistrer</button>
    </form>`;
}
FORMS.owners = async (f, d) => {
  const w = wine(f.dataset.w), bs = heldBottles(w.id), want = new Map();
  for (let i = 0; d['o' + i] !== undefined; i++) { const n = String(d['n' + i] || '0').trim(); if (!/^\d+$/.test(n)) return formErrors(f, [['n' + i, 'Un nombre entier']]); want.set(d['o' + i], (want.get(d['o' + i]) || 0) + +n); }
  const on = String(d.oNew || '').trim().slice(0, 40), nn = String(d.nNew || '').trim();
  if (nn && !/^\d+$/.test(nn)) return formErrors(f, [['nNew', 'Un nombre entier']]);
  if (on && +nn) want.set(on, (want.get(on) || 0) + +nn);
  const total = [...want.values()].reduce((t, n) => t + n, 0);
  if (total !== bs.length) return formErrors(f, [['n0', `Total ${total} au lieu de ${bs.length}`]]);
  // Chaque bouteille garde son propriétaire tant que possible, les autres passent aux propriétaires à compléter
  const left = new Map(want), loose = [];
  for (const b of bs) { const o = b.owner || ''; if ((left.get(o) || 0) > 0) left.set(o, left.get(o) - 1); else loose.push(b); }
  for (const b of loose) { const o = [...left].find(([, n]) => n > 0)[0]; left.set(o, left.get(o) - 1); b.owner = o || null; if (o && !S.settings.friends.includes(o)) S.settings.friends.push(o); }
  await save(); sheetBack(); refreshSheet(); render(); toast('Répartition enregistrée');
};
// « Appartient à » d'une bouteille (ou de N bouteilles d'une caisse)

  const w = wine(list[0].wineId), cur = list.length === 1 ? list[0].owner || '' : null;
  return `${head(list.length > 1 ? `Attribuer ${list.length} bouteilles` : 'Appartient à')}

    <div class="list">${['', ...friendNames()].map(o => `<button class="li" data-act="setOwner" data-ids="${list.map(b => b.id).join(',')}" data-o="${esc(o)}"><div class="it"><b>${o ? esc(o) : 'À moi'}</b></div>${cur === o ? `<span class="chev" style="color:var(--bx)">${ICON.check}</span>` : ''}</button>`).join('')}</div>
    <form class="form" data-form="setOwner" data-ids="${list.map(b => b.id).join(',')}" style="margin-top:10px"><div class="grid2" style="align-items:end"><label>Autre ami<input name="o" placeholder="Prénom" autocomplete="off"></label><button class="btn" type="submit">Attribuer</button></div></form>`;
}
async function setOwner(ids, o) {

  await save(); sheetBack(); refreshSheet(); render(); toast(o ? `${plural(ids.length, 'bouteille attribuée', 'bouteilles attribuées')} à ${o}` : `${plural(ids.length, 'bouteille', 'bouteilles')} à moi`);

    <p class="small" style="margin-top:-6px"><span class="dot" style="background:${wineColor(w)}"></span> ${esc(wineTitle(w))}</p>

FORMS.addBottles = async (f, d) => {

  if (!/^\d+$/.test(q) || +q < 1 || +q > 500) errs.push(['qty', 'Un nombre entier de 1 à 500']);
  if (d.prix && (p == null || p < 0 || p > 100000)) errs.push(['prix', 'Un prix entre 0 et 100 000 €']);
  if (!errs.length) errs.push(...ownerErrors(d, +q));
  if (formErrors(f, errs)) return;
  const w = wine(f.dataset.w), qty = +q;
  if (num(d.prix) != null) w.achat = { ...(w.achat || {}), prix: num(d.prix), date: d.adate || w.achat?.date };
  const ids = createBottles(w, qty, d.state === 'primeur' ? { state: 'primeur', delivery: { date: d.delivery || null, spaceId: d.spaceId } } : { spaceId: d.spaceId });
  applyOwners(ids, d);
  S.wishes = S.wishes.filter(x => x.wineId !== w.id);   // acheté : il sort de la liste d'envies

};

/* ---------- Transfert entre sites ---------- */
Object.assign(ACT, {
  receive: async t => {
    const b = byId(S.bottles, t.dataset.b), w = wine(b.wineId);
    const ids = S.bottles.filter(x => x.wineId === w.id && x.state === 'primeur').map(x => x.id);
    const n = ids.length > 1 && confirm(`Réceptionner les ${ids.length} bouteilles en primeur de ce vin ?`) ? ids : [b.id];
    const dest = space(b.delivery?.spaceId) || suggestSpace(w);
    for (const id of n) { const x = byId(S.bottles, id); Object.assign(x, { state: 'cave', spaceId: dest.id, unitId: null, r: null, c: null, addedAt: today() }); logMove(x, 'in', { to: locOf(x), primeur: true }); }
    await save(); closeSheet();
    if (spaceUnits(dest.id).length) startPlace(w.id, n, dest.id, true); else { render(); toast('Primeur réceptionné'); }
  },
  openBottle: async t => { const b = byId(S.bottles, t.dataset.b); b.state = 'open'; b.openedAt = today(); b.level = 100; logMove(b, 'open'); await save(); refreshSheet(); render(); },
  outBottle: t => showSheet(() => outSheet(t.dataset.b)),
  bottle: t => showSheet(() => bottleSheet(t.dataset.b)),

  editWine: t => { const w = wine(t.dataset.id); draft = { w: structuredClone(w), edit: w.id }; showSheet(wineFormSheet, { full: true }); },
  delWine: async t => {
    const w = wine(t.dataset.id), n = wineBottles(w.id).length + S.bottles.filter(b => b.wineId === w.id && b.state === 'primeur').length;
    if (!confirm(n ? `Supprimer « ${wineTitle(w)} » et ses ${n} bouteilles encore en cave ? Pour une bouteille bue, utilise plutôt « Sortir ».` : `Supprimer « ${wineTitle(w)} » et son historique ?`)) return;
    const ids = new Set(S.bottles.filter(b => b.wineId === w.id).map(b => b.id));
    S.wines = S.wines.filter(x => x.id !== w.id); S.bottles = S.bottles.filter(b => b.wineId !== w.id);
    S.moves = S.moves.filter(m => m.wineId !== w.id); S.tastings = S.tastings.filter(x => x.wineId !== w.id);
    S.transfer.ids = S.transfer.ids.filter(id => !ids.has(id));

// Places libres insuffisantes dans l'espace choisi : on le dit, et on propose l'espace le plus libre
function placeShortage(p, units, occ) {
  const free = units.reduce((n, u) => n + freeSlots(u, occ).length, 0), miss = p.ids.length - free;
  if (miss <= 0) return '';
  const others = S.spaces.filter(s => s.id !== p.spaceId).map(s => ({ s, n: spaceUnits(s.id).reduce((t, u) => t + freeSlots(u, occ).length, 0) })).sort((a, b) => b.n - a.n);
  const best = others[0];
  return `<div class="banner">Il manque ${plural(miss, 'place', 'places')} dans cet espace : ${plural(miss, 'bouteille restera', 'bouteilles resteront')} « non placée${miss > 1 ? 's' : ''} ».
    ${best && best.n > free ? `<br><button class="btn small" data-act="placeSpace" data-id="${best.s.id}">Aller dans « ${esc(best.s.name)} » (${plural(best.n, 'place libre', 'places libres')})</button>` : ''}</div>`;
}


/* ===== 45-transfer.js ===== */
/* ---------- Transferts entre sites (v1.7.2 : dans les deux sens) ----------
   Chaque bouteille du transfert a sa destination (S.transfer.dest[id] = site). Une section par site :
   « Vers Ville · consommation », « Vers Campagne · stockage », chacune avec ses arrivées. */
function defaultDest(b) {
  const from = b && siteOfBottle(b), others = S.sites.filter(s => s.id !== from);
  if (S.transfer.to && S.transfer.to !== from && site(S.transfer.to)) return S.transfer.to;   // transfert préparé avant la v1.7.2
  const want = site(from)?.role === 'stock' ? 'conso' : 'stock';
  return (others.length === 1 ? others[0] : others.find(s => s.role === want) || others[0])?.id || null;
}
const tDest = id => { const d = S.transfer.dest?.[id]; return d && site(d) ? d : defaultDest(byId(S.bottles, id)); };
function transferAdd(ids, to) {
  S.transfer.dest ||= {};
  for (const id of ids) { const b = byId(S.bottles, id); if (!b || !inCave(b)) continue; if (!S.transfer.ids.includes(id)) S.transfer.ids.push(id); S.transfer.dest[id] = to || defaultDest(b); }
}
function transferRemove(id) { S.transfer.ids = S.transfer.ids.filter(x => x !== id); if (S.transfer.dest) delete S.transfer.dest[id]; }
const transferBottles = () => S.transfer.ids.map(id => byId(S.bottles, id)).filter(b => b && inCave(b));
const roleLabel = s => s.role === 'stock' ? 'stockage' : 'consommation';

function transferSheet() {
  const bs = transferBottles(), order = [...S.sites].sort((a, b) => (a.role === 'stock') - (b.role === 'stock'));
  return `${head('Transferts entre sites')}
    <p class="small" style="margin-top:-6px">Prépare les bouteilles à emporter, dans chaque sens. Touche une bouteille pour voir son résumé.</p>
    ${order.map(s => transferSection(s, bs.filter(b => tDest(b.id) === s.id))).join('')}`;
}
function transferSection(s, list) {
  const stock = s.role === 'stock', sugg = transferSuggestions(s.id);
  const row = b => { const w = wine(b.wineId), st = status(w);
    return `<div class="li"><button class="lb" data-act="tBrief" data-b="${b.id}"><span class="dot" style="background:${wineColor(w)}"></span><div class="it"><b class="ell">${esc(wineTitle(w))}</b><small class="ell">${st && st !== 'inconnu' ? esc(STATUS[st].short) + ' · ' : ''}${esc(locLabel(b, true))}${S.transfer.units?.[b.unitId] ? ' · voyage dans sa caisse' : ''}</small></div></button>

    <div class="chips wrap" style="justify-content:center">${[...sel].map(x => `<button type="button" class="chip soft on" data-act="waro" data-a="${esc(x)}">${esc(x)} ×</button>`).join('')}
