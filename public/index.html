<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="MyCellar">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="theme-color" content="#F7F3EC">
<meta name="referrer" content="no-referrer">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'sha256-SWYdsitLZnatsTKWEcMB5EuNr+CV5oJ4zcyGqRSLPQc='; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; connect-src 'self' https://api.anthropic.com https://api.mistral.ai; worker-src 'self'; manifest-src 'self'; object-src 'none'; frame-src 'none'; form-action 'none'; base-uri 'none'">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<title>MyCellar</title>
<style>
:root{
  --bg:#F7F3EC; --surface:#FFFFFF; --sunk:#EFE8DD; --ink:#2A1F1D; --muted:#7D716B; --line:#E7DFD4;
  --bx:#6E1E2F; --bx-soft:#F3E6E7; --on-bx:#FFFFFF;
  --green:#2F5240; --green-soft:#E4EEE7; --gold:#A8844E; --gold-soft:#F4ECDD; --red:#B03A2E; --red-soft:#F6DCD8;
  --rouge:#8E2435; --blanc:#E3CB6B; --rose:#E59CA2; --bulle:#CDBB8C; --liquo:#C4852A; --orange:#D98B3A; --spirit:#8A5A2B;
  --st-prio:#6E1E2F; --st-apogee:#2F5240; --st-tot:#A8844E; --st-declin:#9A5B4D; --st-inconnu:#B9AFA6;
  --txt:-apple-system,BlinkMacSystemFont,"SF Pro Text",system-ui,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
  --safe-b:env(safe-area-inset-bottom,0px); --safe-t:env(safe-area-inset-top,0px);
  color-scheme:light;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.4 var(--txt);-webkit-font-smoothing:antialiased;font-variant-numeric:tabular-nums;-webkit-tap-highlight-color:transparent}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--bx);outline-offset:2px;border-radius:8px}
.muted{color:var(--muted)} .small{font-size:13px;color:var(--muted)} .tiny{font-size:11.5px;color:var(--muted)}
.sr-only{position:absolute!important;width:1px!important;height:1px!important;min-height:0!important;padding:0!important;margin:-1px!important;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap;border:0!important;left:0;top:0}
.row{display:flex;align-items:center;gap:8px} .between{justify-content:space-between} .wrap{flex-wrap:wrap} .grow{flex:1;min-width:0}
.dot{width:10px;height:10px;border-radius:50%;display:inline-block;flex:none}
.ell{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
html.veil #app,html.veil #layer,html.veil #toast{visibility:hidden}

/* Verrou */
.lock{min-height:100dvh;display:flex;flex-direction:column;justify-content:center;padding:calc(32px + var(--safe-t)) 28px calc(32px + var(--safe-b));max-width:440px;margin:0 auto}
.lock-mark svg{width:64px;height:64px}
.lock-title{font-size:34px;font-weight:700;letter-spacing:-.02em;margin:18px 0 10px}
.lock-text{color:var(--muted);margin:0 0 26px;max-width:36ch}
.lock-form{display:grid;gap:14px}
.lock-links{display:grid;gap:4px;margin-top:22px;justify-items:start}
.or{text-align:center;color:var(--muted);margin:14px 0;font-size:14px}
.err{color:var(--red);margin:0;font-size:15px}
.codebar{padding:calc(12px + var(--safe-t)) 18px 14px;background:var(--gold-soft);font-size:14px;line-height:1.4}
.codebar.bad{background:var(--red-soft)}
.codebar p{margin:0 0 10px}
.fp{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:15px;letter-spacing:.04em}

/* Champs */
label{display:grid;gap:6px;font-size:13.5px;color:var(--muted);font-weight:500}
input[type=text],input[type=password],input[type=number],input[type=date],input[type=search],input:not([type]),select,textarea{width:100%;min-height:44px;padding:10px 12px;font-size:16px;border:1px solid var(--line);border-radius:12px;background:var(--surface);color:var(--ink);-webkit-appearance:none;appearance:none}
textarea{min-height:80px;line-height:1.4;resize:vertical}
select{background-image:linear-gradient(45deg,transparent 50%,var(--muted) 50%),linear-gradient(135deg,var(--muted) 50%,transparent 50%);background-position:calc(100% - 18px) 50%,calc(100% - 13px) 50%;background-size:5px 5px;background-repeat:no-repeat;padding-right:32px}
input[type=date]{display:block}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.grid3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px}
.form{display:grid;gap:12px}
.fieldset{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:12px;display:grid;gap:10px}
.fieldset > .ft{font-size:12px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.5px}
.check{display:flex;align-items:center;gap:10px;font-size:15px;color:var(--ink);font-weight:500}
.check input{width:22px;height:22px;accent-color:var(--bx);margin:0}

/* Boutons */
.btn{border:0;border-radius:12px;min-height:44px;padding:0 16px;font-weight:600;font-size:15px;background:var(--sunk);color:var(--ink);display:inline-flex;align-items:center;justify-content:center;gap:8px;text-align:center}
.btn.primary{background:var(--bx);color:var(--on-bx)}
.btn.green{background:var(--green);color:#fff}
.btn.ghost{background:transparent;border:1px solid var(--line)}
.btn.outline{background:transparent;border:1px solid var(--bx);color:var(--bx)}
.btn.danger{background:transparent;color:var(--red);border:1px solid var(--line)}
.btn.small{min-height:34px;padding:0 12px;font-size:13.5px;border-radius:10px}
.btn.wide{width:100%}
.btn:disabled{opacity:.5}
.btn svg{width:18px;height:18px}
.link{background:none;border:0;padding:8px 0;color:var(--bx);font-weight:600;text-align:left;font-size:15px}
.icon-btn{width:40px;height:40px;border:0;border-radius:12px;background:transparent;display:grid;place-items:center;color:var(--ink);flex:none}
.icon-btn svg{width:22px;height:22px}
.btns{display:grid;gap:8px}
.btns2{display:grid;grid-template-columns:1fr 1fr;gap:8px}

/* Structure */
.top{position:sticky;top:0;z-index:5;padding:calc(8px + var(--safe-t)) 16px 8px;background:color-mix(in srgb,var(--bg) 92%,transparent);-webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px)}
.top-row{display:flex;align-items:center;gap:8px;min-height:44px}
.top h1{font-size:30px;font-weight:700;letter-spacing:-.5px;margin:0;flex:1;min-width:0}
.sitepill{display:inline-flex;align-items:center;gap:6px;background:var(--surface);border:1px solid var(--line);border-radius:20px;padding:6px 12px;font-size:13.5px;font-weight:600;max-width:52vw}
.sitepill span.ell{max-width:34vw}
.view{padding:0 14px calc(110px + var(--safe-b));max-width:620px;margin:0 auto}
.banner{margin:8px 0 0;padding:10px 14px;border-radius:12px;background:var(--gold-soft);font-size:14px;line-height:1.4}
.banner.bx{background:var(--bx);color:#fff}
.banner.green{background:var(--green-soft)}
.banner .btn{margin-top:8px}
.empty{text-align:center;color:var(--muted);padding:40px 20px;font-size:15px}
.empty svg{width:44px;height:44px;opacity:.5;margin-bottom:8px}
.sect{font-size:12px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.5px;margin:18px 4px 6px}

/* Recherche, segments, pastilles */
.search{margin-top:8px;display:flex;align-items:center;gap:8px;background:var(--sunk);border-radius:12px;padding:0 10px}
.search svg{width:18px;height:18px;color:var(--muted);flex:none}
.search input{border:0;background:transparent;min-height:40px;padding:8px 0;font-size:16px}
.search input:focus{outline:none}
.seg{display:flex;background:#EAE2D6;border-radius:10px;padding:2px;margin-top:10px}
.seg button{flex:1;border:0;background:none;font-size:13.5px;font-weight:600;padding:7px 4px;border-radius:8px;color:var(--muted)}
.seg button.on{background:var(--surface);color:var(--ink);box-shadow:0 1px 2px rgba(0,0,0,.08)}
.chips{display:flex;gap:6px;margin-top:10px;overflow-x:auto;padding-bottom:2px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chips.wrap{flex-wrap:wrap;overflow:visible}
.chip{flex:none;font-size:13px;padding:7px 12px;border-radius:16px;background:var(--surface);border:1px solid var(--line);white-space:nowrap;font-weight:500;color:var(--ink);display:inline-flex;align-items:center;gap:6px}
.chip.on{background:var(--bx);color:#fff;border-color:var(--bx)}
.chip.soft.on{background:var(--bx-soft);color:var(--bx);border-color:var(--bx);font-weight:600}
.chip.dash{border-style:dashed;color:var(--muted)}
.tag{font-size:11.5px;padding:3px 8px;border-radius:10px;background:#F2ECE3;font-weight:500;white-space:nowrap}
.tag.g{background:var(--green-soft);color:var(--green)} .tag.b{background:var(--bx-soft);color:var(--bx)} .tag.o{background:var(--gold-soft);color:#7A5C2E} .tag.r{background:var(--red-soft);color:var(--red)}
.tags{display:flex;gap:5px;flex-wrap:wrap}

/* Cartes */
.card{background:var(--surface);border-radius:16px;padding:12px;margin-top:10px;border:1px solid var(--line)}
.card.tap{cursor:pointer}
.ct{font-size:14px;font-weight:700;display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:8px}
.ct span.small{font-weight:500}
.ct .icon-btn{width:32px;height:32px;margin:-6px -6px -6px 0}
.ct .icon-btn svg{width:18px;height:18px}

/* Plan : armoire / étagère */
.shelf-l{font-size:10px;color:var(--muted);margin:8px 0 3px;font-weight:600;letter-spacing:.3px;text-transform:uppercase}
.shelf{display:grid;gap:4px}
.slot{background:#FAF7F2;border:1px solid var(--line);border-radius:7px;min-height:42px;padding:4px 3px 4px 8px;position:relative;overflow:hidden;text-align:left;font-size:9.5px;line-height:1.2;min-width:0}
.slot i{position:absolute;left:0;top:0;bottom:0;width:4px}
.slot b{display:block;font-size:10px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;letter-spacing:-.1px}
.slot small{display:block;color:var(--muted);font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.slot.empty{background:transparent;border-style:dashed}
.slot.hl{outline:2px solid var(--bx);outline-offset:1px;background:var(--bx-soft)}
.slot.dim{opacity:.35}
.slot.ami{background:repeating-linear-gradient(135deg,#FAF7F2 0 5px,#EFE8DD 5px 7px)}
.slot .ini{position:absolute;right:3px;bottom:2px;font-size:8.5px;background:var(--gold);color:#fff;border-radius:6px;padding:0 3px;font-weight:700}
.slot.sel{outline:2px solid var(--green);outline-offset:1px;background:var(--green-soft)}
.slot.st{color:#fff;border-color:transparent}
.slot.st small{color:rgba(255,255,255,.85)}
/* Plan : rack */
.rack{display:grid;gap:6px 4px;justify-content:space-between}
.rc{width:100%;max-width:36px;aspect-ratio:1;height:auto;justify-self:center;border-radius:50%;border:1px solid var(--line);background:#FAF7F2;display:flex;align-items:center;justify-content:center;font-size:9px;font-weight:700;color:#fff;padding:0;position:relative;letter-spacing:-.2px}
.rc.hl{box-shadow:0 0 0 2px var(--bg),0 0 0 4px var(--bx)}
.rc.dim{opacity:.3}
.rc.sel{box-shadow:0 0 0 2px var(--bg),0 0 0 4px var(--green)}
.rc.ami::after{content:attr(data-ini);position:absolute;right:-3px;bottom:-3px;background:var(--gold);color:#fff;font-size:8px;border-radius:6px;padding:0 3px}
.rc.light{color:#4a3d10}
.rack-scroll{overflow-x:auto;padding:4px 2px}
/* Plan : caisses */
.pile{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.crate{background:#EADCC4;border:1px solid #D8C5A5;border-radius:8px;padding:8px;font-size:12px;font-weight:600;line-height:1.3;text-align:left;min-width:0}
.crate.carton{background:#E6D3B5;border-color:#CFB892}
.crate small{display:block;font-weight:500;color:#6E5A3E}
.crate .cnt{display:inline-block;margin-top:5px;background:#fff;border-radius:8px;padding:1px 7px;font-size:11px}
.crate.hl{outline:2px solid var(--bx);outline-offset:1px}
.crate.dim{opacity:.35}
.unplaced{display:flex;gap:6px;flex-wrap:wrap}
.legend{display:flex;gap:10px;flex-wrap:wrap;font-size:11.5px;color:var(--muted);margin-top:8px}
.legend span{display:inline-flex;align-items:center;gap:4px}

/* Listes */
.list{background:var(--surface);border:1px solid var(--line);border-radius:16px;margin-top:10px;overflow:hidden}
.li{display:flex;gap:10px;align-items:center;padding:11px 12px;border-bottom:1px solid var(--line);text-align:left;width:100%;background:none;border-left:0;border-right:0;border-top:0}
.li:last-child{border-bottom:0}
.li .it{flex:1;min-width:0}
.li .it b{font-size:14.5px;display:block;font-weight:600}
.li .it small{font-size:12.5px;color:var(--muted);display:block}
.qty{font-size:13px;font-weight:700;background:#F2ECE3;border-radius:9px;padding:3px 8px;flex:none}
.chev{color:var(--muted);flex:none}
.chev svg{width:16px;height:16px}
.thumb{width:40px;height:52px;border-radius:6px;object-fit:cover;flex:none;background:var(--sunk)}

/* Fenêtre de dégustation */
.win{position:relative;height:6px;background:#EFE8DD;border-radius:3px;margin-top:7px}
.win .w{position:absolute;top:0;bottom:0;border-radius:3px;background:linear-gradient(90deg,var(--gold) 0%,var(--green) 40%,var(--green) 70%,var(--st-declin) 100%)}
.win .now{position:absolute;top:-3px;width:2px;height:12px;background:var(--ink);border-radius:1px}
.win.big{height:10px;border-radius:5px}
.win.big .now{height:18px;top:-4px}
.winlab{display:flex;justify-content:space-between;font-size:11.5px;color:var(--muted);margin-top:4px}

/* À boire */
.kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin-top:10px}
.kpi{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:8px 4px;text-align:center}
.kpi b{display:block;font-size:21px}
.kpi span{font-size:10.5px;color:var(--muted);font-weight:600}
.kpi.on{border:1.5px solid var(--bx)}
.bars{display:flex;align-items:flex-end;gap:6px;height:90px}
.bars div{flex:1;border-radius:4px 4px 0 0;min-height:2px;position:relative}
.bars div span{position:absolute;top:-16px;left:0;right:0;text-align:center;font-size:10.5px;font-weight:700;color:var(--ink)}
.barl{display:flex;gap:6px;font-size:10.5px;color:var(--muted);margin-top:4px;text-align:center}
.barl span{flex:1}

/* Barre d'onglets */
.tabs{position:fixed;left:0;right:0;bottom:0;z-index:6;display:grid;grid-template-columns:1fr 1fr 72px 1fr 1fr;padding:6px 4px calc(6px + var(--safe-b));background:color-mix(in srgb,var(--surface) 94%,transparent);-webkit-backdrop-filter:blur(16px);backdrop-filter:blur(16px);border-top:1px solid var(--line)}
.tab{display:flex;flex-direction:column;align-items:center;gap:3px;font-size:10.5px;color:var(--muted);font-weight:500;background:none;border:0;padding:4px 0}
.tab svg{width:24px;height:24px}
.tab.on{color:var(--bx)}
.tab.plus span{width:56px;height:56px;border-radius:50%;background:var(--bx);color:#fff;display:flex;align-items:center;justify-content:center;margin-top:-26px;box-shadow:0 6px 16px rgba(110,30,47,.35);border:4px solid var(--bg)}
.tab.plus svg{width:26px;height:26px}

/* Feuilles */
.backdrop{position:fixed;inset:0;z-index:20;background:rgba(30,15,12,.38)}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:21;max-height:92dvh;overflow:auto;overscroll-behavior:contain;background:var(--bg);border-radius:22px 22px 0 0;padding:8px 16px calc(24px + var(--safe-b));max-width:620px;margin:0 auto;animation:up .22s ease-out}
.sheet.full{top:calc(10px + var(--safe-t));max-height:none}
@keyframes up{from{transform:translateY(30px);opacity:.4}to{transform:none;opacity:1}}
.sheet .grab{height:18px;position:relative;margin-bottom:2px}
.sheet .grab::after{content:'';position:absolute;left:50%;top:6px;transform:translateX(-50%);width:40px;height:5px;border-radius:9px;background:var(--line)}
.sheet h2{font-size:21px;font-weight:700;margin:2px 0 12px;letter-spacing:-.2px}
.sheet h3{font-size:15px;font-weight:700;margin:20px 0 8px}
.shead{display:flex;align-items:center;gap:8px;margin:0 0 10px}
.shead h2{flex:1;margin:0;min-width:0}
.shead .link{padding:6px 0}
.toast{position:fixed;left:50%;bottom:calc(96px + var(--safe-b));transform:translateX(-50%);z-index:30;background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:12px;font-size:15px;font-weight:600;opacity:0;pointer-events:none;transition:opacity .2s;max-width:90vw;text-align:center}
.toast.show{opacity:1}
@media (prefers-reduced-motion: reduce){.sheet{animation:none}.toast{transition:none}}
.kv{display:grid;grid-template-columns:auto 1fr;gap:6px 12px;font-size:14px;margin:0}
.kv dt{color:var(--muted)} .kv dd{margin:0;font-weight:500;text-align:right}
.photo{width:100%;max-height:260px;object-fit:contain;border-radius:12px;background:var(--sunk)}
.big-actions{display:grid;gap:10px}
.big-action{display:flex;align-items:center;gap:14px;text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:14px;width:100%}
.big-action svg{width:28px;height:28px;color:var(--bx);flex:none}
.big-action b{display:block;font-size:15.5px}
.big-action small{color:var(--muted);font-size:13px}

/* Interrupteur */
.switch{position:relative;width:48px;height:28px;flex:none}
.switch input{opacity:0;width:100%;height:100%;margin:0;position:absolute;inset:0;z-index:1;cursor:pointer}
.switch span{position:absolute;inset:0;border-radius:14px;background:#E2D9CC;transition:background .15s}
.switch span::after{content:"";position:absolute;top:2px;left:2px;width:24px;height:24px;border-radius:50%;background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.2);transition:left .15s}
.switch input:checked + span{background:var(--green)}
.switch input:checked + span::after{left:22px}
.switch input:disabled + span{opacity:.45}
.set{display:flex;align-items:center;gap:10px;padding:11px 0;border-bottom:1px solid var(--line);width:100%;text-align:left;background:none;border-left:0;border-right:0;border-top:0}
.set:last-child{border-bottom:0}
.set .it{flex:1;min-width:0}
.set .it b{display:block;font-size:15px;font-weight:600}
.set .it small{display:block;font-size:12.5px;color:var(--muted)}
.set .val{font-size:13.5px;color:var(--bx);font-weight:600;flex:none}
.meter{height:8px;background:var(--sunk);border-radius:4px;overflow:hidden;margin-top:8px}
.meter i{display:block;height:100%;background:var(--green);border-radius:4px}
.meter i.warn{background:var(--gold)} .meter i.over{background:var(--red)}

/* Sommelier */
.chat{padding-bottom:170px}
.bubble{max-width:86%;padding:10px 13px;border-radius:18px;font-size:15px;line-height:1.4;margin-top:10px;white-space:pre-wrap;word-wrap:break-word}
.bubble.me{background:var(--bx);color:#fff;margin-left:auto;border-bottom-right-radius:6px}
.bubble.ai{background:var(--surface);border:1px solid var(--line);border-bottom-left-radius:6px}
.bubble.err{background:var(--red-soft);border:0}
.reco{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:12px;margin-top:8px}
.reco.first{border:1.5px solid var(--bx)}
.rk{font-size:11px;font-weight:700;color:var(--bx);letter-spacing:.4px;text-transform:uppercase}
.rn{font-size:15.5px;font-weight:700;margin-top:3px}
.rs{font-size:12.5px;color:var(--muted);margin-top:1px}
.why{font-size:13.5px;line-height:1.4;margin-top:7px}
.loc{display:flex;align-items:center;gap:6px;margin-top:8px;font-size:12.5px;font-weight:600;color:var(--green)}
.loc svg{width:14px;height:14px;flex:none}
.composer{position:fixed;left:0;right:0;bottom:calc(68px + var(--safe-b));z-index:5;padding:8px 14px;background:linear-gradient(to bottom,transparent,var(--bg) 16px);max-width:620px;margin:0 auto}
.composer .box{display:flex;align-items:flex-end;gap:8px;background:var(--surface);border:1px solid var(--line);border-radius:22px;padding:4px 4px 4px 14px}
.composer textarea{border:0;min-height:38px;max-height:120px;padding:9px 0;background:transparent;resize:none;font-size:16px}
.composer textarea:focus{outline:none}
.composer .send{width:38px;height:38px;border-radius:50%;background:var(--bx);color:#fff;border:0;display:grid;place-items:center;flex:none}
.composer .send svg{width:18px;height:18px}
.composer .send:disabled{opacity:.4}
.typing{display:inline-flex;gap:4px}
.typing i{width:7px;height:7px;border-radius:50%;background:var(--muted);animation:blink 1.2s infinite}
.typing i:nth-child(2){animation-delay:.2s}.typing i:nth-child(3){animation-delay:.4s}
@keyframes blink{0%,80%,100%{opacity:.25}40%{opacity:1}}

/* Dégustation */
.score{font-size:42px;font-weight:700;color:var(--bx);text-align:center;line-height:1.1}
.score small{font-size:17px;color:var(--muted);font-weight:600}
input[type=range]{-webkit-appearance:none;appearance:none;width:100%;height:28px;background:transparent;margin:0}
input[type=range]::-webkit-slider-runnable-track{height:4px;border-radius:2px;background:linear-gradient(to right,var(--bx) var(--p,50%),#EAE2D6 var(--p,50%))}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:24px;height:24px;border-radius:50%;background:#fff;border:1px solid var(--line);box-shadow:0 1px 4px rgba(0,0,0,.22);margin-top:-10px}
input[type=range]::-moz-range-track{height:4px;border-radius:2px;background:#EAE2D6}
input[type=range]::-moz-range-progress{height:4px;border-radius:2px;background:var(--bx)}
input[type=range]::-moz-range-thumb{width:22px;height:22px;border-radius:50%;background:#fff;border:1px solid var(--line)}
.sl{display:grid;grid-template-columns:84px 1fr 36px;align-items:center;gap:8px;font-size:13px}
.sl output{font-size:12px;color:var(--muted);text-align:right}
.lbl{font-size:12px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.4px;margin:16px 0 6px}
.wheel{display:flex;justify-content:center;margin:4px 0}
.wheel svg{max-width:100%;height:auto;touch-action:manipulation}
.wheel path{cursor:pointer}
.wheel text{pointer-events:none;user-select:none}
.teintes{display:flex;gap:8px;flex-wrap:wrap}
.teinte{width:38px;height:38px;border-radius:50%;border:2px solid #fff;box-shadow:0 0 0 1px var(--line);padding:0}
.teinte.on{box-shadow:0 0 0 2px var(--bx)}
.level{display:flex;align-items:center;gap:10px}

.bottle-level i{position:absolute;left:0;right:0;bottom:0;background:var(--spirit)}

@media (min-width:700px){ .pile{grid-template-columns:repeat(3,1fr)} }

<script>
'use strict';

/* ===== 00-core.js ===== */
// L'app ne doit jamais s'afficher dans un cadre : une page tierce pourrait superposer
// des éléments invisibles au-dessus du champ de mot de passe (clickjacking).
if (window.top !== window.self) {
  document.documentElement.textContent = 'Cette application ne peut pas s’afficher dans un cadre. Ouvre-la directement depuis son adresse.';
  throw new Error('framed');
}

/* ---------- Utilitaires ---------- */
const $ = (s, r = document) => r.querySelector(s);
const $$ = (s, r = document) => [...r.querySelectorAll(s)];
const app = $('#app');
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const uid = () => (crypto.randomUUID ? crypto.randomUUID().replace(/-/g, '') : Math.random().toString(36).slice(2) + Date.now().toString(36)).slice(0, 12);
const plural = (n, one, many) => `${n} ${n > 1 ? many : one}`;
const cap = s => s ? s.charAt(0).toUpperCase() + s.slice(1) : '';
const pad = n => String(n).padStart(2, '0');
const today = () => { const d = new Date(); return `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`; };
const thisYear = () => new Date().getFullYear();
const monthKey = (d = new Date()) => `${d.getFullYear()}-${pad(d.getMonth() + 1)}`;
const fmtDate = s => s ? new Date(s.length === 10 ? s + 'T12:00:00' : s).toLocaleDateString('fr-FR', { day: 'numeric', month: 'short', year: 'numeric' }) : '';
const fmtE = new Intl.NumberFormat('fr-FR', { style: 'currency', currency: 'EUR', maximumFractionDigits: 0 });
const fmtE2 = new Intl.NumberFormat('fr-FR', { style: 'currency', currency: 'EUR', minimumFractionDigits: 2, maximumFractionDigits: 2 });
const eur = v => fmtE.format(Math.round(v || 0));
const numFr = (v, d = 1) => v == null ? '' : Number(v).toLocaleString('fr-FR', { maximumFractionDigits: d });
// Saisie d'un nombre au format français : « 12,5 », « 1 234 », « 25 € »
function num(s) {
  if (s == null) return null;
  s = String(s).replace(/[\s  €%]/g, '').replace(',', '.');
  if (s === '') return null;
  const n = Number(s);
  return Number.isFinite(n) ? n : null;
}
const int = s => { const n = num(s); return n == null ? null : Math.round(n); };
const norm = s => String(s || '').normalize('NFD').replace(/[̀-ͯ]/g, '').toLowerCase().trim();
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
function toast(msg) {
  const t = $('#toast'); t.textContent = msg; t.classList.add('show');
  clearTimeout(toast.t); toast.t = setTimeout(() => t.classList.remove('show'), 2600);
}
const sleep = ms => new Promise(r => setTimeout(r, ms));

/* ---------- Stockage local (IndexedDB, sinon mémoire) ---------- */
let persistent = true;
const mem = new Map();
const memStore = { get: async k => mem.get(k), set: async (k, v) => { mem.set(k, v); }, del: async k => { mem.delete(k); }, keys: async () => [...mem.keys()] };
function idbStore(db) {
  const os = mode => db.transaction('kv', mode).objectStore('kv');
  const wrap = r => new Promise((res, rej) => { r.onsuccess = () => res(r.result); r.onerror = () => rej(r.error); });
  return { get: k => wrap(os('readonly').get(k)), set: (k, v) => wrap(os('readwrite').put(v, k)), del: k => wrap(os('readwrite').delete(k)), keys: () => wrap(os('readonly').getAllKeys()) };
}
async function openStore() {
  try {
    const db = await Promise.race([
      new Promise((res, rej) => {
        const r = indexedDB.open('mycellar', 1);
        r.onupgradeneeded = () => r.result.createObjectStore('kv');
        r.onsuccess = () => res(r.result); r.onerror = () => rej(r.error); r.onblocked = () => rej(new Error('blocked'));
      }),
      new Promise((_, rej) => setTimeout(() => rej(new Error('timeout')), 3000)),
    ]);
    const s = idbStore(db);
    await s.set('_probe', 1); await s.del('_probe');
    return s;
  } catch (e) { persistent = false; return memStore; }
}
// Délai croissant après 5 mots de passe erronés (30 s, 1 min, 2 min… jusqu'à 15 min)
const getFails = async () => (await store.get('fails')) || { n: 0, until: 0 };
async function noteFail() { const f = await getFails(); f.n++; if (f.n >= 5) f.until = Date.now() + Math.min(15 * 60e3, 30e3 * 2 ** (f.n - 5)); await store.set('fails', f); return f; }
const clearFails = () => store.del('fails');

/* ---------- Chiffrement ----------
   Les données sont chiffrées (AES-GCM 256) avec une clé maître aléatoire.
   Cette clé maître est elle-même chiffrée dans des « emplacements » :
   - pw : clé dérivée du mot de passe (PBKDF2-SHA256, 600 000 itérations) ;
   - pk : clé dérivée d'une clé d'accès grâce à l'extension WebAuthn PRF (Face ID) ;
   - appareil (option « rester déverrouillé ») : clé non exportable propre à cet appareil,
     rangée hors du coffre et jamais incluse dans les sauvegardes.
   Les photos sont chiffrées une par une avec la même clé maître. */
const ITER = 600000;
const enc = new TextEncoder(), dec = new TextDecoder();
const rand = n => crypto.getRandomValues(new Uint8Array(n));
function b64(buf) { const u = new Uint8Array(buf); let s = ''; for (let i = 0; i < u.length; i += 0x8000) s += String.fromCharCode.apply(null, u.subarray(i, i + 0x8000)); return btoa(s); }
const unb64 = s => Uint8Array.from(atob(s), c => c.charCodeAt(0));
const importDek = raw => crypto.subtle.importKey('raw', raw, 'AES-GCM', false, ['encrypt', 'decrypt']);
async function aesEnc(k, bytes) { const iv = rand(12); const ct = await crypto.subtle.encrypt({ name: 'AES-GCM', iv }, k, bytes); return { iv: b64(iv), ct: b64(ct) }; }
async function aesDec(k, iv, ct) { return new Uint8Array(await crypto.subtle.decrypt({ name: 'AES-GCM', iv: unb64(iv) }, k, unb64(ct))); }
async function pwKek(pass, salt, iter) {
  const base = await crypto.subtle.importKey('raw', enc.encode(pass), 'PBKDF2', false, ['deriveKey']);
  return crypto.subtle.deriveKey({ name: 'PBKDF2', salt, iterations: iter, hash: 'SHA-256' }, base, { name: 'AES-GCM', length: 256 }, false, ['encrypt', 'decrypt']);
}
async function prfKek(secret) {
  const base = await crypto.subtle.importKey('raw', secret, 'HKDF', false, ['deriveKey']);
  return crypto.subtle.deriveKey({ name: 'HKDF', hash: 'SHA-256', salt: enc.encode('mycellar'), info: enc.encode('cle-d-acces-v1') }, base, { name: 'AES-GCM', length: 256 }, false, ['encrypt', 'decrypt']);
}
async function makePwSlot(raw, pass) { const salt = rand(16); return { salt: b64(salt), iter: ITER, ...(await aesEnc(await pwKek(pass, salt, ITER), raw)) }; }
const openPwSlot = async (slot, pass) => aesDec(await pwKek(pass, unb64(slot.salt), slot.iter), slot.iv, slot.ct);
const iterOk = n => Number.isInteger(n) && n >= 100000 && n <= 10000000;
async function seal() {
  const k = dek, sl = slots, bytes = enc.encode(JSON.stringify(S));
  if (!k || !sl) throw new Error('coffre verrouillé');
  return { app: 'mycellar', v: 1, slots: sl, ...(await aesEnc(k, bytes)), savedAt: Date.now() };
}
async function openVault(vault, { pass, prf, raw: given }) {
  if (!vault || typeof vault !== 'object' || vault.app !== 'mycellar' || typeof vault.iv !== 'string' || typeof vault.ct !== 'string' || !vault.slots) throw new Error('format');
  let raw = given;
  if (!raw) {
    if (!prf && (!vault.slots.pw || !iterOk(vault.slots.pw.iter))) throw new Error('format');
    raw = prf ? await aesDec(await prfKek(prf), vault.slots.pk.iv, vault.slots.pk.ct) : await openPwSlot(vault.slots.pw, pass);
  }
  const data = JSON.parse(dec.decode(await aesDec(await importDek(raw), vault.iv, vault.ct)));
  return { raw, data, slots: vault.slots };
}
async function adopt(o) { dekRaw = o.raw; dek = await importDek(o.raw); slots = o.slots; S = normalize(o.data); mode = 'app'; }
function wipeKeys() {
  dekRaw?.fill(0); dekRaw = null; dek = null; slots = null; S = null;
  for (const u of photoUrls.values()) URL.revokeObjectURL(u);
  photoUrls.clear(); draft = null; wheelState = null; chatBusy = false;
  try {
    const t = $('#toast'); if (t) { t.textContent = ''; t.classList.remove('show'); }
    $$('input[type=file]').forEach(i => { i.value = ''; });
  } catch {}
}

/* ---------- Rester déverrouillé sur cet appareil ---------- */
async function devEnable() {
  const key = await crypto.subtle.generateKey({ name: 'AES-GCM', length: 256 }, false, ['encrypt', 'decrypt']);
  await store.set('devkey', key);
  await store.set('devslot', await aesEnc(key, dekRaw));
}
async function devDisable() { await store.del('devkey'); await store.del('devslot'); }
async function devOpen() {
  const key = await store.get('devkey'), slot = await store.get('devslot');
  if (!key || !slot) return null;
  try { return await aesDec(key, slot.iv, slot.ct); } catch { return null; }
}

/* ---------- Photos (chiffrées une par une) ---------- */
const photoUrls = new Map();
async function photoSave(id, blob) {
  if (!dek) { photoUrls.set(id, URL.createObjectURL(blob)); return; }   // démo : en mémoire seulement
  const bytes = new Uint8Array(await blob.arrayBuffer());
  await store.set('ph:' + id, await aesEnc(dek, bytes));
  if (photoUrls.has(id)) URL.revokeObjectURL(photoUrls.get(id));
  photoUrls.set(id, URL.createObjectURL(blob));
}
async function photoUrl(id) {
  if (photoUrls.has(id)) return photoUrls.get(id);
  if (mode === 'demo') return null;
  const e = await store.get('ph:' + id); if (!e || !dek) return null;
  try { const u = URL.createObjectURL(new Blob([await aesDec(dek, e.iv, e.ct)], { type: 'image/jpeg' })); photoUrls.set(id, u); return u; } catch { return null; }
}
async function photoDel(id) { await store.del('ph:' + id); if (photoUrls.has(id)) { URL.revokeObjectURL(photoUrls.get(id)); photoUrls.delete(id); } }
// Remplit les <img data-photo> une fois la page affichée
async function paintPhotos(root = document) {
  for (const img of $$('img[data-photo]', root)) {
    const u = await photoUrl(img.dataset.photo);
    if (u) { img.src = u; img.hidden = false; }
  }
}
// Réduit une image (photo d'étiquette) : JPEG, plus grand côté = max
async function shrinkImage(file, max = 1024, q = 0.78) {
  let bmp;
  try { bmp = await createImageBitmap(file); }
  catch {   // repli pour les formats que createImageBitmap ne lit pas : passage par une balise <img>
    const u = URL.createObjectURL(file);
    bmp = await new Promise((res, rej) => { const i = new Image(); i.onload = () => res(i); i.onerror = rej; i.src = u; });
    setTimeout(() => URL.revokeObjectURL(u), 1000);
  }
  const r = Math.min(1, max / Math.max(bmp.width, bmp.height));
  const c = document.createElement('canvas'); c.width = Math.round(bmp.width * r); c.height = Math.round(bmp.height * r);
  c.getContext('2d').drawImage(bmp, 0, 0, c.width, c.height);
  bmp.close?.();
  return await new Promise(res => c.toBlob(res, 'image/jpeg', q));
}
const blobB64 = async blob => b64(await blob.arrayBuffer());

/* ---------- Clé d'accès : Face ID via le trousseau iCloud ---------- */
const pkAvailable = () => !!(window.PublicKeyCredential && navigator.credentials && window.isSecureContext);
function pkError(e) {
  if (e?.message === 'noprf') return 'Ce gestionnaire de clés d’accès ne permet pas de déverrouiller l’app (extension PRF non prise en charge). Supprime la clé créée et réessaie en l’enregistrant dans le trousseau iCloud.';
  if (e?.name === 'NotAllowedError') return 'Opération annulée ou expirée.';
  if (e?.name === 'SecurityError') return 'Les clés d’accès ne fonctionnent qu’à l’adresse https de l’app installée.';
  return 'La clé d’accès n’a pas pu être utilisée.';
}
async function prfGet(slot) {
  const cred = await navigator.credentials.get({ publicKey: {
    challenge: rand(32), rpId: location.hostname, userVerification: 'required', timeout: 60000,
    allowCredentials: [{ type: 'public-key', id: unb64(slot.credId) }],
    extensions: { prf: { eval: { first: unb64(slot.prfSalt) } } } } });
  const r = cred.getClientExtensionResults()?.prf?.results?.first;
  if (!r) throw new Error('noprf');
  return new Uint8Array(r);
}
async function pkCreate() {
  const prfSalt = rand(32);
  const cred = await navigator.credentials.create({ publicKey: {
    rp: { name: 'MyCellar', id: location.hostname },
    user: { id: rand(16), name: 'MyCellar', displayName: 'MyCellar' },
    challenge: rand(32),
    pubKeyCredParams: [{ type: 'public-key', alg: -7 }, { type: 'public-key', alg: -257 }],
    authenticatorSelection: { residentKey: 'required', requireResidentKey: true, userVerification: 'required' },
    timeout: 60000, extensions: { prf: { eval: { first: prfSalt } } } } });
  const ext = cred.getClientExtensionResults()?.prf;
  if (ext && ext.enabled === false) throw new Error('noprf');
  return { slot: { credId: b64(cred.rawId), prfSalt: b64(prfSalt) }, secret: ext?.results?.first ? new Uint8Array(ext.results.first) : null };
}
async function pkStore(slot, secret) {
  slots = { ...slots, pk: { ...slot, ...(await aesEnc(await prfKek(secret), dekRaw)), createdAt: Date.now() } };
  await save();
}
const sameBytes = (a, b) => a && b && a.length === b.length && a.every((v, i) => v === b[i]);

/* ---------- Vérification du code de l'app ----------
   Le service worker sert toujours la version mise en cache : le code ne change
   jamais tout seul. À chaque démarrage, l'app calcule l'empreinte du code servi,
   la compare à celle que tu as approuvée, et te signale toute différence. */
const CODE_FILES = ['./index.html', './sw.js'];
let code = { status: 'unknown', served: null, approved: null, net: null, at: null, err: null, checked: null };
const hex = u8 => [...u8].map(b => b.toString(16).padStart(2, '0')).join('');
const fpLabel = h => h ? hex(unb64(h).slice(0, 8)).toUpperCase().match(/.{4}/g).join(' ') : '—';
async function fpOf(fresh) {
  const parts = [];
  for (const f of CODE_FILES) {
    const r = await fetch(fresh ? `${f}?fresh=${Date.now()}` : f, { cache: 'no-store' });
    if (!r.ok) throw new Error('Réponse ' + r.status + ' pour ' + f);
    parts.push(await r.text());
  }
  return b64(await crypto.subtle.digest('SHA-256', enc.encode(parts.join('\u0000'))));
}
async function checkCode() {
  if (!window.isSecureContext) { code.err = 'Vérification indisponible hors https.'; return; }
  try { code.served = await fpOf(false); } catch (e) { code.err = e.message; return; }
  const saved = await store.get('code');
  if (code.status === 'sw') { code.approved = saved?.fp || null; code.at = saved?.at || null; paintCode(); return; }
  if (saved?.pending && saved.fp && saved.fp !== code.served) {
    code.approved = saved.fp; code.at = saved.at; code.status = 'changed';
  } else if (!saved || saved.pending) {
    await store.set('code', { fp: code.served, at: Date.now() });
    code.approved = code.served; code.at = Date.now(); code.status = 'ok';
  } else {
    code.approved = saved.fp; code.at = saved.at;
    code.status = saved.fp === code.served ? 'ok' : 'changed';
  }
  paintCode();
  if (code.status === 'ok') checkNetwork();
}
async function checkNetwork() {
  if (!window.isSecureContext) return false;
  if (navigator.onLine === false) { code.err = 'Pas de connexion réseau.'; return false; }
  try { code.net = await fpOf(true); code.err = null; code.checked = Date.now(); }
  catch (e) { code.err = e.message; return false; }
  if (code.net !== code.approved && code.status !== 'changed' && code.status !== 'sw') { code.status = 'update'; paintCode(); }
  return code.net !== code.approved;
}
function paintCode() {
  const el = $('#codebar'); if (!el) return;
  if (code.status === 'update') el.innerHTML = `<div class="codebar"><p>Une nouvelle version de l’app est disponible. Si tu n’en es pas à l’origine, ne l’installe pas.</p>
    <div class="row wrap"><button class="btn primary small" data-act="codeupdate">Installer la mise à jour</button><button class="btn small" data-act="codeinfo">Détails</button><button class="btn small" data-act="codelater">Plus tard</button></div></div>`;
  else if (code.status === 'sw') el.innerHTML = `<div class="codebar bad"><p><strong>Le programme de l’app vient d’être remplacé chez l’hébergeur, sans ta validation.</strong> Ne rouvre pas l’app et ne saisis pas ton mot de passe avant d’avoir vérifié l’historique de ton dépôt.</p>
    <div class="row"><button class="btn small" data-act="codeinfo">Que faire ?</button></div></div>`;
  else if (code.status === 'changed') el.innerHTML = `<div class="codebar bad"><p><strong>Le code de l’app a changé</strong> sans que tu l’aies approuvé. Ne saisis pas ton mot de passe avant d’avoir vérifié.</p>
    <div class="row"><button class="btn small" data-act="codeinfo">Que faire ?</button></div></div>`;
  else el.innerHTML = '';
}
async function applyCodeUpdate() {
  if (!confirm('Installer cette version du code ? À ne faire que si tu viens de mettre les fichiers à jour toi-même.\n\nTes données ne sont pas touchées.')) return;
  try {
    await store.set('code', { fp: code.net, at: Date.now(), pending: true });
    for (const r of await navigator.serviceWorker?.getRegistrations() || []) await r.unregister();
    for (const k of await caches.keys()) await caches.delete(k);
    location.replace(location.pathname + '?u=' + Date.now());
  } catch (e) { toast('Mise à jour impossible : ' + (e.message || 'réessaie avec du réseau')); }
}
function sheetCode() {
  if (code.status === 'sw') return openSheet(`<h2>Code remplacé</h2>
    <p>Le fichier qui installe l’app sur ton iPhone (sw.js) a changé chez l’hébergeur. Une version légitime de l’app ne le modifie jamais : si tu n’es pas à l’origine de ce changement, ton compte d’hébergement a probablement été compromis.</p>
    <p class="small">Depuis un ordinateur : consulte l’historique du dépôt, remets les fichiers d’origine, change le mot de passe du compte. Ensuite, sur l’iPhone, supprime l’app, efface les données du site dans Réglages › Safari, réinstalle-la et restaure ta dernière sauvegarde.</p>
    <button class="btn wide" data-act="close">Fermer</button>`);
  const changed = code.status === 'changed';
  openSheet(`<h2>${changed ? 'Code modifié' : 'Vérification du code'}</h2>
    <p class="small">L’empreinte est un condensé du code de l’app. Elle ne change que si le code change.</p>
    <p>Approuvée${code.at ? ' le ' + new Date(code.at).toLocaleDateString('fr-FR', { day: 'numeric', month: 'long', year: 'numeric' }) : ''}<br><span class="fp">${fpLabel(code.approved)}</span></p>
    <p>${changed ? 'Code actuellement servi' : 'Version en ligne'}<br><span class="fp">${fpLabel(changed ? code.served : code.net)}</span></p>
    <div class="btns">

function winBar(a, from, to, big) {

  const span = Math.max(1, to - from), p = y => clamp((y - from) / span * 100, 0, 100);
  const l = p(a.debut || a.fin - 3), r = 100 - p(a.fin + 1), now = p(thisYear() + (new Date().getMonth() / 12));

/* ---------- Emplacements ---------- */
const capacity = u => UNIT_TYPES[u.type]?.box ? (u.cap || 6) : (u.rows || 1) * (u.cols || 1);
function positions(u) {
  const out = [];
  if (UNIT_TYPES[u.type]?.box) for (let i = 0; i < capacity(u); i++) out.push([0, i]);
  else for (let r = 0; r < (u.rows || 1); r++) for (let c = 0; c < (u.cols || 1); c++) out.push([r, c]);
  return out;
}
function occupancy() {
  const m = new Map();
  for (const b of S.bottles) if (inCave(b) && b.unitId) m.set(`${b.unitId}:${b.r}:${b.c}`, b);
  return m;
}
const freeSlots = (u, occ = occupancy()) => positions(u).filter(([r, c]) => !occ.has(`${u.id}:${r}:${c}`));
function posLabel(b) {
  const u = b.unitId && unit(b.unitId);
  if (!u) return 'non placée';
  const t = UNIT_TYPES[u.type];
  if (t.box) return u.name || t.label;
  return `${u.name || t.label} · ${t.row1} ${b.r + 1}, place ${b.c + 1}`;
}
function locLabel(b, withSite = isMulti()) {
  if (b.state === 'primeur') return 'Primeur, pas encore livrée' + (b.delivery?.date ? ' (prévue ' + fmtDate(b.delivery.date) + ')' : '');
  const sp = space(b.spaceId);
  const parts = [];
  if (withSite && sp) parts.push(site(sp.siteId)?.name);
  if (sp) parts.push(sp.name);
  parts.push(posLabel(b));
  return parts.filter(Boolean).join(' › ');
}
// Espace conseillé pour un vin : prêt à boire → espace de consommation du site de consommation,
// sinon → espace de garde de meilleure qualité
function suggestSpace(w) {
  const st = status(w), ready = st === 'prio' || st === 'apogee' || w.kind === 'spirit';
  const sp = S.spaces.map(s => ({ s, site: site(s.siteId), q: spaceQuality(s) }));
  const score = o => {
    let n = o.q;
    if (ready) { if (o.s.use === 'conso') n += 10; if (o.site?.role === 'conso') n += 5; }
    else { if (o.s.use === 'garde') n += 10; if (o.site?.role === 'stock') n += 3; }
    if (o.s.siteId === S.settings.site) n += 1;
    return n;
  };
  return sp.sort((a, b) => score(b) - score(a))[0]?.s || S.spaces[0];
}
// Cases libres conseillées dans un espace : on remplit les meubles dans l'ordre, une caisse vide d'abord
// si l'on range au moins six bouteilles d'un même vin
function suggestSlots(spaceId, n, exclude = new Set()) {
  const occ = occupancy(), out = [];
  const units = spaceUnits(spaceId);
  const boxes = units.filter(u => UNIT_TYPES[u.type].box && freeSlots(u, occ).length === capacity(u) && capacity(u) <= n);
  const order = n >= 6 ? [...boxes, ...units.filter(u => !boxes.includes(u))] : [...units.filter(u => !UNIT_TYPES[u.type].box), ...units.filter(u => UNIT_TYPES[u.type].box)];
  for (const u of order) for (const [r, c] of freeSlots(u, occ)) {
    const k = `${u.id}:${r}:${c}`; if (exclude.has(k)) continue;
    if (out.length < n) out.push({ unitId: u.id, r, c });
  }
  return out;
}

/* ---------- Feuilles (modales) ----------
   Chaque feuille est une fonction qui renvoie son HTML : la pile permet de revenir à la feuille

let sheetStack = [];
function showSheet(fn, { replace = false, full = false } = {}) {
  if (replace) sheetStack.pop();
  sheetStack.push({ fn, full });
  paintSheet();
}
function paintSheet(keepScroll) {
  const top = sheetStack[sheetStack.length - 1];
  if (!top) { $('#layer').innerHTML = ''; return; }
  const old = $('.sheet'), y = keepScroll && old ? old.scrollTop : 0;
  const back = sheetStack.length > 1 ? `<button class="icon-btn" data-act="sheetback" aria-label="Retour">${ICON.back}</button>` : '';
  let html = top.fn();
  if (html == null) { sheetStack.pop(); return paintSheet(); }
  html = html.replace('<!--back-->', back);
  $('#layer').innerHTML = `<div class="backdrop" data-act="close"></div><div class="sheet${top.full ? ' full' : ''}" role="dialog" aria-modal="true"><div class="grab"></div>${html}</div>`;
  const sh = $('.sheet'); if (y) sh.scrollTop = y;
  paintPhotos(sh); afterSheet();
}
const refreshSheet = () => paintSheet(true);
function closeSheet() { sheetStack = []; $('#layer').innerHTML = ''; }

FORMS.unit = async (f, d) => {
  const id = f.dataset.id, t = UNIT_TYPES[d.type];
  const o = { type: d.type, name: d.name, spaceId: d.spaceId };
  if (t.box) Object.assign(o, { cap: int(d.cap) || 6, pile: d.pile, level: int(d.level), rows: 1, cols: int(d.cap) || 6 });
  else {
    const rows = int(d.rows), cols = int(d.cols);
    if (!rows || !cols || rows < 1 || cols < 1 || rows > 40 || cols > 40) return toast('Dimensions entre 1 et 40');
    Object.assign(o, { rows, cols });
  }
  if (id) {
    const u = unit(id);
    // Bouteilles hors des nouvelles dimensions, ou meuble déplacé : elles redeviennent non placées
    const oldType = u.type;
    Object.assign(u, o);
    const valid = new Set(positions(u).map(([r, c]) => `${r}:${c}`));
    let moved = 0;
    for (const b of S.bottles) if (b.unitId === id && inCave(b)) {
      if (oldType !== u.type || !valid.has(`${b.r}:${b.c}`)) { b.unitId = null; b.r = b.c = null; moved++; }
      b.spaceId = u.spaceId;

    await save(); closeSheet(); render(); toast(moved ? `Meuble modifié · ${plural(moved, 'bouteille non placée', 'bouteilles non placées')}` : 'Meuble modifié');

CHANGES.draftState = el => { $('#primeur-f').hidden = el.value !== 'primeur'; };
function readWineForm(d, w) {
  const sp = w.kind === 'spirit';
  const t = s => s || '';
  Object.assign(w, {
    domaine: t(d.domaine), cuvee: t(d.cuvee), region: t(d.region), pays: t(d.pays), format: d.format,
    millesime: int(d.millesime) || null, degre: num(d.degre), owner: t(d.owner) || null, short: t(d.short), abbr: t(d.abbr).toUpperCase(), notes: t(d.notes),
    achat: { prix: num(d.prix), date: d.adate || null, lieu: t(d.lieu) }, cadeau: d.offertPar ? { de: d.offertPar } : null,
  });
  if (sp) Object.assign(w, { cat: d.cat, age: int(d.age), bottled: int(d.bottled), fut: t(d.fut), bruteDeFut: !!d.bruteDeFut, singleCask: !!d.singleCask, independant: t(d.independant), numero: t(d.numero) });
  else {
    Object.assign(w, { couleur: d.couleur, appellation: t(d.appellation), cepages: t(d.cepages), bio: !!d.bio, nature: !!d.nature });
    const deb = int(d.adeb), pic = int(d.apic), fin = int(d.afin), a = w.apogee || {};
    if (fin && (fin !== a.fin || deb !== a.debut || pic !== a.pic)) w.apogee = { ...a, debut: deb, pic, fin, src: 'manuel', at: Date.now() };
    else if (!fin && a.src === 'manuel') w.apogee = null;

}
FORMS.wine = async (f, d) => {
  const dr = draft; if (!dr) return closeSheet();
  if (dr.edit) {
    const w = wine(dr.edit); readWineForm(d, w); w.updatedAt = Date.now();
    if (dr.photo) { await photoSave(w.id, dr.photo); w.photo = true; }
    await save(); draft = null; sheetBack(); render(); return toast('Fiche modifiée');
  }
  const w = { id: uid(), ...dr.w, createdAt: Date.now() };
  readWineForm(d, w);
  const qty = clamp(int(d.qty) || 1, 1, 500);
  const same = S.wines.find(x => x.kind === w.kind && norm(x.domaine) === norm(w.domaine) && norm(x.cuvee) === norm(w.cuvee) && norm(x.appellation) === norm(w.appellation) && (x.millesime || null) === w.millesime && (x.owner || null) === w.owner && x.format === w.format);
  let target = w;
  if (same && confirm(`« ${wineTitle(same)} » est déjà dans ta cave. Ajouter ces ${qty} bouteille(s) à cette fiche ?`)) target = same;
  else S.wines.push(w);
  if (dr.photo) { await photoSave(target.id, dr.photo); target.photo = true; }
  const ids = createBottles(target, qty, d.state === 'primeur' ? { state: 'primeur', delivery: { date: d.delivery || null, spaceId: d.spaceId } } : { spaceId: d.spaceId });
  await save(); draft = null;

};
function createBottles(w, n, { state = 'cave', spaceId = null, delivery = null } = {}) {
  const ids = [];
  for (let i = 0; i < n; i++) {
    const b = { id: uid(), wineId: w.id, state, spaceId: state === 'cave' ? spaceId : null, unitId: null, r: null, c: null, addedAt: today(), delivery };
    S.bottles.push(b); ids.push(b.id); logMove(b, state === 'primeur' ? 'primeur' : 'in', { to: locOf(b) });
  }
  return ids;
}
function afterAdd(w, ids, primeur) {
  const autoAI = w.kind === 'vin' && !w.apogee?.fin && aiReady() && S.settings.ai.auto;
  if (autoAI) estimateApogee(w.id, { quiet: true });
  if (primeur) { closeSheet(); render(); return toast(`${plural(ids.length, 'bouteille ajoutée', 'bouteilles ajoutées')} en primeur`); }
  // Une place a été touchée sur le plan : la première bouteille y va directement
  const b0 = byId(S.bottles, ids[0]);
  if (addTarget && b0) {
    const u = unit(addTarget.unitId), occ = occupancy();
    if (u && !occ.has(`${u.id}:${addTarget.r}:${addTarget.c}`)) { Object.assign(b0, { spaceId: u.spaceId, unitId: u.id, r: addTarget.r, c: addTarget.c }); }
  }
  addTarget = null;
  const rest = ids.filter(id => !byId(S.bottles, id).unitId);
  const spId = byId(S.bottles, ids[0]).spaceId;
  save();
  if (rest.length && spaceUnits(spId).length) {
    closeSheet();
    startPlace(w.id, rest, spId, true);
  } else { closeSheet(); render(); toast(`${plural(ids.length, 'bouteille ajoutée', 'bouteilles ajoutées')}${autoAI ? ' · estimation de l’apogée en cours' : ''}`); }
}

/* ---------- Rangement ---------- */
function startPlace(wineId, ids, spaceId, fresh) {
  draft = { place: { wineId, ids, spaceId: spaceId || suggestSpace(wine(wineId)).id, sel: [], fresh } };
  draft.place.sel = suggestFor(draft.place);
  showSheet(placeSheet, { full: true });
}
const suggestFor = p => suggestSlots(p.spaceId, p.ids.length, new Set()).filter(s => !occupancyExcept(new Set(p.ids)).has(`${s.unitId}:${s.r}:${s.c}`));
function placeSheet() {
  const p = draft?.place; if (!p) return null;
  const w = wine(p.wineId), occ = occupancyExcept(new Set(p.ids)), sp = space(p.spaceId);
  const ctx = { occ, m: null, urg: false, pick: p };
  const units = spaceUnits(sp.id), grid = units.filter(u => !UNIT_TYPES[u.type].box), boxes = units.filter(u => UNIT_TYPES[u.type].box);
  return `${head(`Ranger ${p.ids.length > 1 ? p.ids.length + ' bouteilles' : 'la bouteille'}`)}
    <p class="small" style="margin-top:-6px"><span class="dot" style="background:${wineColor(w)}"></span> ${esc(wineTitle(w))}</p>
    <div class="chips">${S.spaces.map(s => `<button class="chip${s.id === p.spaceId ? ' on' : ''}" data-act="placeSpace" data-id="${s.id}">${esc(isMulti() ? site(s.siteId)?.name + ' › ' : '')}${esc(s.name)}</button>`).join('')}</div>
    <p class="small"><b style="color:var(--ink)">${p.sel.length} / ${p.ids.length}</b> place${p.ids.length > 1 ? 's' : ''} choisie${p.sel.length > 1 ? 's' : ''}. Touche les cases libres pour choisir.</p>
    ${!units.length ? `<div class="card small">Aucun meuble dans cet espace : les bouteilles y seront rangées sans emplacement précis.</div>` : ''}
    ${grid.map(u => `<div class="card">${unitHead(u, ctx)}${renderGrid(u, ctx)}</div>`).join('')}
    ${boxes.length ? `<div class="card"><div class="ct">Caisses et cartons</div>${renderBoxes(boxes, ctx)}</div>` : ''}
    <div class="btns" style="margin-top:14px;position:sticky;bottom:0;background:var(--bg);padding:8px 0">
      <div class="btns2"><button class="btn" data-act="placeSuggest">Suggérer</button><button class="btn" data-act="placeClear">Effacer</button></div>
      <button class="btn primary wide" data-act="placeOk">${p.sel.length ? 'Valider le rangement' : 'Laisser sans emplacement'}</button>
    </div>`;
}
function placeToggle(unitId, r, c) {
  const p = draft.place, i = p.sel.findIndex(s => s.unitId === unitId && s.r === r && s.c === c);
  if (i >= 0) p.sel.splice(i, 1);
  else { if (p.sel.length >= p.ids.length) p.sel.shift(); p.sel.push({ unitId, r, c }); }
  refreshSheet();
}
Object.assign(ACT, {
  add: t => { addTarget = t.dataset?.u ? { unitId: t.dataset.u, r: +t.dataset.r, c: +t.dataset.c } : null; if (addTarget) closeSheet(); showSheet(addSheet); },
  newWine: t => { newDraft(t.dataset.kind); showSheet(wineFormSheet, { full: true }); },
  rebuyList: () => showSheet(() => `${head('Racheter un vin')}<div class="list">${[...S.wines].filter(kindOn).sort((a, b) => wineName(a).localeCompare(wineName(b), 'fr')).map(w => `<button class="li" data-act="rebuy" data-id="${w.id}"><span class="dot" style="background:${wineColor(w)}"></span><div class="it"><b class="ell">${esc(wineTitle(w))}</b><small class="ell">${esc(wineSub(w))} · ${wineBottles(w.id).length} en cave</small></div></button>`).join('')}</div>`),
  rebuy: t => showSheet(() => addBottlesSheet(t.dataset.id)),
  placeSpace: t => { draft.place.spaceId = t.dataset.id; draft.place.sel = suggestFor(draft.place); refreshSheet(); },
  pickSlot: t => placeToggle(t.dataset.u, +t.dataset.r, +t.dataset.c),
  pickBox: t => {
    const p = draft.place, u = unit(t.dataset.u), occ = occupancyExcept(new Set(p.ids));
    const mine = p.sel.filter(s => s.unitId === u.id), free = freeSlots(u, occ).filter(([r, c]) => !mine.some(s => s.c === c));
    if (!free.length || p.sel.length >= p.ids.length) { p.sel = p.sel.filter(s => s.unitId !== u.id); return refreshSheet(); }
    const room = p.ids.length - p.sel.length;
    for (const [r, c] of free.slice(0, room)) p.sel.push({ unitId: u.id, r, c });
    refreshSheet();
  },
  placeSuggest: () => { draft.place.sel = suggestFor(draft.place); refreshSheet(); },
  placeClear: () => { draft.place.sel = []; refreshSheet(); },
  placeOk: async () => {
    const p = draft.place;
    p.ids.forEach((id, i) => {
      const b = byId(S.bottles, id), s = p.sel[i], from = locOf(b);
      Object.assign(b, { spaceId: p.spaceId, unitId: s?.unitId || null, r: s?.r ?? null, c: s?.c ?? null });
      if (!p.fresh && (from.spaceId !== b.spaceId || from.unitId !== b.unitId || from.r !== b.r || from.c !== b.c)) logMove(b, from.siteId !== siteOfBottle(b) ? 'transfert' : 'move', { from, to: locOf(b) });
    });
    S.transfer.ids = S.transfer.ids.filter(id => !p.ids.includes(id) || !p.sel.length);

    view = 'cave'; render(); toast(p.sel.length ? (p.fresh ? 'Bouteilles rangées' : 'Bouteille déplacée') : 'Enregistré, sans emplacement');
  },
  placeUnplaced: t => {
    const ids = S.bottles.filter(b => b.wineId === t.dataset.w && inCave(b) && !b.unitId && b.spaceId === t.dataset.space).map(b => b.id);
    startPlace(t.dataset.w, ids, t.dataset.space, false);
  },
  putHere: async t => {

    const b = cand.find(x => x.spaceId === u.spaceId) || cand[0]; if (!b) return;

    await save(); closeSheet(); render(); toast('Bouteille rangée');
  },
  moveBottle: t => { const b = byId(S.bottles, t.dataset.b); startPlace(b.wineId, [b.id], b.spaceId || suggestSpace(wine(b.wineId)).id, false); },

INPUTS.level = el => { const o = $('#lvl-out'); if (o) o.textContent = el.value + ' %'; const i = el.closest('.level').querySelector('i'); if (i) i.style.height = el.value + '%'; };

/* ---------- Sortie ---------- */

FORMS.out = async (f, d) => {

  S.transfer.ids = S.transfer.ids.filter(id => id !== b.id);

/* ---------- Transfert entre sites ---------- */
function transferSheet() {
  const ids = S.transfer.ids.filter(id => byId(S.bottles, id) && inCave(byId(S.bottles, id)));
  const bs = ids.map(id => byId(S.bottles, id));
  const to = S.transfer.to && site(S.transfer.to) ? S.transfer.to : S.sites.find(s => s.role === 'conso')?.id || S.sites[0].id;
  const sugg = transferSuggestions(to);
  return `${head('Transfert entre sites')}
    <label>Destination<select data-ch="transferTo">${S.sites.map(s => `<option value="${s.id}" ${s.id === to ? 'selected' : ''}>${esc(s.name)}</option>`).join('')}</select></label>
    ${bs.length ? `<div class="list">${bs.map(b => { const w = wine(b.wineId); return `<div class="li"><span class="dot" style="background:${wineColor(w)}"></span><div class="it"><b class="ell">${esc(wineTitle(w))}</b><small class="ell">${esc(locLabel(b))}</small></div><button class="icon-btn" data-act="toTransfer" data-b="${b.id}" aria-label="Retirer">${ICON.close}</button></div>`; }).join('')}</div>` : '<p class="muted small">Aucune bouteille pour l’instant. Ouvre une bouteille et touche « Ajouter au prochain transfert ».</p>'}
    ${sugg.length ? `<h3>Suggestions</h3><p class="small" style="margin-top:-4px">Vins prêts à boire stockés ailleurs qu’à destination.</p><div class="list">${sugg.slice(0, 8).map(b => { const w = wine(b.wineId); return `<div class="li"><span class="dot" style="background:${wineColor(w)}"></span><div class="it"><b class="ell">${esc(wineTitle(w))}</b><small class="ell">${STATUS[status(w)].short} · ${esc(locLabel(b))}</small></div><button class="btn small" data-act="toTransfer" data-b="${b.id}">Ajouter</button></div>`; }).join('')}</div>` : ''}
    ${bs.length ? `<button class="btn primary wide" style="margin-top:14px" data-act="transferDone" data-to="${to}">${ICON.check} Arrivées à ${esc(site(to)?.name)}</button><p class="tiny">Les bouteilles passent dans l’espace de consommation de ce site, sans emplacement : tu pourras les ranger ensuite.</p>` : ''}`;
}
function transferSuggestions(to) {
  const seen = new Set();
  return S.bottles.filter(b => {
    if (b.state !== 'cave' || S.transfer.ids.includes(b.id) || siteOfBottle(b) === to) return false;
    const w = wine(b.wineId); if (!w || isFriend(w) || !['prio', 'apogee'].includes(status(w))) return false;
    if (seen.has(w.id)) return false; seen.add(w.id); return true;
  }).sort((a, b) => (status(wine(a.wineId)) === 'prio' ? 0 : 1) - (status(wine(b.wineId)) === 'prio' ? 0 : 1));
}
CHANGES.transferTo = async el => { S.transfer.to = el.value; await save(); refreshSheet(); };
Object.assign(ACT, {
  transferSheet: () => showSheet(transferSheet),
  toTransfer: async t => {
    const id = t.dataset.b, i = S.transfer.ids.indexOf(id);
    if (i >= 0) S.transfer.ids.splice(i, 1); else S.transfer.ids.push(id);
    await save(); refreshSheet(); render(); toast(i >= 0 ? 'Retirée du transfert' : 'Ajoutée au transfert');
  },
  transferDone: async t => {
    const to = t.dataset.to, sps = siteSpaces(to), dest = sps.find(s => s.use === 'conso') || sps[0];
    if (!dest) return toast('Ce site n’a pas encore d’espace');
    let n = 0;
    for (const id of S.transfer.ids) {
      const b = byId(S.bottles, id); if (!b || !inCave(b) || siteOfBottle(b) === to) continue;
      const from = locOf(b); Object.assign(b, { spaceId: dest.id, unitId: null, r: null, c: null });
      logMove(b, 'transfert', { from, to: locOf(b) }); n++;
    }
    S.transfer.ids = []; S.settings.site = to; caveSpace = dest.id;
    await save(); closeSheet(); view = 'cave'; caveMode = 'plan'; render(); toast(`${plural(n, 'bouteille arrivée', 'bouteilles arrivées')} · à ranger dans « ${dest.name} »`);
  },
  receive: async t => {
    const b = byId(S.bottles, t.dataset.b), w = wine(b.wineId);
    const ids = S.bottles.filter(x => x.wineId === w.id && x.state === 'primeur').map(x => x.id);
    const n = ids.length > 1 && confirm(`Réceptionner les ${ids.length} bouteilles en primeur de ce vin ?`) ? ids : [b.id];
    const dest = space(b.delivery?.spaceId) || suggestSpace(w);
    for (const id of n) { const x = byId(S.bottles, id); Object.assign(x, { state: 'cave', spaceId: dest.id, unitId: null, r: null, c: null, addedAt: today() }); logMove(x, 'in', { to: locOf(x), primeur: true }); }
    await save(); closeSheet();
    if (spaceUnits(dest.id).length) startPlace(w.id, n, dest.id, true); else { render(); toast('Primeur réceptionné'); }
  },
  openBottle: async t => { const b = byId(S.bottles, t.dataset.b); b.state = 'open'; b.openedAt = today(); b.level = 100; logMove(b, 'open'); await save(); refreshSheet(); render(); },
  outBottle: t => showSheet(() => outSheet(t.dataset.b)),
  bottle: t => showSheet(() => bottleSheet(t.dataset.b)),
  wine: t => showSheet(() => wineSheet(t.dataset.id)),
  editWine: t => { const w = wine(t.dataset.id); draft = { w: structuredClone(w), edit: w.id }; showSheet(wineFormSheet, { full: true }); },
  delWine: async t => {
    const w = wine(t.dataset.id), n = wineBottles(w.id).length + S.bottles.filter(b => b.wineId === w.id && b.state === 'primeur').length;
    if (!confirm(n ? `Supprimer « ${wineTitle(w)} » et ses ${n} bouteilles encore en cave ? Pour une bouteille bue, utilise plutôt « Sortir ».` : `Supprimer « ${wineTitle(w)} » et son historique ?`)) return;
    const ids = new Set(S.bottles.filter(b => b.wineId === w.id).map(b => b.id));
    S.wines = S.wines.filter(x => x.id !== w.id); S.bottles = S.bottles.filter(b => b.wineId !== w.id);
    S.moves = S.moves.filter(m => m.wineId !== w.id); S.tastings = S.tastings.filter(x => x.wineId !== w.id);
    S.transfer.ids = S.transfer.ids.filter(id => !ids.has(id));
    if (w.photo) await photoDel(w.id);
    await save(); closeSheet(); render(); toast('Référence supprimée');
  },
});

/* ---------- Dégustation ---------- */
const T_CHIPS = {
  limpidite: ['Limpide', 'Brillant', 'Voilé', 'Trouble'],
  bulles: ['Fines', 'Moyennes', 'Grossières'],
  ouverture: ['Fermé', 'Discret', 'Ouvert', 'Expressif'],
  attaque: ['Souple', 'Franche', 'Vive'],
  texture: ['Soyeux', 'Fondus', 'Serrés', 'Astringents'],
  equilibre: ['Déséquilibré', 'Équilibré', 'Harmonieux'],
  evolution: [['jeune', 'Jeune'], ['apoint', 'À point'], ['declin', 'Sur le déclin']],
  potentiel: ['À boire', '1–2 ans', '3–5 ans', '5–10 ans', '10 ans et plus'],
  eau: ['Pur', 'Quelques gouttes d’eau', 'Sur glace'],
};
const SLIDERS_VIN = [['sucre', 'Sucre', 1, 5], ['acidite', 'Acidité', 1, 5], ['tanins', 'Tanins', 1, 5], ['alcool', 'Alcool', 1, 5], ['corps', 'Corps', 1, 5], ['longueur', 'Longueur', 0, 15]];
const SLIDERS_SPIRIT = [['douceur', 'Douceur', 1, 5], ['puissance', 'Puissance', 1, 5], ['corps', 'Corps', 1, 5], ['longueur', 'Finale', 1, 5]];
const sliderOut = (k, v, kind = draft?.taste?.kind) => k === 'longueur' && kind !== 'spirit' ? `${v} s` : `${v}/5`;

function startTaste(wineId, bottleId, m) {
  const w = wine(wineId);
  const prev = S.dismissed.rate?.bottleId === bottleId ? S.dismissed.rate : null;
  draft = { taste: { wineId, bottleId: bottleId || null, kind: w.kind, mode: m === 'full' ? 'full' : 'quick', note: 14, comment: '', at: today(), plat: prev?.plat || '', full: { aromes: [] } } };
  wheelState = { active: null };
  showSheet(tasteSheet, { full: true });
}
function tasteSheet() {
  const t = draft?.taste; if (!t) return null;
  const w = wine(t.wineId), F = t.full, sp = w.kind === 'spirit';
  const chips = (k, list) => `<div class="chips wrap" style="margin-top:0">${list.map(x => { const [v, l] = Array.isArray(x) ? x : [x, x]; return `<button type="button" class="chip soft${F[k] === v ? ' on' : ''}" data-act="tchip" data-k="${k}" data-v="${esc(v)}">${esc(l)}</button>`; }).join('')}</div>`;
  const slider = ([k, l, min, max]) => `<div class="sl"><span>${l}</span><input type="range" min="${min}" max="${max}" step="1" value="${F[k] ?? Math.round((min + max) / 2)}" data-in="tv" data-k="${k}"><output id="o-${k}">${F[k] != null ? sliderOut(k, F[k]) : '–'}</output></div>`;
  const teintes = TEINTES[sp ? 'spirit' : w.couleur] || TEINTES.rouge;
  const full = t.mode === 'full' ? `
    <div class="card">
      <div class="lbl" style="margin-top:0">Œil</div>
      <div class="teintes">${teintes.map(([l, c]) => `<button type="button" class="teinte${F.teinte === l ? ' on' : ''}" style="background:${c}" data-act="tchip" data-k="teinte" data-v="${esc(l)}" aria-label="${esc(l)}" title="${esc(l)}"></button>`).join('')}</div>
      <p class="tiny" style="margin:4px 0 8px">${F.teinte ? esc(F.teinte) : 'Choisis la teinte'}</p>
      ${slider(['oeil', 'Intensité', 1, 5])}
      ${sp ? '' : chips('limpidite', T_CHIPS.limpidite)}
      ${w.couleur === 'effervescent' ? `<div class="lbl">Bulles</div>${chips('bulles', T_CHIPS.bulles)}` : ''}
      <div class="lbl">Nez</div>
      ${slider(['nez', 'Intensité', 1, 5])}
      ${sp ? chips('eau', T_CHIPS.eau) : chips('ouverture', T_CHIPS.ouverture)}
      <div class="lbl">Roue des arômes</div>
      <div class="wheel" id="wheel"></div>
      <div id="aro-sel"></div>
      <div class="lbl">Bouche</div>
      ${sp ? '' : chips('attaque', T_CHIPS.attaque)}
      <div style="margin-top:6px">${(sp ? SLIDERS_SPIRIT : SLIDERS_VIN).filter(([k]) => k !== 'tanins' || ['rouge', 'orange', 'rose'].includes(w.couleur)).map(slider).join('')}</div>
      ${!sp && w.couleur === 'rouge' ? `<div class="lbl">Tanins</div>${chips('texture', T_CHIPS.texture)}` : ''}
      ${chips('equilibre', T_CHIPS.equilibre)}
      ${sp ? '' : `<div class="lbl">Évolution</div>${chips('evolution', T_CHIPS.evolution)}<div class="lbl">Potentiel restant</div>${chips('potentiel', T_CHIPS.potentiel)}`}
    </div>` : '';
  return `${head('Dégustation', `<button class="link" data-act="tasteSave">OK</button>`)}
    <div class="card" style="margin-top:0"><div class="rn">${esc(wineTitle(w))}</div><div class="rs">${esc(wineSub(w))}</div>
      <div class="seg"><button class="${t.mode === 'quick' ? 'on' : ''}" data-act="tmode" data-m="quick">Rapide</button><button class="${t.mode === 'full' ? 'on' : ''}" data-act="tmode" data-m="full">Complète</button></div></div>
    <div class="card"><div class="score" id="t-score">${numFr(t.note)}<small> / 20</small></div>
      <input type="range" min="0" max="20" step="0.5" value="${t.note}" data-in="tnote" aria-label="Note sur 20"></div>
    ${full}
    <div class="card form">
      <label>Commentaire<textarea data-in="tf" data-k="comment" placeholder="Tes impressions…">${esc(t.comment)}</textarea></label>
      <div class="grid2"><label>Date<input type="date" value="${esc(t.at)}" data-in="tf" data-k="at"></label><label>Plat<input value="${esc(t.plat)}" data-in="tf" data-k="plat" autocomplete="off"></label></div>
    </div>
    <button class="btn primary wide" style="margin-top:12px" data-act="tasteSave">Enregistrer la dégustation</button>`;
}
INPUTS.tnote = el => { draft.taste.note = +el.value; $('#t-score').innerHTML = `${numFr(+el.value)}<small> / 20</small>`; setRangeFill(el); };
INPUTS.tv = el => { draft.taste.full[el.dataset.k] = +el.value; const o = $('#o-' + el.dataset.k); if (o) o.textContent = sliderOut(el.dataset.k, +el.value); setRangeFill(el); };
INPUTS.tf = el => { draft.taste[el.dataset.k] = el.value; };

/* Roue des arômes : l'anneau intérieur porte les familles, l'anneau extérieur les arômes.
   Toucher une famille l'agrandit (140°) ; les autres restent visibles en réduit. */
function paintWheel() {
  const t = draft?.taste, el = $('#wheel'); if (!t || !el) return;
  const fams = aromaFamilies(t.kind), sel = new Set(t.full.aromes);
  const active = wheelState?.active ?? null;
  const S_ = 340, C = S_ / 2, R0 = 42, R1 = 112, R2 = 168, ACT_SPAN = active != null ? 140 : 0;
  const rad = d => (d - 90) * Math.PI / 180, pt = (r, d) => [C + r * Math.cos(rad(d)), C + r * Math.sin(rad(d))];
  const arc = (r1, r2, a1, a2) => { const [x1, y1] = pt(r2, a1), [x2, y2] = pt(r2, a2), [x3, y3] = pt(r1, a2), [x4, y4] = pt(r1, a1), l = a2 - a1 > 180 ? 1 : 0; return `M${x1.toFixed(1)},${y1.toFixed(1)}A${r2},${r2} 0 ${l} 1 ${x2.toFixed(1)},${y2.toFixed(1)}L${x3.toFixed(1)},${y3.toFixed(1)}A${r1},${r1} 0 ${l} 0 ${x4.toFixed(1)},${y4.toFixed(1)}Z`; };
  const label = (txt, r, a, size, col, wgt) => { let rot = a - 90; if (a > 180) rot += 180; const [x, y] = pt(r, a); return `<text x="${x.toFixed(1)}" y="${y.toFixed(1)}" transform="rotate(${rot.toFixed(1)} ${x.toFixed(1)} ${y.toFixed(1)})" text-anchor="middle" dominant-baseline="central" font-size="${size}" font-weight="${wgt}" fill="${col}">${esc(txt)}</text>`; };
  const others = fams.reduce((n, f, i) => i === active ? n : n + f[3].length, 0);
  let g = '', a = active != null ? -ACT_SPAN / 2 - fams.slice(0, active).reduce((n, f) => n + (360 - ACT_SPAN) * f[3].length / others, 0) : 0;
  fams.forEach(([id, name, color, list], i) => {
    const isAct = i === active, span = active == null ? 360 * list.length / fams.reduce((n, f) => n + f[3].length, 0) : isAct ? ACT_SPAN : (360 - ACT_SPAN) * list.length / others;
    const a1 = a, a2 = a + span; a = a2;
    const nSel = list.filter(x => sel.has(x)).length;
    g += `<path d="${arc(R0, R1, a1, a2)}" fill="${color}" opacity="${isAct || active == null ? 1 : .8}" stroke="#fff" stroke-width="${isAct ? 2.5 : 1.2}" data-act="wfam" data-i="${i}"/>`;
    const short = name.replace('Fruits ', 'F. ');
    const fs = isAct ? 12 : span < 16 ? 7.5 : 9;
    g += label(isAct ? name : short, (R0 + R1) / 2, (a1 + a2) / 2, fs, '#fff', isAct ? 700 : 600);
    if (nSel && !isAct) { const [x, y] = pt(R1 - 8, (a1 + a2) / 2); g += `<circle cx="${x.toFixed(1)}" cy="${y.toFixed(1)}" r="5" fill="#fff"/><text x="${x.toFixed(1)}" y="${y.toFixed(1)}" text-anchor="middle" dominant-baseline="central" font-size="7.5" font-weight="700" fill="${color}">${nSel}</text>`; }
    const st = span / list.length;
    list.forEach((ar, k) => {
      const b1 = a1 + k * st, b2 = b1 + st, on = sel.has(ar);
      if (isAct) {
        g += `<path d="${arc(R1 + 2, R2, b1, b2)}" fill="${on ? '#6E1E2F' : '#F6EEE8'}" stroke="#fff" stroke-width="1.5" data-act="waro" data-a="${esc(ar)}"/>`;
        g += label(ar, (R1 + R2) / 2 + 1, (b1 + b2) / 2, ar.length > 12 ? 8 : ar.length > 8 ? 9 : 10.5, on ? '#fff' : '#2A1F1D', on ? 700 : 500);
      } else {
        g += `<path d="${arc(R1 + 2, R1 + (active == null ? 16 : 13), b1, b2)}" fill="${on ? '#6E1E2F' : color}" opacity="${on ? 1 : .35}" stroke="#fff" stroke-width=".8" data-act="wfam" data-i="${i}"/>`;
      }
    });
  });
  g += `<circle cx="${C}" cy="${C}" r="${R0 - 2}" fill="#fff" stroke="#E7DFD4"/>`;
  g += `<text x="${C}" y="${C - 6}" text-anchor="middle" font-size="22" font-weight="700" fill="#6E1E2F">${sel.size}</text><text x="${C}" y="${C + 13}" text-anchor="middle" font-size="10" fill="#7D716B">arôme${sel.size > 1 ? 's' : ''}</text>`;
  el.innerHTML = `<svg width="${S_}" height="${S_}" viewBox="0 0 ${S_} ${S_}" font-family="-apple-system,BlinkMacSystemFont,system-ui,sans-serif" role="img" aria-label="Roue des arômes">${g}</svg>`;
  $('#aro-sel').innerHTML = `<p class="tiny" style="text-align:center;margin:0 0 6px">${active == null ? 'Touche une famille pour afficher ses arômes.' : 'Touche un arôme pour le choisir · ' + esc(fams[active][1])}</p>
    <div class="chips wrap" style="justify-content:center">${[...sel].map(x => `<button type="button" class="chip soft on" data-act="waro" data-a="${esc(x)}">${esc(x)} ×</button>`).join('')}
    ${active != null ? `<button type="button" class="chip dash" data-act="aroAdd">+ Arôme perso</button>` : ''}</div>`;
}
Object.assign(ACT, {
  taste: t => { if (sheetStack.length && t.dataset.m) sheetStack.pop(); startTaste(t.dataset.w, t.dataset.b, t.dataset.m); },
  tmode: t => { draft.taste.mode = t.dataset.m; refreshSheet(); },
  tchip: t => { const F = draft.taste.full, k = t.dataset.k; F[k] = F[k] === t.dataset.v ? null : t.dataset.v; refreshSheet(); },
  wfam: t => { const i = +t.dataset.i; wheelState.active = wheelState.active === i ? null : i; paintWheel(); },
  waro: t => { const A = draft.taste.full.aromes, a = t.dataset.a, i = A.indexOf(a); if (i >= 0) A.splice(i, 1); else A.push(a); paintWheel(); },
  aroAdd: async () => {
    const t = draft.taste, fam = aromaFamilies(t.kind)[wheelState.active]; if (!fam) return;
    const name = (prompt(`Nouvel arôme dans « ${fam[1]} »`) || '').trim(); if (!name) return;
    const store_ = S.settings.aromas[t.kind] ||= {}; (store_[fam[0]] ||= []);
    if (!fam[3].includes(name)) store_[fam[0]].push(name);
    if (!t.full.aromes.includes(name)) t.full.aromes.push(name);
    await save(); paintWheel();
  },
  tasteSave: async () => {
    const t = draft.taste, w = wine(t.wineId);
