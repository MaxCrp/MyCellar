/* ---------- Synthèse ---------- */
const U_DONE = new Set(['tasteSave', 'placeOk', 'putHere', 'receive', 'transferDone', 'chatAsk', 'export', 'applyReeval', 'applyAdvice', 'adviceGo', 'wishToggle',
  'revealWine', 'openBottle', 'delWine', 'delUnit', 'estimate', 'estimateMissing', 'plocGo', 'toTransfer', 'awayTransfer', 'takeIt', 'blindAI', 'usageExport', 'problemSend']);
const uMed = a => { if (!a.length) return 0; const b = a.slice().sort((x, y) => x - y), m = b.length >> 1; return b.length % 2 ? b[m] : (b[m - 1] + b[m]) / 2; };
const uTop = (o, n) => Object.entries(o).sort((a, b) => b[1] - a[1]).slice(0, n);
function uSummary() {
  const ev = U?.ev || [], bySess = new Map();
  for (const e of ev) { if (!bySess.has(e[1])) bySess.set(e[1], []); bySess.get(e[1]).push(e); }
  const acts = {}, screens = {}, tasks = {}, grams = {}, ai = {}, errors = {}, hours = Array(24).fill(0), days = Array(7).fill(0), sess = [];
  for (const list of bySess.values()) {
    let cur = null, since = null, dur = 0, gestures = 0, path = [], t0 = list[0][0], seq = [];
    const close = t => { if (cur && since != null) { const d = t - since; dur += d; const o = screens[cur]; o.ms += d; o.d.push(d); } since = null; };
    for (const [t, , k, a, , x] of list) {
      if (k === 'screen') {
        if (cur?.includes(' > ') && !a.includes(' > ')) { path = []; t0 = t; }   // feuille refermée sans rien valider
        close(t); cur = a; since = t;
        const o = screens[a] ||= { n: 0, ms: 0, d: [], taps: [], via: {} };
        o.n++; o.taps.push(path.length);
        if (path.length) { const p = path.slice(-6).join(' › '); o.via[p] = (o.via[p] || 0) + 1; }
      } else if (k === 'pause' || k === 'end') close(t);
      else if (k === 'resume') since = t;
      else if (k === 'start') { t0 = t; path = []; }
      else if (k === 'ai') { const o = ai[a] ||= { n: 0, err: 0, ms: [], usd: 0 }; const [st, ms, usd] = String(x || '').split(','); o.n++; if (st !== 'ok') o.err++; o.ms.push(+ms || 0); o.usd += +usd || 0; }
      else if (k === 'error') errors[a] = (errors[a] || 0) + 1;
      else if (k === 'tap' || k === 'submit' || k === 'change') {
        const name = k === 'submit' ? 'valide:' + a : k === 'change' ? 'champ:' + a : a + (x ? ':' + x : '');
        acts[name] = (acts[name] || 0) + 1;
        const d = new Date(t); hours[d.getHours()]++; days[(d.getDay() + 6) % 7]++;
        if (k !== 'submit') gestures++;
        if (k === 'tap' && a === 'go') { path = []; t0 = t; }   // un onglet touché démarre un nouveau chemin
        path.push(name); seq.push(name);
        if (seq.length >= 3) { const g = seq.slice(-3).join(' › '); grams[g] = (grams[g] || 0) + 1; }
        if ((k === 'submit' && !['unlock', 'setup'].includes(a)) || (k === 'tap' && U_DONE.has(a))) {
          const o = tasks[name] ||= { n: 0, taps: [], secs: [], paths: {} };
          o.n++; o.taps.push(path.filter(p => !p.startsWith('valide:')).length); o.secs.push((t - t0) / 1000);
          const p = path.slice(-8).join(' › '); o.paths[p] = (o.paths[p] || 0) + 1;
          path = []; t0 = t;
        }
      }
    }
    close(list[list.length - 1][0]);
    sess.push({ dur, gestures });
  }
  const r1 = x => Math.round(x * 10) / 10;
  return {
    period: ev.length ? { from: new Date(ev[0][0]).toISOString(), to: new Date(ev[ev.length - 1][0]).toISOString() } : null,
    sessions: { n: sess.length, medianSeconds: r1(uMed(sess.map(s => s.dur / 1000))), medianGestures: uMed(sess.map(s => s.gestures)), totalGestures: sess.reduce((t, s) => t + s.gestures, 0) },
    actions: uTop(acts, 60).map(([action, n]) => ({ action, n })),
    screens: Object.entries(screens).sort((a, b) => b[1].n - a[1].n).map(([screen, o]) => ({ screen, visits: o.n, totalSeconds: Math.round(o.ms / 1000),
      medianSeconds: r1(uMed(o.d) / 1000), medianTapsToReach: uMed(o.taps), topPaths: uTop(o.via, 3).map(([path, n]) => ({ path, n })) })),
    tasks: Object.entries(tasks).sort((a, b) => b[1].n - a[1].n).map(([task, o]) => ({ task, n: o.n, medianTaps: uMed(o.taps), medianSeconds: r1(uMed(o.secs)),
      topPaths: uTop(o.paths, 3).map(([path, n]) => ({ path, n })) })),
    sequences: uTop(grams, 25).map(([seq, n]) => ({ seq, n })),
    ai: Object.entries(ai).map(([kind, o]) => ({ kind, n: o.n, errors: o.err, medianMs: uMed(o.ms), usd: Math.round(o.usd * 1e4) / 1e4 })),
    errors: Object.entries(errors).map(([where, n]) => ({ where, n })),

}

/* ===== 88-versions.js ===== */
/* ---------- Suivi des mises à jour (v1.6) ----------
   CHANGELOG et APP_VERSION sont injectés par build.mjs depuis src/changelog.json.
   Le même journal est publié à part (changelog.json) : la version installée le lit en ligne
   pour montrer le contenu d'une mise à jour avant de l'installer. C'est du texte affiché, jamais du code. */
function cmpVer(a, b) {
  const x = String(a).split('.').map(Number), y = String(b).split('.').map(Number);
  for (let i = 0; i < Math.max(x.length, y.length); i++) { const d = (x[i] || 0) - (y[i] || 0); if (d) return d; }
  return 0;
}
// Versions plus récentes que « v » (toutes si v est vide), de la plus récente à la plus ancienne
const newerThan = (list, v) => list.filter(e => !v || cmpVer(e.version, v) > 0).sort((a, b) => cmpVer(b.version, a.version));
function versionsHtml(list) {
  return list.map(e => `<div class="card"><div class="ct"><span>Version ${esc(e.version)}${e.titre ? ' · ' + esc(e.titre) : ''}</span><span class="small">${esc(fmtDate(e.date))}</span></div>
    <ul class="notes">${(e.items || []).map(i => `<li>${esc(i)}</li>`).join('')}</ul></div>`).join('');
}
// Au déverrouillage : la fenêtre « Nouveautés » s'affiche une fois après une mise à jour
async function afterEnter(via) {
  let last = null; try { last = await store.get('lastVersion'); } catch {}
  try { await store.set('lastVersion', APP_VERSION); } catch {}
  if (via === 'creation' || via === 'restauration' || last === APP_VERSION) return;   // nouvel appareil : rien à annoncer
  // Sans trace de version : l'app vient d'une version antérieure à la 1.6, qui ne la notait pas
  const list = last ? newerThan(CHANGELOG, last) : CHANGELOG.filter(e => e.version === APP_VERSION);
  if (!list.length || introAt != null) return;
  setTimeout(() => { if (!sheetStack.length) showSheet(() => `${head('Nouveautés')}<p class="small" style="margin-top:-6px">${last ? `Depuis la version ${esc(last)}` : `Version ${esc(APP_VERSION)}`}</p>${versionsHtml(list)}
    <button class="btn primary wide" style="margin-top:12px" data-act="close">C’est noté</button>`); }, 300);
}
function historySheet() {
  return `${head('Historique des versions')}<p class="small" style="margin-top:-6px">Version installée : <b style="color:var(--ink)">${esc(APP_VERSION)}</b></p>${versionsHtml(newerThan(CHANGELOG, null))}`;
}
// Contenu d'une mise à jour disponible : journal publié en ligne, filtré depuis la version installée
async function loadNews() {
  code.news = 'chargement'; refreshSheet();
  try {
    const r = await fetch('./changelog.json?fresh=' + Date.now(), { cache: 'no-store' });
    if (!r.ok) throw new Error(String(r.status));
    const j = await r.json();
    if (!Array.isArray(j)) throw new Error('format');
    code.news = newerThan(j.filter(e => e && typeof e.version === 'string' && Array.isArray(e.items)).map(e => ({ version: e.version, date: String(e.date || ''), titre: String(e.titre || ''), items: e.items.map(String).slice(0, 30) })), APP_VERSION);
  } catch { code.news = 'erreur'; }
  refreshSheet();
}
function newsBlock() {
  if (code.news === 'chargement' || code.news == null) return '<p class="small">Chargement du contenu de la mise à jour…</p>';
  if (code.news === 'erreur') return '<p class="small">Le contenu de la mise à jour n’a pas pu être récupéré (pas de connexion, ou journal absent).</p>';
  if (!code.news.length) return '<p class="small">Le journal des versions ne décrit pas encore cette mise à jour.</p>';
  return `<h3>Ce qui change depuis ta version (${esc(APP_VERSION)})</h3>${versionsHtml(code.news)}`;
}

  introDone: async () => { introAt = null; paintIntro(); try { await store.set('introSeen', 1); } catch {} if (!introInApp) $('input[name=p1]')?.focus(); },
  introShow: () => showIntro(0, true),
});
// Glisser vers la gauche ou la droite pour changer d'écran
let introX = null;
document.addEventListener('touchstart', e => { if (introAt != null) introX = e.touches[0].clientX; }, { passive: true });
document.addEventListener('touchend', e => {
  if (introAt == null || introX == null) return;
  const dx = e.changedTouches[0].clientX - introX; introX = null;
  if (Math.abs(dx) > 50) ACT[dx < 0 ? 'introNext' : 'introPrev']();
}, { passive: true });

</script>
</body>
</html>
