<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="MyCellar">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="theme-color" content="#F7F3EC">
<meta name="referrer" content="no-referrer">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'sha256-Ue7Of7DZZD6xRH9D+63haJ7GP79qS1mEkp8Wc3H/CbQ='; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; connect-src 'self' https://api.anthropic.com https://api.mistral.ai; worker-src 'self'; manifest-src 'self'; object-src 'none'; frame-src 'none'; form-action 'none'; base-uri 'none'">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<title>MyCellar</title>
<style>
:root{
  --bg:#F7F3EC; --surface:#FFFFFF; --sunk:#EFE8DD; --ink:#2A1F1D; --muted:#7D716B; --line:#E7DFD4;
  --bx:#6E1E2F; --bx-soft:#F3E6E7; --on-bx:#FFFFFF;
  --green:#2F5240; --green-soft:#E4EEE7; --gold:#A8844E; --gold-soft:#F4ECDD; --red:#B03A2E; --red-soft:#F6DCD8;
  --rouge:#8E2435; --blanc:#E3CB6B; --rose:#E59CA2; --bulle:#CDBB8C; --liquo:#C4852A; --orange:#D98B3A; --spirit:#8A5A2B;
  --st-prio:#6E1E2F; --st-apogee:#2F5240; --st-tot:#A8844E; --st-declin:#9A5B4D; --st-inconnu:#B9AFA6;
  --txt:-apple-system,BlinkMacSystemFont,"SF Pro Text",system-ui,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
  --safe-b:env(safe-area-inset-bottom,0px); --safe-t:env(safe-area-inset-top,0px);
  color-scheme:light;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.4 var(--txt);-webkit-font-smoothing:antialiased;font-variant-numeric:tabular-nums;-webkit-tap-highlight-color:transparent}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--bx);outline-offset:2px;border-radius:8px}
.muted{color:var(--muted)} .small{font-size:13px;color:var(--muted)} .tiny{font-size:11.5px;color:var(--muted)}
.sr-only{position:absolute!important;width:1px!important;height:1px!important;min-height:0!important;padding:0!important;margin:-1px!important;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap;border:0!important;left:0;top:0}
.row{display:flex;align-items:center;gap:8px} .between{justify-content:space-between} .wrap{flex-wrap:wrap} .grow{flex:1;min-width:0}
.dot{width:10px;height:10px;border-radius:50%;display:inline-block;flex:none}
.ell{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
html.veil #app,html.veil #layer,html.veil #toast{visibility:hidden}

/* Verrou */
.lock{min-height:100dvh;display:flex;flex-direction:column;justify-content:center;padding:calc(32px + var(--safe-t)) 28px calc(32px + var(--safe-b));max-width:440px;margin:0 auto}
.lock-mark svg{width:64px;height:64px}
.lock-title{font-size:34px;font-weight:700;letter-spacing:-.02em;margin:18px 0 10px}
.lock-text{color:var(--muted);margin:0 0 26px;max-width:36ch}
.lock-form{display:grid;gap:14px}
.lock-links{display:grid;gap:4px;margin-top:22px;justify-items:start}
.or{text-align:center;color:var(--muted);margin:14px 0;font-size:14px}
.err{color:var(--red);margin:0;font-size:15px}
.codebar{padding:calc(12px + var(--safe-t)) 18px 14px;background:var(--gold-soft);font-size:14px;line-height:1.4}
.codebar.bad{background:var(--red-soft)}
.codebar p{margin:0 0 10px}
.fp{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:15px;letter-spacing:.04em}

/* Champs */
label{display:grid;gap:6px;font-size:13.5px;color:var(--muted);font-weight:500}
input[type=text],input[type=password],input[type=number],input[type=date],input[type=search],input:not([type]),select,textarea{width:100%;min-height:44px;padding:10px 12px;font-size:16px;border:1px solid var(--line);border-radius:12px;background:var(--surface);color:var(--ink);-webkit-appearance:none;appearance:none}
textarea{min-height:80px;line-height:1.4;resize:vertical}
select{background-image:linear-gradient(45deg,transparent 50%,var(--muted) 50%),linear-gradient(135deg,var(--muted) 50%,transparent 50%);background-position:calc(100% - 18px) 50%,calc(100% - 13px) 50%;background-size:5px 5px;background-repeat:no-repeat;padding-right:32px}
input[type=date]{display:block}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.grid3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px}
.form{display:grid;gap:12px}
.fieldset{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:12px;display:grid;gap:10px}
.fieldset > .ft{font-size:12px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.5px}
.check{display:flex;align-items:center;gap:10px;font-size:15px;color:var(--ink);font-weight:500}
.check input{width:22px;height:22px;accent-color:var(--bx);margin:0}

/* Boutons */
.btn{border:0;border-radius:12px;min-height:44px;padding:0 16px;font-weight:600;font-size:15px;background:var(--sunk);color:var(--ink);display:inline-flex;align-items:center;justify-content:center;gap:8px;text-align:center}
.btn.primary{background:var(--bx);color:var(--on-bx)}
.btn.green{background:var(--green);color:#fff}
.btn.ghost{background:transparent;border:1px solid var(--line)}
.btn.outline{background:transparent;border:1px solid var(--bx);color:var(--bx)}
.btn.danger{background:transparent;color:var(--red);border:1px solid var(--line)}
.btn.small{min-height:34px;padding:0 12px;font-size:13.5px;border-radius:10px}
.btn.wide{width:100%}
.btn:disabled{opacity:.5}
.btn svg{width:18px;height:18px}
.link{background:none;border:0;padding:8px 0;color:var(--bx);font-weight:600;text-align:left;font-size:15px}
.icon-btn{width:40px;height:40px;border:0;border-radius:12px;background:transparent;display:grid;place-items:center;color:var(--ink);flex:none}
.icon-btn svg{width:22px;height:22px}
.btns{display:grid;gap:8px}
.btns2{display:grid;grid-template-columns:1fr 1fr;gap:8px}

/* Structure */
.top{position:sticky;top:0;z-index:5;padding:calc(8px + var(--safe-t)) 16px 8px;background:color-mix(in srgb,var(--bg) 92%,transparent);-webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px)}
.top-row{display:flex;align-items:center;gap:8px;min-height:44px}
.top h1{font-size:30px;font-weight:700;letter-spacing:-.5px;margin:0;flex:1;min-width:0}
.sitepill{display:inline-flex;align-items:center;gap:6px;background:var(--surface);border:1px solid var(--line);border-radius:20px;padding:6px 12px;font-size:13.5px;font-weight:600;max-width:52vw}
.sitepill span.ell{max-width:34vw}
.view{padding:0 14px calc(110px + var(--safe-b));max-width:620px;margin:0 auto}
.banner{margin:8px 0 0;padding:10px 14px;border-radius:12px;background:var(--gold-soft);font-size:14px;line-height:1.4}
.banner.bx{background:var(--bx);color:#fff}
.banner.green{background:var(--green-soft)}
.banner .btn{margin-top:8px}
.empty{text-align:center;color:var(--muted);padding:40px 20px;font-size:15px}
.empty svg{width:44px;height:44px;opacity:.5;margin-bottom:8px}
.sect{font-size:12px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.5px;margin:18px 4px 6px}

/* Recherche, segments, pastilles */
.search{margin-top:8px;display:flex;align-items:center;gap:8px;background:var(--sunk);border-radius:12px;padding:0 10px}
.search svg{width:18px;height:18px;color:var(--muted);flex:none}
.search input{border:0;background:transparent;min-height:40px;padding:8px 0;font-size:16px}
.search input:focus{outline:none}
.seg{display:flex;background:#EAE2D6;border-radius:10px;padding:2px;margin-top:10px}
.seg button{flex:1;border:0;background:none;font-size:13.5px;font-weight:600;padding:7px 4px;border-radius:8px;color:var(--muted)}
.seg button.on{background:var(--surface);color:var(--ink);box-shadow:0 1px 2px rgba(0,0,0,.08)}
.chips{display:flex;gap:6px;margin-top:10px;overflow-x:auto;padding-bottom:2px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chips.wrap{flex-wrap:wrap;overflow:visible}
.chip{flex:none;font-size:13px;padding:7px 12px;border-radius:16px;background:var(--surface);border:1px solid var(--line);white-space:nowrap;font-weight:500;color:var(--ink);display:inline-flex;align-items:center;gap:6px}
.chip.on{background:var(--bx);color:#fff;border-color:var(--bx)}
.chip.soft.on{background:var(--bx-soft);color:var(--bx);border-color:var(--bx);font-weight:600}
.chip.dash{border-style:dashed;color:var(--muted)}
.tag{font-size:11.5px;padding:3px 8px;border-radius:10px;background:#F2ECE3;font-weight:500;white-space:nowrap}
.tag.g{background:var(--green-soft);color:var(--green)} .tag.b{background:var(--bx-soft);color:var(--bx)} .tag.o{background:var(--gold-soft);color:#7A5C2E} .tag.r{background:var(--red-soft);color:var(--red)}
.tags{display:flex;gap:5px;flex-wrap:wrap}

/* Cartes */
.card{background:var(--surface);border-radius:16px;padding:12px;margin-top:10px;border:1px solid var(--line)}
.card.tap{cursor:pointer}
.ct{font-size:14px;font-weight:700;display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:8px}
.ct span.small{font-weight:500}
.ct .icon-btn{width:32px;height:32px;margin:-6px -6px -6px 0}
.ct .icon-btn svg{width:18px;height:18px}

/* Plan : armoire / étagère */
.shelf-l{font-size:10px;color:var(--muted);margin:8px 0 3px;font-weight:600;letter-spacing:.3px;text-transform:uppercase}
.shelf{display:grid;gap:4px}
.slot{background:#FAF7F2;border:1px solid var(--line);border-radius:7px;min-height:42px;padding:4px 3px 4px 8px;position:relative;overflow:hidden;text-align:left;font-size:9.5px;line-height:1.2;min-width:0}
.slot i{position:absolute;left:0;top:0;bottom:0;width:4px}
.slot b{display:block;font-size:10px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;letter-spacing:-.1px}
.slot small{display:block;color:var(--muted);font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.slot.empty{background:transparent;border-style:dashed}
.slot.hl{outline:2px solid var(--bx);outline-offset:1px;background:var(--bx-soft)}
.slot.dim{opacity:.35}
.slot.ami{background:repeating-linear-gradient(135deg,#FAF7F2 0 5px,#EFE8DD 5px 7px)}
.slot .ini{position:absolute;right:3px;bottom:2px;font-size:8.5px;background:var(--gold);color:#fff;border-radius:6px;padding:0 3px;font-weight:700}
.slot.sel{outline:2px solid var(--green);outline-offset:1px;background:var(--green-soft)}
/* Plan : rack */
.rack{display:grid;gap:6px 4px;justify-content:space-between}
.rc{width:100%;max-width:36px;aspect-ratio:1;height:auto;justify-self:center;border-radius:50%;border:1px solid var(--line);background:#FAF7F2;display:flex;align-items:center;justify-content:center;font-size:9px;font-weight:700;color:#fff;padding:0;position:relative;letter-spacing:-.2px}
.rc.hl{box-shadow:0 0 0 2px var(--bg),0 0 0 4px var(--bx)}
.rc.dim{opacity:.3}
.rc.sel{box-shadow:0 0 0 2px var(--bg),0 0 0 4px var(--green)}
.rc.ami::after{content:attr(data-ini);position:absolute;right:-3px;bottom:-3px;background:var(--gold);color:#fff;font-size:8px;border-radius:6px;padding:0 3px}
.rc.light{color:#4a3d10}
.rack-scroll{overflow-x:auto;padding:4px 2px}
/* Plan : caisses */
.pile{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.crate{background:#EADCC4;border:1px solid #D8C5A5;border-radius:8px;padding:8px;font-size:12px;font-weight:600;line-height:1.3;text-align:left;min-width:0}
.crate.carton{background:#E6D3B5;border-color:#CFB892}
.crate small{display:block;font-weight:500;color:#6E5A3E}
.crate .cnt{display:inline-block;margin-top:5px;background:#fff;border-radius:8px;padding:1px 7px;font-size:11px}
.crate.hl{outline:2px solid var(--bx);outline-offset:1px}
.crate.dim{opacity:.35}
.unplaced{display:flex;gap:6px;flex-wrap:wrap}

/* Listes */
.list{background:var(--surface);border:1px solid var(--line);border-radius:16px;margin-top:10px;overflow:hidden}
.li{display:flex;gap:10px;align-items:center;padding:11px 12px;border-bottom:1px solid var(--line);text-align:left;width:100%;background:none;border-left:0;border-right:0;border-top:0}
.li:last-child{border-bottom:0}
.li .it{flex:1;min-width:0}
.li .it b{font-size:14.5px;display:block;font-weight:600}
.li .it small{font-size:12.5px;color:var(--muted);display:block}
.qty{font-size:13px;font-weight:700;background:#F2ECE3;border-radius:9px;padding:3px 8px;flex:none}
.chev{color:var(--muted);flex:none}
.chev svg{width:16px;height:16px}
.thumb{width:40px;height:52px;border-radius:6px;object-fit:cover;flex:none;background:var(--sunk)}

/* Fenêtre de dégustation */
.win{position:relative;height:6px;background:#EFE8DD;border-radius:3px;margin-top:7px}
.win .w{position:absolute;top:0;bottom:0;border-radius:3px;background:linear-gradient(90deg,var(--gold) 0%,var(--green) 40%,var(--green) 70%,var(--st-declin) 100%)}
.win .now{position:absolute;top:-3px;width:2px;height:12px;background:var(--ink);border-radius:1px}
.win.big{height:10px;border-radius:5px}
.win.big .now{height:18px;top:-4px}
.winlab{display:flex;justify-content:space-between;font-size:11.5px;color:var(--muted);margin-top:4px}

/* À boire */
.kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin-top:10px}
.kpi{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:8px 4px;text-align:center}
.kpi b{display:block;font-size:21px}
.kpi span{font-size:10.5px;color:var(--muted);font-weight:600}
.kpi.on{border:1.5px solid var(--bx)}
.bars{display:flex;align-items:flex-end;gap:6px;height:90px}
.bars div{flex:1;border-radius:4px 4px 0 0;min-height:2px;position:relative}
.bars div span{position:absolute;top:-16px;left:0;right:0;text-align:center;font-size:10.5px;font-weight:700;color:var(--ink)}
.barl{display:flex;gap:6px;font-size:10.5px;color:var(--muted);margin-top:4px;text-align:center}
.barl span{flex:1}

/* Barre d'onglets */
.tabs{position:fixed;left:0;right:0;bottom:0;z-index:6;display:grid;grid-template-columns:1fr 1fr 72px 1fr 1fr;padding:6px 4px calc(6px + var(--safe-b));background:color-mix(in srgb,var(--surface) 94%,transparent);-webkit-backdrop-filter:blur(16px);backdrop-filter:blur(16px);border-top:1px solid var(--line)}
.tab{display:flex;flex-direction:column;align-items:center;gap:3px;font-size:10.5px;color:var(--muted);font-weight:500;background:none;border:0;padding:4px 0}
.tab svg{width:24px;height:24px}
.tab.on{color:var(--bx)}
.tab.plus span{width:56px;height:56px;border-radius:50%;background:var(--bx);color:#fff;display:flex;align-items:center;justify-content:center;margin-top:-26px;box-shadow:0 6px 16px rgba(110,30,47,.35);border:4px solid var(--bg)}
.tab.plus svg{width:26px;height:26px}

/* Feuilles */
.backdrop{position:fixed;inset:0;z-index:20;background:rgba(30,15,12,.38)}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:21;max-height:92dvh;overflow:auto;overscroll-behavior:contain;background:var(--bg);border-radius:22px 22px 0 0;padding:8px 16px calc(24px + var(--safe-b));max-width:620px;margin:0 auto;animation:up .22s ease-out}
.sheet.full{top:calc(10px + var(--safe-t));max-height:none}
@keyframes up{from{transform:translateY(30px);opacity:.4}to{transform:none;opacity:1}}
.sheet .grab{height:18px;position:relative;margin-bottom:2px}
.sheet .grab::after{content:'';position:absolute;left:50%;top:6px;transform:translateX(-50%);width:40px;height:5px;border-radius:9px;background:var(--line)}
.sheet h2{font-size:21px;font-weight:700;margin:2px 0 12px;letter-spacing:-.2px}
.sheet h3{font-size:15px;font-weight:700;margin:20px 0 8px}
.shead{display:flex;align-items:center;gap:8px;margin:0 0 10px}
.shead h2{flex:1;margin:0;min-width:0}
.shead .link{padding:6px 0}
.toast{position:fixed;left:50%;bottom:calc(96px + var(--safe-b));transform:translateX(-50%);z-index:30;background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:12px;font-size:15px;font-weight:600;opacity:0;pointer-events:none;transition:opacity .2s;max-width:90vw;text-align:center}
.toast.show{opacity:1}
@media (prefers-reduced-motion: reduce){.sheet{animation:none}.toast{transition:none}}
.kv{display:grid;grid-template-columns:auto 1fr;gap:6px 12px;font-size:14px;margin:0}
.kv dt{color:var(--muted)} .kv dd{margin:0;font-weight:500;text-align:right}
.photo{width:100%;max-height:260px;object-fit:contain;border-radius:12px;background:var(--sunk)}
.big-actions{display:grid;gap:10px}
.big-action{display:flex;align-items:center;gap:14px;text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:14px;width:100%}
.big-action svg{width:28px;height:28px;color:var(--bx);flex:none}
.big-action b{display:block;font-size:15.5px}
.big-action small{color:var(--muted);font-size:13px}

/* Interrupteur */
.switch{position:relative;width:48px;height:28px;flex:none}
.switch input{opacity:0;width:100%;height:100%;margin:0;position:absolute;inset:0;z-index:1;cursor:pointer}
.switch span{position:absolute;inset:0;border-radius:14px;background:#E2D9CC;transition:background .15s}
.switch span::after{content:"";position:absolute;top:2px;left:2px;width:24px;height:24px;border-radius:50%;background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.2);transition:left .15s}
.switch input:checked + span{background:var(--green)}
.switch input:checked + span::after{left:22px}
.switch input:disabled + span{opacity:.45}
.set{display:flex;align-items:center;gap:10px;padding:11px 0;border-bottom:1px solid var(--line);width:100%;text-align:left;background:none;border-left:0;border-right:0;border-top:0}
.set:last-child{border-bottom:0}
.set .it{flex:1;min-width:0}
.set .it b{display:block;font-size:15px;font-weight:600}
.set .it small{display:block;font-size:12.5px;color:var(--muted)}
.set .val{font-size:13.5px;color:var(--bx);font-weight:600;flex:none}
.meter{height:8px;background:var(--sunk);border-radius:4px;overflow:hidden;margin-top:8px}
.meter i{display:block;height:100%;background:var(--green);border-radius:4px}
.meter i.warn{background:var(--gold)} .meter i.over{background:var(--red)}

/* Sommelier */
.chat{padding-bottom:170px}
.bubble{max-width:86%;padding:10px 13px;border-radius:18px;font-size:15px;line-height:1.4;margin-top:10px;white-space:pre-wrap;word-wrap:break-word}
.bubble.me{background:var(--bx);color:#fff;margin-left:auto;border-bottom-right-radius:6px}
.bubble.ai{background:var(--surface);border:1px solid var(--line);border-bottom-left-radius:6px}
.bubble.err{background:var(--red-soft);border:0}
.reco{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:12px;margin-top:8px}
.reco.first{border:1.5px solid var(--bx)}
.rk{font-size:11px;font-weight:700;color:var(--bx);letter-spacing:.4px;text-transform:uppercase}
.rn{font-size:15.5px;font-weight:700;margin-top:3px}
.rs{font-size:12.5px;color:var(--muted);margin-top:1px}
.why{font-size:13.5px;line-height:1.4;margin-top:7px}
.loc{display:flex;align-items:center;gap:6px;margin-top:8px;font-size:12.5px;font-weight:600;color:var(--green)}
.loc svg{width:14px;height:14px;flex:none}
.composer{position:fixed;left:0;right:0;bottom:calc(68px + var(--safe-b));z-index:5;padding:8px 14px;background:linear-gradient(to bottom,transparent,var(--bg) 16px);max-width:620px;margin:0 auto}
.composer .box{display:flex;align-items:flex-end;gap:8px;background:var(--surface);border:1px solid var(--line);border-radius:22px;padding:4px 4px 4px 14px}
.composer textarea{border:0;min-height:38px;max-height:120px;padding:9px 0;background:transparent;resize:none;font-size:16px}
.composer textarea:focus{outline:none}
.composer .send{width:38px;height:38px;border-radius:50%;background:var(--bx);color:#fff;border:0;display:grid;place-items:center;flex:none}
.composer .send svg{width:18px;height:18px}
.composer .send:disabled{opacity:.4}

/* ---------- Emplacements ---------- */
const capacity = u => UNIT_TYPES[u.type]?.box ? (u.cap || 6) : (u.rows || 1) * (u.cols || 1);
function positions(u) {
  const out = [];
  if (UNIT_TYPES[u.type]?.box) for (let i = 0; i < capacity(u); i++) out.push([0, i]);
  else for (let r = 0; r < (u.rows || 1); r++) for (let c = 0; c < (u.cols || 1); c++) out.push([r, c]);
  return out;
}
function occupancy() {
  const m = new Map();
  for (const b of S.bottles) if (inCave(b) && b.unitId) m.set(`${b.unitId}:${b.r}:${b.c}`, b);
  return m;
}
const freeSlots = (u, occ = occupancy()) => positions(u).filter(([r, c]) => !occ.has(`${u.id}:${r}:${c}`));
function posLabel(b) {
  const u = b.unitId && unit(b.unitId);
  if (!u) return 'non placée';
  const t = UNIT_TYPES[u.type];
  if (t.box) return u.name || t.label;
  return `${u.name || t.label} · ${t.row1} ${b.r + 1}, place ${b.c + 1}`;
}
function locLabel(b, withSite = isMulti()) {
  if (b.state === 'primeur') return 'Primeur, pas encore livrée' + (b.delivery?.date ? ' (prévue ' + fmtDate(b.delivery.date) + ')' : '');
  const sp = space(b.spaceId);
  const parts = [];
  if (withSite && sp) parts.push(site(sp.siteId)?.name);
  if (sp) parts.push(sp.name);
  parts.push(posLabel(b));
  return parts.filter(Boolean).join(' › ');
}
// Espace conseillé pour un vin : prêt à boire → espace de consommation du site de consommation,
// sinon → espace de garde de meilleure qualité
function suggestSpace(w) {
  const st = status(w), ready = st === 'prio' || st === 'apogee' || w.kind === 'spirit';
  const sp = S.spaces.map(s => ({ s, site: site(s.siteId), q: spaceQuality(s) }));
  const score = o => {
    let n = o.q;
    if (ready) { if (o.s.use === 'conso') n += 10; if (o.site?.role === 'conso') n += 5; }
    else { if (o.s.use === 'garde') n += 10; if (o.site?.role === 'stock') n += 3; }
    if (o.s.siteId === S.settings.site) n += 1;
    return n;
  };
  return sp.sort((a, b) => score(b) - score(a))[0]?.s || S.spaces[0];
}
// Cases libres conseillées dans un espace : on remplit les meubles dans l'ordre, une caisse vide d'abord
// si l'on range au moins six bouteilles d'un même vin
function suggestSlots(spaceId, n, exclude = new Set()) {
  const occ = occupancy(), out = [];
  const units = spaceUnits(spaceId);
  const boxes = units.filter(u => UNIT_TYPES[u.type].box && freeSlots(u, occ).length === capacity(u) && capacity(u) <= n);
  const order = n >= 6 ? [...boxes, ...units.filter(u => !boxes.includes(u))] : [...units.filter(u => !UNIT_TYPES[u.type].box), ...units.filter(u => UNIT_TYPES[u.type].box)];
  for (const u of order) for (const [r, c] of freeSlots(u, occ)) {
    const k = `${u.id}:${r}:${c}`; if (exclude.has(k)) continue;
    if (out.length < n) out.push({ unitId: u.id, r, c });
  }
  return out;
}

/* ---------- Liste ---------- */

function unitSheet(id, spaceId) {

  const sps = S.spaces.map(s => `<option value="${s.id}" ${s.id === u.spaceId ? 'selected' : ''}>${esc(isMulti() ? site(s.siteId)?.name + ' › ' : '')}${esc(s.name)}</option>`).join('');

}

    <label>Pile<input name="pile" value="${esc(u.pile || '')}" placeholder="A"></label><label>Niveau<input name="level" inputmode="numeric" value="${esc(u.level || '')}" placeholder="1 = bas"></label></div>`;
  return `<div class="grid2"><label>${t.rows}<input name="rows" inputmode="numeric" value="${u.rows && u.type === type ? u.rows : t.def[0]}" required></label>
    <label>${t.cols}<input name="cols" inputmode="numeric" value="${u.cols && u.type === type ? u.cols : t.def[1]}" required></label></div>`;
}
CHANGES.unitType = el => { $('#unit-dims').innerHTML = unitDims(el.value); };
FORMS.unit = async (f, d) => {
  const id = f.dataset.id, t = UNIT_TYPES[d.type];
  const o = { type: d.type, name: d.name, spaceId: d.spaceId };
  if (t.box) Object.assign(o, { cap: int(d.cap) || 6, pile: d.pile, level: int(d.level), rows: 1, cols: int(d.cap) || 6 });
  else {
    const rows = int(d.rows), cols = int(d.cols);
    if (!rows || !cols || rows < 1 || cols < 1 || rows > 40 || cols > 40) return toast('Dimensions entre 1 et 40');
    Object.assign(o, { rows, cols });
  }
  if (id) {
    const u = unit(id);
    // Bouteilles hors des nouvelles dimensions, ou meuble déplacé : elles redeviennent non placées
    const oldType = u.type;
    Object.assign(u, o);
    const valid = new Set(positions(u).map(([r, c]) => `${r}:${c}`));
    let moved = 0;
    for (const b of S.bottles) if (b.unitId === id && inCave(b)) {
      if (oldType !== u.type || !valid.has(`${b.r}:${b.c}`)) { b.unitId = null; b.r = b.c = null; moved++; }
      b.spaceId = u.spaceId;
    }
    await save(); closeSheet(); render(); toast(moved ? `Meuble modifié · ${plural(moved, 'bouteille non placée', 'bouteilles non placées')}` : 'Meuble modifié');
  } else {

    caveSpace = d.spaceId;
    await save(); closeSheet(); render(); toast('Meuble ajouté');

};

function readWineForm(d, w) {
  const sp = w.kind === 'spirit';
  const t = s => s || '';
  Object.assign(w, {
    domaine: t(d.domaine), cuvee: t(d.cuvee), region: t(d.region), pays: t(d.pays), format: d.format,
    millesime: int(d.millesime) || null, degre: num(d.degre), owner: t(d.owner) || null, short: t(d.short), abbr: t(d.abbr).toUpperCase(), notes: t(d.notes),
    achat: { prix: num(d.prix), date: d.adate || null, lieu: t(d.lieu) }, cadeau: d.offertPar ? { de: d.offertPar } : null,
  });
  if (sp) Object.assign(w, { cat: d.cat, age: int(d.age), bottled: int(d.bottled), fut: t(d.fut), bruteDeFut: !!d.bruteDeFut, singleCask: !!d.singleCask, independant: t(d.independant), numero: t(d.numero) });
  else {
    Object.assign(w, { couleur: d.couleur, appellation: t(d.appellation), cepages: t(d.cepages), bio: !!d.bio, nature: !!d.nature });
    const deb = int(d.adeb), pic = int(d.apic), fin = int(d.afin), a = w.apogee || {};
    if (fin && (fin !== a.fin || deb !== a.debut || pic !== a.pic)) w.apogee = { ...a, debut: deb, pic, fin, src: 'manuel', at: Date.now() };
    else if (!fin && a.src === 'manuel') w.apogee = null;
  }
  if (w.owner && !S.settings.friends.includes(w.owner)) S.settings.friends.push(w.owner);
}
FORMS.wine = async (f, d) => {
  const dr = draft; if (!dr) return closeSheet();
  if (dr.edit) {
    const w = wine(dr.edit); readWineForm(d, w); w.updatedAt = Date.now();
    if (dr.photo) { await photoSave(w.id, dr.photo); w.photo = true; }
    await save(); draft = null; sheetBack(); render(); return toast('Fiche modifiée');
  }
  const w = { id: uid(), ...dr.w, createdAt: Date.now() };
  readWineForm(d, w);
  // Vin dégusté hors cave : une fiche sans bouteille (ou la fiche existante), puis la dégustation
  if (dr.forTaste || dr.forReveal) {
    const same = S.wines.find(x => x.kind === w.kind && norm(x.domaine) === norm(w.domaine) && norm(x.cuvee) === norm(w.cuvee) && norm(x.appellation) === norm(w.appellation) && (x.millesime || null) === w.millesime);
    const target = same || w;
    if (!same) { delete w.achat; S.wines.push(w); }
    if (dr.photo && !target.photo) { await photoSave(target.id, dr.photo); target.photo = true; }
    await save(); draft = null; closeSheet();
    if (target.kind === 'vin' && !target.apogee?.fin && aiReady() && S.settings.ai.auto && !same) estimateApogee(target.id, { quiet: true });
    if (dr.forReveal) return doReveal(dr.forReveal, target.id);
    return startTaste(target.id, null, 'quick', { sessionId: dr.forTaste.sessionId });
  }
  const qty = clamp(int(d.qty) || 1, 1, 500);
  const same = S.wines.find(x => x.kind === w.kind && norm(x.domaine) === norm(w.domaine) && norm(x.cuvee) === norm(w.cuvee) && norm(x.appellation) === norm(w.appellation) && (x.millesime || null) === w.millesime && (x.owner || null) === w.owner && x.format === w.format);
  let target = w;
  if (same && confirm(`« ${wineTitle(same)} » est déjà dans ta cave. Ajouter ces ${qty} bouteille(s) à cette fiche ?`)) target = same;
  else S.wines.push(w);
  if (dr.photo) { await photoSave(target.id, dr.photo); target.photo = true; }
  const ids = createBottles(target, qty, d.state === 'primeur' ? { state: 'primeur', delivery: { date: d.delivery || null, spaceId: d.spaceId } } : { spaceId: d.spaceId });
  await save(); draft = null;
  afterAdd(target, ids, d.state === 'primeur');
};
function createBottles(w, n, { state = 'cave', spaceId = null, delivery = null } = {}) {
  const ids = [];
  for (let i = 0; i < n; i++) {
    const b = { id: uid(), wineId: w.id, state, spaceId: state === 'cave' ? spaceId : null, unitId: null, r: null, c: null, addedAt: today(), delivery };
    S.bottles.push(b); ids.push(b.id); logMove(b, state === 'primeur' ? 'primeur' : 'in', { to: locOf(b) });
  }
  return ids;
}
function afterAdd(w, ids, primeur) {
  const autoAI = w.kind === 'vin' && !w.apogee?.fin && aiReady() && S.settings.ai.auto;
  if (autoAI) estimateApogee(w.id, { quiet: true });
  if (primeur) { closeSheet(); render(); return toast(`${plural(ids.length, 'bouteille ajoutée', 'bouteilles ajoutées')} en primeur`); }
  // Une place a été touchée sur le plan : la première bouteille y va directement
  const b0 = byId(S.bottles, ids[0]);
  if (addTarget && b0) {
    const u = unit(addTarget.unitId), occ = occupancy();
    if (u && !occ.has(`${u.id}:${addTarget.r}:${addTarget.c}`)) { Object.assign(b0, { spaceId: u.spaceId, unitId: u.id, r: addTarget.r, c: addTarget.c }); }
  }
  addTarget = null;
  const rest = ids.filter(id => !byId(S.bottles, id).unitId);
  const spId = byId(S.bottles, ids[0]).spaceId;
  save();
  if (rest.length && spaceUnits(spId).length) {
    closeSheet();
    startPlace(w.id, rest, spId, true);
  } else { closeSheet(); render(); toast(`${plural(ids.length, 'bouteille ajoutée', 'bouteilles ajoutées')}${autoAI ? ' · estimation de l’apogée en cours' : ''}`); }
}

function startPlace(wineId, ids, spaceId, fresh) {
  draft = { place: { wineId, ids, spaceId: spaceId || suggestSpace(wine(wineId)).id, sel: [], fresh } };
  draft.place.sel = suggestFor(draft.place);
  showSheet(placeSheet, { full: true });
}
const suggestFor = p => suggestSlots(p.spaceId, p.ids.length, new Set()).filter(s => !occupancyExcept(new Set(p.ids)).has(`${s.unitId}:${s.r}:${s.c}`));
function placeSheet() {

  const ctx = { occ, m: null, pick: p };

    <div class="chips">${S.spaces.map(s => `<button class="chip${s.id === p.spaceId ? ' on' : ''}" data-act="placeSpace" data-id="${s.id}">${esc(isMulti() ? site(s.siteId)?.name + ' › ' : '')}${esc(s.name)}</button>`).join('')}</div>
    <p class="small"><b style="color:var(--ink)">${p.sel.length} / ${p.ids.length}</b> place${p.ids.length > 1 ? 's' : ''} choisie${p.sel.length > 1 ? 's' : ''}. Touche les cases libres pour choisir.</p>
    ${!units.length ? `<div class="card small">Aucun meuble dans cet espace : les bouteilles y seront rangées sans emplacement précis.</div>` : ''}
    ${grid.map(u => `<div class="card">${unitHead(u, ctx)}${renderGrid(u, ctx)}</div>`).join('')}
    ${boxes.length ? `<div class="card"><div class="ct">Caisses et cartons</div>${renderBoxes(boxes, ctx)}</div>` : ''}
    <div class="btns" style="margin-top:14px;position:sticky;bottom:0;background:var(--bg);padding:8px 0">
      <div class="btns2"><button class="btn" data-act="placeSuggest">Suggérer</button><button class="btn" data-act="placeClear">Effacer</button></div>
      <button class="btn primary wide" data-act="placeOk">${p.sel.length ? 'Valider le rangement' : 'Laisser sans emplacement'}</button>
    </div>`;
}
function placeToggle(unitId, r, c) {
  const p = draft.place, i = p.sel.findIndex(s => s.unitId === unitId && s.r === r && s.c === c);

}
Object.assign(ACT, {

  placeSpace: t => { draft.place.spaceId = t.dataset.id; draft.place.sel = suggestFor(draft.place); refreshSheet(); },
  pickSlot: t => placeToggle(t.dataset.u, +t.dataset.r, +t.dataset.c),
  pickBox: t => {

  },

  await save(); afterAdd(w, ids, d.state === 'primeur');
};

/* ---------- Sortie ---------- */

CHANGES.radioChip = el => { for (const l of $$(`input[name="${el.name}"]`, el.form)) l.closest('.chip').classList.toggle('on', l.checked); };
FORMS.out = async (f, d) => {
  const b = byId(S.bottles, f.dataset.b), w = wine(b.wineId), from = locOf(b);
  b.state = 'out'; b.outAt = d.at || today();
  logMove(b, 'out', { motif: d.motif, at: d.at || today(), from, who: d.who, plat: d.plat });

    <p class="tiny">Si tu ne notes pas maintenant, je te le rappellerai demain.</p>`, { replace: true });
};

/* ---------- Transfert entre sites ---------- */
function transferSheet() {
  const ids = S.transfer.ids.filter(id => byId(S.bottles, id) && inCave(byId(S.bottles, id)));
  const bs = ids.map(id => byId(S.bottles, id));
  const to = S.transfer.to && site(S.transfer.to) ? S.transfer.to : S.sites.find(s => s.role === 'conso')?.id || S.sites[0].id;
  const sugg = transferSuggestions(to);
  return `${head('Transfert entre sites')}
    <label>Destination<select data-ch="transferTo">${S.sites.map(s => `<option value="${s.id}" ${s.id === to ? 'selected' : ''}>${esc(s.name)}</option>`).join('')}</select></label>
    ${bs.length ? `<div class="list">${bs.map(b => { const w = wine(b.wineId); return `<div class="li"><span class="dot" style="background:${wineColor(w)}"></span><div class="it"><b class="ell">${esc(wineTitle(w))}</b><small class="ell">${esc(locLabel(b))}</small></div><button class="icon-btn" data-act="toTransfer" data-b="${b.id}" aria-label="Retirer">${ICON.close}</button></div>`; }).join('')}</div>` : '<p class="muted small">Aucune bouteille pour l’instant. Ouvre une bouteille et touche « Ajouter au prochain transfert ».</p>'}
    ${sugg.length ? `<h3>Suggestions</h3><p class="small" style="margin-top:-4px">Vins prêts à boire stockés ailleurs qu’à destination.</p><div class="list">${sugg.slice(0, 8).map(b => { const w = wine(b.wineId); return `<div class="li"><span class="dot" style="background:${wineColor(w)}"></span><div class="it"><b class="ell">${esc(wineTitle(w))}</b><small class="ell">${STATUS[status(w)].short} · ${esc(locLabel(b))}</small></div><button class="btn small" data-act="toTransfer" data-b="${b.id}">Ajouter</button></div>`; }).join('')}</div>` : ''}
    ${bs.length ? `<button class="btn primary wide" style="margin-top:14px" data-act="transferDone" data-to="${to}">${ICON.check} Arrivées à ${esc(site(to)?.name)}</button><p class="tiny">Les bouteilles passent dans l’espace de consommation de ce site, sans emplacement : tu pourras les ranger ensuite.</p>` : ''}`;
}
function transferSuggestions(to) {
  const seen = new Set();
  return S.bottles.filter(b => {
    if (b.state !== 'cave' || S.transfer.ids.includes(b.id) || siteOfBottle(b) === to) return false;
    const w = wine(b.wineId); if (!w || isFriend(w) || !['prio', 'apogee'].includes(status(w))) return false;
    if (seen.has(w.id)) return false; seen.add(w.id); return true;
  }).sort((a, b) => (status(wine(a.wineId)) === 'prio' ? 0 : 1) - (status(wine(b.wineId)) === 'prio' ? 0 : 1));
}
CHANGES.transferTo = async el => { S.transfer.to = el.value; await save(); refreshSheet(); };
Object.assign(ACT, {
  transferSheet: () => showSheet(transferSheet),
  toTransfer: async t => {
    const id = t.dataset.b, i = S.transfer.ids.indexOf(id);
    if (i >= 0) S.transfer.ids.splice(i, 1); else S.transfer.ids.push(id);
    await save(); refreshSheet(); render(); toast(i >= 0 ? 'Retirée du transfert' : 'Ajoutée au transfert');
  },
  transferDone: async t => {
    const to = t.dataset.to, sps = siteSpaces(to), dest = sps.find(s => s.use === 'conso') || sps[0];
    if (!dest) return toast('Ce site n’a pas encore d’espace');
    let n = 0;
    for (const id of S.transfer.ids) {
      const b = byId(S.bottles, id); if (!b || !inCave(b) || siteOfBottle(b) === to) continue;
      const from = locOf(b); Object.assign(b, { spaceId: dest.id, unitId: null, r: null, c: null });
      logMove(b, 'transfert', { from, to: locOf(b) }); n++;
    }
    S.transfer.ids = []; S.settings.site = to; caveSpace = dest.id;
    await save(); closeSheet(); view = 'cave'; caveMode = 'plan'; render(); toast(`${plural(n, 'bouteille arrivée', 'bouteilles arrivées')} · à ranger dans « ${dest.name} »`);
  },
  receive: async t => {
    const b = byId(S.bottles, t.dataset.b), w = wine(b.wineId);
    const ids = S.bottles.filter(x => x.wineId === w.id && x.state === 'primeur').map(x => x.id);
    const n = ids.length > 1 && confirm(`Réceptionner les ${ids.length} bouteilles en primeur de ce vin ?`) ? ids : [b.id];
    const dest = space(b.delivery?.spaceId) || suggestSpace(w);
    for (const id of n) { const x = byId(S.bottles, id); Object.assign(x, { state: 'cave', spaceId: dest.id, unitId: null, r: null, c: null, addedAt: today() }); logMove(x, 'in', { to: locOf(x), primeur: true }); }
    await save(); closeSheet();
    if (spaceUnits(dest.id).length) startPlace(w.id, n, dest.id, true); else { render(); toast('Primeur réceptionné'); }
  },
  openBottle: async t => { const b = byId(S.bottles, t.dataset.b); b.state = 'open'; b.openedAt = today(); b.level = 100; logMove(b, 'open'); await save(); refreshSheet(); render(); },
  outBottle: t => showSheet(() => outSheet(t.dataset.b)),
  bottle: t => showSheet(() => bottleSheet(t.dataset.b)),
  wine: t => showSheet(() => wineSheet(t.dataset.id)),
  editWine: t => { const w = wine(t.dataset.id); draft = { w: structuredClone(w), edit: w.id }; showSheet(wineFormSheet, { full: true }); },
  delWine: async t => {
    const w = wine(t.dataset.id), n = wineBottles(w.id).length + S.bottles.filter(b => b.wineId === w.id && b.state === 'primeur').length;
    if (!confirm(n ? `Supprimer « ${wineTitle(w)} » et ses ${n} bouteilles encore en cave ? Pour une bouteille bue, utilise plutôt « Sortir ».` : `Supprimer « ${wineTitle(w)} » et son historique ?`)) return;
    const ids = new Set(S.bottles.filter(b => b.wineId === w.id).map(b => b.id));
    S.wines = S.wines.filter(x => x.id !== w.id); S.bottles = S.bottles.filter(b => b.wineId !== w.id);
    S.moves = S.moves.filter(m => m.wineId !== w.id); S.tastings = S.tastings.filter(x => x.wineId !== w.id);
    S.transfer.ids = S.transfer.ids.filter(id => !ids.has(id));
    if (w.photo) await photoDel(w.id);
    await save(); closeSheet(); render(); toast('Référence supprimée');
  },
});

// ctx : { sessionId } pour une dégustation dans une séance
function startTaste(wineId, bottleId, m, ctx = {}) {
  const w = wine(wineId) || mysteryWine();

  const sess = ctx.sessionId && byId(S.sessions, ctx.sessionId);
  draft = { taste: { wineId, bottleId: bottleId || null, kind: w.kind, mode: m === 'full' ? 'full' : 'quick', note: 14, comment: '', at: sess?.date || today(), plat: prev?.plat || '',
    type: sess?.type || null, lieu: sess?.lieu || '', convives: sess?.convives || '', prix: '', achatLieu: '', provenance: '', accord: null, sessionId: sess?.id || null, fromCave: false, full: { aromes: [] } } };
  wheelState = { active: null };
  showSheet(tasteSheet, { full: true });
}
// Dégustation à l'aveugle : tant que le vin n'est pas révélé, on travaille sur un « vin mystère »
const mysteryWine = b => ({ id: '', kind: b?.kind || 'vin', couleur: b?.couleur || null, cuvee: 'Vin mystère', domaine: '', appellation: '' });
const tastingWine = t => wine(t.wineId) || (t.blind ? mysteryWine(t.blind) : null);
function startBlind(sessionId) {

  Object.assign(draft.taste, { blind: true, kind: 'vin', couleur: null, hyp: {} });
  refreshSheet();
}
function editTaste(id) {
  const r = byId(S.tastings, id), w = tastingWine(r);
  draft = { taste: { ...r, blind: !!r.blind, couleur: r.blind?.couleur || null, hyp: { ...(r.blind?.hyp || {}) }, kind: w.kind, mode: r.full ? 'full' : 'quick', prix: r.prix != null ? numFr(r.prix, 2) : '', full: { aromes: [], ...(structuredClone(r.full || {})) }, editId: id } };
  wheelState = { active: null };
  showSheet(tasteSheet, { full: true });
}
function tasteContext(t, w) {

function degTastings() {

    if (f.min && !(t.note >= 16)) return false;
    if (f.src === 'hors' && t.bottleId) return false;
    if (f.src === 'cave' && !t.bottleId) return false;
    if (f.type && t.type !== f.type) return false;
    if (f.color && w.couleur !== f.color) return false;

/* ---------- Intelligence artificielle ----------
   Appels directs depuis le navigateur, avec la clé de l'utilisateur rangée dans le coffre chiffré.
   La politique de sécurité (CSP) limite les destinations possibles à ces deux API.
   Les vins gardés pour des amis ne sont jamais envoyés au sommelier. */
const AI = {
  anthropic: { label: 'Claude (Anthropic)', model: 'claude-sonnet-5-5', keyUrl: 'console.anthropic.com', url: 'https://api.anthropic.com/v1/messages' },
  mistral: { label: 'Mistral (hébergé en Europe)', model: 'mistral-large-latest', keyUrl: 'console.mistral.ai', url: 'https://api.mistral.ai/v1/chat/completions' },
};
const aiCfg = () => S?.settings.ai || {};
const aiReady = () => !!aiCfg().key;
const aiClaude = () => (aiCfg().provider || 'anthropic') === 'anthropic';
const aiModel = () => aiCfg().model || AI[aiCfg().provider || 'anthropic'].model;
let aiNoFallback = false;
class AIError extends Error {}

async function apiError(r) {
  let detail = '';
  try { const t = (await r.text()).slice(0, 500); try { const j = JSON.parse(t); detail = j.error?.message || j.message || j.detail || ''; } catch { detail = t; } } catch {}
  detail = String(detail).replace(/\s+/g, ' ').trim().slice(0, 160);
  const base = r.status === 401 ? 'Clé refusée (401) : elle est invalide, expirée, ou pas encore active.'
    : r.status === 402 ? 'Paiement requis (402) : le compte n’a pas de moyen de paiement actif.'
    : r.status === 403 ? 'Accès refusé (403) : la clé n’a pas accès à ce modèle.'
    : r.status === 404 ? 'Modèle introuvable (404) : vérifie le nom du modèle dans les réglages.'
    : r.status === 429 ? 'Quota atteint (429) : trop de requêtes, ou crédit épuisé. Réessaie dans un instant.'
    : r.status === 529 || r.status >= 500 ? `Service momentanément indisponible (${r.status}). Réessaie plus tard.`
    : `Erreur ${r.status}.`;
  return { msg: detail ? `${base}\nRéponse du service : ${detail}` : base, detail };
}
function addUsage(model, u, searches = 0) {
  const [pi, po, pr, pw] = priceOf(model);
  const usd = ((u.input || 0) * pi + (u.output || 0) * po + (u.cacheRead || 0) * pr + (u.cacheWrite || 0) * pw) / 1e6 + searches * WEB_SEARCH_USD;
  const k = monthKey(), m = S.usage[k] ||= { usd: 0, n: 0 };
  m.usd += usd; m.n++;
  return usd;
}
function budgetCheck() {
  const b = aiCfg().budget;
  if (b && monthSpend() >= b) throw new AIError(`Plafond mensuel atteint (${fmtE2.format(b)}). Tu peux le relever dans Plus › Intelligence artificielle.`);
}
// Un appel au modèle. system : texte fixe ; context : texte mis en cache (cave) ; content : blocs du dernier message.
// Enveloppe : note chaque appel dans le suivi d'utilisation (type, durée, coût, réussite) et garde les erreurs
async function aiCall(opts) {
  const t0 = Date.now(), tag = opts.tag || 'autre';
  try {
    const r = await aiCall0(opts);
    uLog('ai', tag, `ok,${Date.now() - t0},${(r.usd || 0).toFixed(4)}`);
    return r;
  } catch (e) {
    uLog('ai', tag, `err,${Date.now() - t0},0`); errLog('ia:' + tag, e);
    throw e;
  }
}
async function aiCall0({ system, context = '', history = [], content, schema = null, maxTokens = 4000, effort = 'medium', web = false }) {
  if (!aiReady()) throw new AIError('Aucune clé IA configurée. Va dans Plus › Intelligence artificielle.');
  if (navigator.onLine === false) throw new AIError('Pas de connexion réseau.');
  budgetCheck();
  const cfg = aiCfg(), model = aiModel();
  if (!aiClaude()) return mistralCall({ system, context, history, content, schema, maxTokens, model, cfg });
  const sys = [{ type: 'text', text: system }];
  if (context) sys.push({ type: 'text', text: context, cache_control: { type: 'ephemeral' } });
  const msgs = [...history, { role: 'user', content: typeof content === 'string' ? [{ type: 'text', text: content }] : content }];
  const body = { model, max_tokens: maxTokens, system: sys, messages: msgs, output_config: { effort } };
  if (schema) body.output_config.format = { type: 'json_schema', schema };
  if (web) body.tools = [{ type: 'web_search_20260209', name: 'web_search', max_uses: 3 }];
  const fb = !aiNoFallback && /sonnet-5-5|opus-5/.test(model);
  let out = { text: '', sources: [], usd: 0 };
  for (let turn = 0; turn < 4; turn++) {
    const headers = { 'content-type': 'application/json', 'x-api-key': cfg.key, 'anthropic-version': '2026-10-21', 'anthropic-dangerous-direct-browser-access': 'true' };
    const b = { ...body };
    if (fb && !aiNoFallback) { b.fallbacks = 'default'; headers['anthropic-beta'] = 'server-side-fallback-2026-07-01'; }
    let r;
    try { r = await fetch(AI.anthropic.url, { method: 'POST', headers, body: JSON.stringify(b) }); }
    catch { throw new AIError('Impossible de joindre le service. Vérifie ta connexion.'); }
    if (!r.ok) {
      const e = await apiError(r);
      // Le paramètre de repli n'est pas accepté par ce compte ou ce modèle : on réessaie sans lui
      if (r.status === 400 && b.fallbacks && /fallback/i.test(e.detail)) { aiNoFallback = true; turn--; continue; }
      throw new AIError(e.msg);
    }
    const j = await r.json();
    const u = j.usage || {};
    out.usd += addUsage(j.model || model, { input: u.input_tokens, output: u.output_tokens, cacheRead: u.cache_read_input_tokens, cacheWrite: u.cache_creation_input_tokens }, u.server_tool_use?.web_search_requests || 0);
    for (const c of j.content || []) {
      if (c.type === 'text') out.text += c.text;
      if (c.type === 'web_search_tool_result' && Array.isArray(c.content)) for (const s of c.content) if (s.url) out.sources.push({ url: s.url, title: s.title });
    }
    if (j.stop_reason === 'refusal') throw new AIError('Le modèle a refusé de répondre à cette demande. Reformule-la.');
    if (j.stop_reason === 'pause_turn') { body.messages = [...msgs, { role: 'assistant', content: j.content }]; continue; }
    if (j.stop_reason === 'max_tokens') throw new AIError('Réponse trop longue, interrompue. Réessaie avec une demande plus courte.');
    break;
  }
  if (mode === 'app') save();
  out.text = out.text.trim();
  if (schema) { try { out.json = JSON.parse(out.text); } catch { throw new AIError('Réponse illisible. Réessaie.'); } }
  return out;
}
async function mistralCall({ system, context, history, content, schema, maxTokens, model, cfg }) {
  if (typeof content !== 'string') {
    if (content.some(c => c.type !== 'text')) throw new AIError('La lecture d’images et de PDF n’est disponible qu’avec Claude. Change de fournisseur dans Plus › Intelligence artificielle.');
    content = content.map(c => c.text).join('\n');
  }
  const flat = m => typeof m.content === 'string' ? m.content : m.content.map(c => c.text || '').join('\n');
  const sys = system + (context ? '\n\n' + context : '') + (schema ? '\n\nRéponds uniquement par un objet JSON conforme à ce schéma :\n' + JSON.stringify(schema) : '');
  const body = { model, max_tokens: maxTokens, messages: [{ role: 'system', content: sys }, ...history.map(m => ({ role: m.role, content: flat(m) })), { role: 'user', content }] };
  if (schema) body.response_format = { type: 'json_object' };
  let r;
  try { r = await fetch(AI.mistral.url, { method: 'POST', headers: { 'content-type': 'application/json', authorization: 'Bearer ' + cfg.key }, body: JSON.stringify(body) }); }
  catch { throw new AIError('Impossible de joindre le service. Vérifie ta connexion.'); }
  if (!r.ok) throw new AIError((await apiError(r)).msg);
  const j = await r.json();
  const usd = addUsage(model, { input: j.usage?.prompt_tokens, output: j.usage?.completion_tokens });
  if (mode === 'app') save();
  const text = (j.choices?.[0]?.message?.content || '').trim();
  const out = { text, sources: [], usd };
  if (schema) { try { out.json = JSON.parse(text.replace(/^```(json)?|```$/g, '')); } catch { throw new AIError('Réponse illisible. Réessaie.'); } }
  return out;
}
// Extrait le dernier objet JSON d'un texte libre (réponse avec recherche web)
function lastJson(t) {
  const fences = [...t.matchAll(/```(?:json)?\s*([\s\S]*?)```/g)].map(m => m[1]);
  for (const c of fences.reverse()) { try { return JSON.parse(c); } catch {} }
  const end = t.lastIndexOf('}');
  for (let i = t.lastIndexOf('{', end); i >= 0; i = i ? t.lastIndexOf('{', i - 1) : -1) { try { return JSON.parse(t.slice(i, end + 1)); } catch {} }
  return null;
}

/* ---------- Contexte de cave envoyé au sommelier ---------- */
function caveContext(allSites) {
  const y = thisYear(), cur = S.settings.site, multi = isMulti();
  const lines = [], ws = S.wines.filter(w => !isFriend(w) && kindOn(w) && wineBottles(w.id).length);
  for (const w of ws) {
    const bs = wineBottles(w.id).filter(b => allSites || !multi || siteOfBottle(b) === cur);
    const elsewhere = multi && !allSites ? wineBottles(w.id).length - bs.length : 0;
    if (!bs.length && !elsewhere) continue;
    const locs = [...new Set(bs.map(b => locLabel(b, multi)))].map(l => `${l} ×${bs.filter(b => locLabel(b, multi) === l).length}`).join(' ; ');
    const ts = S.tastings.filter(t => t.wineId === w.id), avg = ts.length ? ts.reduce((n, t) => n + (t.note || 0), 0) / ts.length : null;
    const st = status(w), a = w.apogee;
    const parts = [`id=${w.id}`, w.kind === 'spirit' ? `SPIRITUEUX ${SPIRIT_CATS[w.cat]}` : COLORS[w.couleur]?.label, wineTitle(w), w.domaine && `domaine ${w.domaine}`,
      w.kind === 'spirit' ? [w.age && w.age + ' ans', w.fut, w.degre && w.degre + ' %'].filter(Boolean).join(', ') : [w.appellation, w.region].filter(Boolean).join(', '),
      w.cepages && `cépages ${w.cepages}`, `${bs.length} bouteille(s) ici${bs.length ? ' : ' + locs : ''}${elsewhere ? `, ${elsewhere} sur l’autre site` : ''}`,
      w.kind !== 'spirit' && (a?.fin ? `fenêtre ${a.debut || '?'}–${a.fin}${a.pic ? ' apogée ' + a.pic : ''} (${STATUS[st].label.toLowerCase()})` : 'fenêtre inconnue'),
      bs.some(b => b.state === 'open') && `ouverte, niveau ${bs.find(b => b.state === 'open').level ?? 100} %`,
      w.achat?.prix != null && `prix ${Math.round(w.achat.prix)} €`, w.format && w.format !== '75' && w.format !== '70' && `format ${w.format} cl`,
      avg != null && `déjà dégusté : ${numFr(avg)}/20${ts.at(-1)?.comment ? ' « ' + ts.at(-1).comment.slice(0, 80) + ' »' : ''}`];
    lines.push('- ' + parts.filter(Boolean).join(' | '));
  }
  const sites = S.sites.map(s => `${s.name} (${s.role === 'stock' ? 'stockage' : 'consommation'}${s.id === cur ? ', l’utilisateur y est actuellement' : ''})`).join(' ; ');
  const top = [...S.tastings].filter(t => t.note != null && wine(t.wineId)).sort((a, b) => b.note - a.note);
  const liked = top.slice(0, 6).map(t => `${wineTitle(wine(t.wineId) || {})} ${numFr(t.note)}/20`).filter(x => !x.startsWith('undefined'));
  const disliked = top.filter(t => t.note < 12).slice(-4).map(t => `${wineTitle(wine(t.wineId) || {})} ${numFr(t.note)}/20`);
  const tw = t => wine(t.wineId) || {};
  const outside = S.tastings.filter(t => !t.bottleId && wine(t.wineId) && !isFriend(tw(t))).sort((a, b) => (b.at || '').localeCompare(a.at || '')).slice(0, 15)
    .map(t => `${wineTitle(tw(t))} (${[COLORS[tw(t).couleur]?.label, tw(t).region].filter(Boolean).join(', ')}) ${t.note != null ? numFr(t.note) + '/20' : ''}${t.type ? ', ' + TASTE_TYPES[t.type].toLowerCase() : ''}${t.comment ? ' « ' + t.comment.slice(0, 70) + ' »' : ''}`);
  const accords = S.tastings.filter(t => t.accord && t.plat && wine(t.wineId)).slice(-12).map(t => `${t.plat} + ${wineTitle(tw(t))} : ${ACCORDS[t.accord].toLowerCase()}`);
  const wishes = S.wishes.map(x => wine(x.wineId)).filter(Boolean).map(wineTitle);
  return `Date du jour : ${today()} (année ${y}).
${outside.length ? `Vins dégustés hors de la cave (récents) : ${outside.join(' ; ')}.` : ''}
${accords.length ? `Accords déjà essayés par l’utilisateur : ${accords.join(' ; ')}.` : ''}
${wishes.length ? `Liste d’envies (vins qu’il veut acheter) : ${wishes.join(' ; ')}.` : ''}
${multi ? `Sites : ${sites}.${allSites ? ' Bouteilles de tous les sites.' : ' Liste limitée au site actuel.'}` : ''}
${liked.length ? `Vins les mieux notés par l’utilisateur : ${liked.join(' ; ')}.` : ''}${disliked.length ? `\nVins peu appréciés : ${disliked.join(' ; ')}.` : ''}
Cave disponible (${lines.length} références) :
${lines.join('\n') || '(aucune bouteille)'}`;
}

function chatMsg(m, i) {

  if (m.error) return `<div class="bubble ai err">${esc(m.error)}</div>${i === S.chat.length - 1 ? '<button class="link" style="font-size:13px" data-act="problem">Signaler un problème</button>' : ''}`;
  const d = m.data || {}, last = i === S.chat.length - 1;
  const recos = (d.recos || []).map((r, k) => {
    const w = wine(r.id); if (!w) return '';
    const bs = wineBottles(w.id), st = status(w), b = pickBottle(w);
    return `<div class="reco${k === 0 ? ' first' : ''}"><div class="rk">${k + 1} · ${esc(r.role || (k ? 'Alternative' : 'Mon choix'))}${r.plat ? ' · ' + esc(r.plat) : ''}</div>
      <div class="rn">${esc(wineTitle(w))}</div><div class="rs">${esc(wineSub(w))} · ${plural(bs.length, 'bouteille', 'bouteilles')}</div>
      <div class="why">${esc(r.raison)}</div>
      <div class="tags" style="margin-top:8px">${st && st !== 'inconnu' ? `<span class="tag ${STATUS[st].tag}">${STATUS[st].short}</span>` : ''}${r.temperature ? `<span class="tag">${esc(r.temperature)}</span>` : ''}${r.carafe ? `<span class="tag">${esc(r.carafe)}</span>` : ''}${w.achat?.prix ? `<span class="tag">~${eur(w.achat.prix)}</span>` : ''}</div>
      ${b ? `<div class="loc">${ICON.pin}${esc(locLabel(b))}</div>` : ''}
      ${b ? `<div class="btns2" style="margin-top:10px"><button class="btn primary small" data-act="takeIt" data-w="${w.id}">Je la prends</button><button class="btn small" data-act="wine" data-id="${w.id}">Fiche</button></div>` : '<p class="tiny">Plus de bouteille disponible.</p>'}</div>`;
  }).join('');
  return `<div class="bubble ai">${esc(d.message || '')}</div>${recos}
    ${d.achats?.length ? `<div class="card"><div class="ct">À acheter</div>${d.achats.map(a => `<p class="small" style="margin:4px 0;color:var(--ink)">• ${esc(a)}</p>`).join('')}</div>` : ''}
    ${last && d.relances?.length ? `<div class="chips wrap">${d.relances.map(q => `<button class="chip" data-act="chatAsk" data-q="${esc(q)}">${esc(q)}</button>`).join('')}</div>` : ''}`;
}
// Bouteille à sortir pour un vin : sur le site actuel, dans l'espace de consommation, rangée, déjà ouverte d'abord
function pickBottle(w) {
  const bs = wineBottles(w.id);
  const score = b => (b.state === 'open' ? 8 : 0) + (siteOfBottle(b) === S.settings.site ? 4 : 0) + (space(b.spaceId)?.use === 'conso' ? 2 : 0) + (b.unitId ? 1 : 0);
  return bs.sort((a, b) => score(b) - score(a))[0] || null;
}
function composer() {

async function chatSend(q) {
  q = (q || '').trim(); if (!q || chatBusy) return;
  if (!aiReady()) return ACT.aiSettings();
  const ctxNote = [chatOpts.occasion && `Occasion : ${OCCASIONS[chatOpts.occasion].toLowerCase()}.`].filter(Boolean).join(' ');
  S.chat.push({ role: 'user', text: q, at: Date.now() });
  chatBusy = true; chatScroll = true; render();
  const hist = S.chat.slice(-13, -1).filter(m => !m.error).map(m => m.role === 'user' ? { role: 'user', content: m.text } : { role: 'assistant', content: JSON.stringify(m.data) });
  // L'historique doit commencer par un message de l'utilisateur et alterner
  while (hist.length && hist[0].role !== 'user') hist.shift();
  const clean = []; for (const m of hist) { if (clean.length && clean.at(-1).role === m.role) clean.pop(); clean.push(m); }
  if (clean.length && clean.at(-1).role === 'user') clean.pop();
  try {
    const r = await aiCall({ tag: 'sommelier', system: SOMM_SYS(), context: caveContext(chatOpts.all), history: clean, content: [{ type: 'text', text: (ctxNote ? ctxNote + '\n' : '') + q, cache_control: { type: 'ephemeral' } }], schema: SOMM_SCHEMA, maxTokens: 3000, effort: 'medium' });
    S.chat.push({ role: 'assistant', data: r.json, at: Date.now(), usd: r.usd });
  } catch (e) {
    S.chat.push({ role: 'assistant', error: e instanceof AIError ? e.message : 'Erreur inattendue : ' + (e.message || e), at: Date.now() });
  }
  chatBusy = false; chatScroll = true;
  if (S.chat.length > 60) S.chat = S.chat.slice(-60);
  await save(); if (view === 'somm') render();
}
FORMS.chat = (f, d) => chatSend(d.q);

/* ---------- Fenêtre de dégustation (apogée) ---------- */
const APO_SYS = `Tu es un sommelier expert du vieillissement des vins. On te donne un vin d’une cave personnelle et ses conditions de stockage.
Estime sa fenêtre de dégustation : année de début (le vin devient agréable), année d’apogée, année de fin (au-delà il décline). Tiens compte du millésime, de l’appellation, du producteur, de la cuvée, du format (un magnum évolue plus lentement) et des conditions de stockage (une cave de qualité moyenne ou faible raccourcit la garde). S’il y a des notes de dégustation récentes, elles priment sur la théorie.
Si un outil de recherche web est disponible, fais une ou deux recherches ciblées (critiques, fiches du producteur, appréciation du millésime) avant de conclure.
Termine ta réponse par un bloc JSON : {"debut": année, "pic": année, "fin": année, "justification": "deux phrases maximum en français", "confiance": "haute|moyenne|faible"}.`;
function wineBrief(w) {
  const bs = wineBottles(w.id), sps = [...new Set(bs.map(b => b.spaceId))].map(space).filter(Boolean);
  const ts = S.tastings.filter(t => t.wineId === w.id).slice(-3);
  return [`Vin : ${wineTitle(w)}`, `Couleur : ${COLORS[w.couleur]?.label || '?'}`, w.domaine && `Producteur : ${w.domaine}`, w.cuvee && `Cuvée : ${w.cuvee}`,
    w.appellation && `Appellation : ${w.appellation}`, (w.region || w.pays) && `Région : ${[w.region, w.pays].filter(Boolean).join(', ')}`, w.cepages && `Cépages : ${w.cepages}`,
    `Millésime : ${w.millesime || 'non millésimé'}`, w.format && w.format !== '75' && `Format : ${w.format} cl`,
    sps.length && `Stockage : ${sps.map(s => `${s.name} (qualité ${qualityLabel(spaceQuality(s)).toLowerCase()} : ${Object.entries(s.q || {}).map(([k, v]) => QUALITY[k]?.opts[v]).filter(Boolean).join(', ') || 'conditions non renseignées'})`).join(' ; ')}`,
    ts.length && `Dégustations : ${ts.map(t => `${t.at} ${t.note != null ? numFr(t.note) + '/20' : ''} ${t.full?.evolution ? '(' + t.full.evolution + ')' : ''} ${t.comment || ''}`.trim()).join(' ; ')}`,
    `Année actuelle : ${thisYear()}`].filter(Boolean).join('\n');
}
const yearOk = (y, w) => Number.isInteger(y) && y >= 1900 && y <= 2200 && (!w.millesime || y >= w.millesime);
async function estimateApogee(wid, { quiet = false } = {}) {
  const w = wine(wid); if (!w || w.kind === 'spirit') return;
  if (!quiet) toast('Le sommelier étudie ce vin…');
  try {
    const r = await aiCall({ tag: 'apogee', system: APO_SYS, content: wineBrief(w), maxTokens: 6000, effort: 'medium', web: aiClaude() && aiCfg().web });
    const j = lastJson(r.text);
    if (!j || !yearOk(+j.fin, w)) throw new AIError('Estimation illisible. Réessaie.');
    const deb = yearOk(+j.debut, w) ? +j.debut : null, pic = yearOk(+j.pic, w) ? +j.pic : null, fin = +j.fin;
    w.apogee = { debut: deb && deb <= fin ? deb : null, pic: pic && pic <= fin ? pic : null, fin, why: String(j.justification || '').slice(0, 400), conf: j.confiance, src: 'ia', sources: r.sources.slice(0, 5), at: Date.now() };
    await save(); render(); if (sheetStack.length) refreshSheet();
    toast(`Fenêtre estimée : ${windowLabel(w.apogee)}`);
  } catch (e) {
    if (quiet) toast('Apogée non estimée : ' + (e.message || '').split('\n')[0]);
    else errSheet('Estimation impossible', e.message || String(e));
  }
}
// Estimation groupée, sans recherche web (import, vins sans fenêtre)
const BATCH_SCHEMA = { type: 'object', additionalProperties: false, required: ['items'], properties: { items: { type: 'array', items: { type: 'object', additionalProperties: false, required: ['i', 'debut', 'pic', 'fin'], properties: { i: { type: 'integer' }, debut: { type: 'integer' }, pic: { type: 'integer' }, fin: { type: 'integer' } } } } } };
async function estimateBatch(ws, onStep) {
  let done = 0;
  for (let k = 0; k < ws.length; k += 30) {
    const chunk = ws.slice(k, k + 30);
    const r = await aiCall({ tag: 'apogee-lot', system: APO_SYS.replace(/Si un outil[\s\S]*?conclure\.\n/, '').replace(/Termine ta réponse[\s\S]*$/, 'Réponds pour chaque vin avec son numéro i.'), content: chunk.map((w, i) => `#${i}\n${wineBrief(w)}`).join('\n\n'), schema: BATCH_SCHEMA, maxTokens: 6000, effort: 'low' });
    for (const it of r.json.items || []) {
      const w = chunk[it.i]; if (!w || !yearOk(it.fin, w)) continue;
      w.apogee = { debut: yearOk(it.debut, w) && it.debut <= it.fin ? it.debut : null, pic: yearOk(it.pic, w) && it.pic <= it.fin ? it.pic : null, fin: it.fin, src: 'ia', why: 'Estimation groupée, sans recherche web.', at: Date.now() };
      done++;
    }
    onStep?.(Math.min(ws.length, k + 30), ws.length);
  }
  await save();
  return done;
}
Object.assign(ACT, {
  estimate: t => { if (!aiReady()) return ACT.aiSettings(); closeSheet(); estimateApogee(t.dataset.id).then(() => showSheet(() => wineSheet(t.dataset.id))); },
  estimateMissing: async () => {
    if (!aiReady()) return ACT.aiSettings();
    const ws = S.wines.filter(w => w.kind === 'vin' && !w.apogee?.fin && wineBottles(w.id).length);
    if (!ws.length) return toast('Toutes les fenêtres sont connues');
    if (!confirm(`Estimer la fenêtre de ${plural(ws.length, 'vin', 'vins')} ? Coût indicatif : moins de ${fmtE2.format(Math.max(0.02, ws.length * 0.004))}.`)) return;
    toast('Estimation en cours…');
    try { const n = await estimateBatch(ws); render(); toast(`${plural(n, 'fenêtre estimée', 'fenêtres estimées')}`); }
    catch (e) { errSheet('Estimation impossible', e.message || String(e)); }
  },
});

/* ---------- Réévaluation de la fenêtre après une dégustation ---------- */
const REEVAL_SCHEMA = { type: 'object', additionalProperties: false, required: ['changer', 'debut', 'pic', 'fin', 'justification'], properties: {
  changer: { type: 'boolean' }, debut: { type: 'integer' }, pic: { type: 'integer' }, fin: { type: 'integer' }, justification: { type: 'string' } } };
async function reevaluate(w, rec) {
  const a = w.apogee, left = wineBottles(w.id).length;
  const F = rec.full || {};
  const note = [`Dégustation du ${rec.at} : ${rec.note != null ? numFr(rec.note) + '/20' : 'sans note'}`, rec.comment && `commentaire « ${rec.comment} »`,
    F.evolution && `évolution jugée : ${({ jeune: 'jeune', apoint: 'à point', declin: 'sur le déclin' })[F.evolution]}`, F.potentiel && `potentiel restant estimé : ${F.potentiel}`,
    F.aromes?.length && `arômes : ${F.aromes.join(', ')}`].filter(Boolean).join(' ; ');
  try {
    const r = await aiCall({ tag: 'reevaluation', system: APO_SYS.replace(/Si un outil[\s\S]*?conclure\.\n/, '').replace(/Termine ta réponse[\s\S]*$/, '') +
      `\nOn vient de déguster ce vin. Dis s'il faut modifier sa fenêtre actuelle (${a?.fin ? `${a.debut || '?'}–${a.fin}, apogée ${a.pic || '?'}` : 'inconnue'}) pour les ${left} bouteille(s) restantes. Ne la change que si la dégustation l'apporte vraiment (changer = false sinon, et recopie la fenêtre actuelle). Justification en une ou deux phrases, en français, en tutoyant.`,
      content: wineBrief(w) + '\n' + note, schema: REEVAL_SCHEMA, maxTokens: 2000, effort: 'low' });
    const j = r.json;
    if (!j.changer || !yearOk(j.fin, w) || (a && j.fin === a.fin && j.debut === a.debut && j.pic === a.pic)) return;
    const prop = { debut: yearOk(j.debut, w) && j.debut <= j.fin ? j.debut : null, pic: yearOk(j.pic, w) && j.pic <= j.fin ? j.pic : null, fin: j.fin };
    showSheet(() => `${head('Le sommelier')}
      <div class="card" style="background:var(--green-soft);border-color:#C9DCCF"><p style="margin:0 0 6px"><b>${esc(wineTitle(w))}</b> · ${plural(left, 'bouteille restante', 'bouteilles restantes')}</p>
        <p style="margin:0">${esc(j.justification)}</p>
        <p class="small" style="margin:8px 0 0">Fenêtre actuelle : ${esc(windowLabel(a))}<br>Proposée : <b style="color:var(--green)">${esc(windowLabel(prop))}</b></p></div>
      <div class="btns2" style="margin-top:12px"><button class="btn green" data-act="applyReeval" data-w="${w.id}" data-deb="${prop.debut || ''}" data-pic="${prop.pic || ''}" data-fin="${prop.fin}">Mettre à jour</button><button class="btn ghost" data-act="close">Garder</button></div>`);
  } catch (e) { /* silencieux : la dégustation est enregistrée, la réévaluation est un bonus */ }
}
ACT.applyReeval = async t => {
  const w = wine(t.dataset.w);
  w.apogee = { ...(w.apogee || {}), debut: int(t.dataset.deb), pic: int(t.dataset.pic), fin: int(t.dataset.fin), src: 'ia', why: 'Réévaluée après dégustation.', at: Date.now() };
  await save(); closeSheet(); render(); toast('Fenêtre mise à jour');
};

/* ---------- Conseils de rangement (v1.5) ----------
   Trois règles, sans IA :
   1. « Rapatrier » : un vin à boire en priorité qui dort dans un espace de garde → vers un espace de consommation ;
   2. « Mettre en garde » : un vin de longue garde dans un espace de consommation, ou dans une cave de moindre qualité
      qu'une autre disponible → vers le meilleur espace de garde ;
   3. « Réassort » : un espace de consommation avec un nombre de places cible, en dessous de sa cible
      → on le complète avec les vins prêts à boire des espaces de garde (les plus urgents d'abord). */
function moveAdvice() {
  const y = thisYear(), out = [], taken = new Set();
  const sps = S.spaces.map(s => ({ s, q: spaceQuality(s), site: site(s.siteId), known: Object.keys(s.q || {}).length > 0 }));
  const conso = sps.filter(o => o.s.use === 'conso'), garde = sps.filter(o => o.s.use !== 'conso');
  const bestConso = () => conso.sort((a, b) => (b.site?.role === 'conso') - (a.site?.role === 'conso') || (b.s.siteId === S.settings.site) - (a.s.siteId === S.settings.site))[0];
  const bestGarde = () => garde.filter(o => o.known).sort((a, b) => b.q - a.q)[0] || garde[0];
  const push = (kind, w, bs, to, why) => { if (!bs.length || !to) return; bs.forEach(b => taken.add(b.id)); out.push({ kind, w, ids: bs.map(b => b.id), from: bs[0].spaceId, to: to.s.id, why }); };
  const groups = new Map();
  for (const b of S.bottles) if (b.state === 'cave' && b.spaceId && !S.transfer.ids.includes(b.id)) { const k = b.wineId + '|' + b.spaceId; groups.set(k, [...(groups.get(k) || []), b]); }
  for (const [, bs] of groups) {
    const w = wine(bs[0].wineId); if (!w || w.kind === 'spirit') continue;
    const sp = sps.find(o => o.s.id === bs[0].spaceId); if (!sp) continue;
    const st = status(w), a = w.apogee;
    if (!isFriend(w) && st === 'prio' && sp.s.use !== 'conso') { const to = bestConso(); push('rapatrier', w, bs, to, `À boire avant fin ${a.fin}`); continue; }
    const longue = st === 'tot' || (a?.fin && a.fin - y >= 6);
    if (longue) {
      const to = bestGarde();
      if (to && to.s.id !== sp.s.id && (sp.s.use === 'conso' || (sp.known && to.q > sp.q + 1)))
        push('garde', w, bs, to, sp.s.use === 'conso' ? `Vin de garde (jusqu’en ${a?.fin || '?'}) rangé dans un espace de consommation` : `Cave plus adaptée à la garde (qualité ${qualityLabel(to.q).toLowerCase()})`);
    }
  }
  // Réassort des espaces de consommation qui ont une cible
  for (const c of conso) {
    const target = c.s.target; if (!target) continue;
    const have = S.bottles.filter(b => inCave(b) && b.spaceId === c.s.id).length + out.filter(o => o.to === c.s.id).reduce((n, o) => n + o.ids.length, 0);
    let missing = target - have; if (missing <= 0) continue;
    const cands = S.bottles.filter(b => b.state === 'cave' && !taken.has(b.id) && !S.transfer.ids.includes(b.id) && garde.some(g => g.s.id === b.spaceId))
      .map(b => ({ b, w: wine(b.wineId) })).filter(o => o.w && !isFriend(o.w) && o.w.kind === 'vin' && ['prio', 'apogee'].includes(status(o.w)))
      .sort((p, q) => (p.w.apogee?.fin || 9999) - (q.w.apogee?.fin || 9999));
    const by = new Map();
    for (const { b, w } of cands) { if (missing <= 0) break; const k = w.id + '|' + b.spaceId; by.set(k, [...(by.get(k) || []), b]); missing--; }
    for (const [, bs] of by) push('reassort', wine(bs[0].wineId), bs, c, `Réassort de « ${c.s.name} » (cible ${target} bouteilles)`);
  }
  return out;
}
const ADVICE_KIND = { rapatrier: 'À rapprocher', garde: 'À mettre en garde', reassort: 'Réassort' };
function adviceSheet() {
  const adv = moveAdvice();
  const where = id => { const sp = space(id); return sp ? (isMulti() ? site(sp.siteId)?.name + ' › ' : '') + sp.name : '?'; };

    ${adv.length ? Object.keys(ADVICE_KIND).map(k => { const l = adv.filter(a => a.kind === k); return l.length ? `<h3>${ADVICE_KIND[k]}</h3><div class="list">${l.map(a => {
      const cross = space(a.from)?.siteId !== space(a.to)?.siteId, i = adv.indexOf(a);
      return `<div class="li"><span class="dot" style="background:${wineColor(a.w)}"></span><div class="it"><b class="ell">${esc(wineTitle(a.w))} ×${a.ids.length}</b><small>${esc(where(a.from))} → <b style="color:var(--green)">${esc(where(a.to))}</b></small><small>${esc(a.why)}</small></div>
        <button class="btn small ${cross ? '' : 'primary'}" data-act="adviceGo" data-i="${i}">${cross ? 'Au transfert' : 'Ranger'}</button></div>`; }).join('')}</div>` : ''; }).join('')
    : '<p class="muted">Rien à déplacer pour l’instant : chaque vin est au bon endroit.</p>'}
    ${!S.spaces.some(s => Object.keys(s.q || {}).length) ? '<p class="tiny">Astuce : renseigne les conditions de stockage de tes espaces (Réglages › Sites, espaces et meubles) pour des conseils plus fins.</p>' : ''}`;
}

async function exportBackup() {
  if (mode !== 'app') return toast('Crée ta cave pour pouvoir sauvegarder');
  const v = await seal();
  v.slots = { pw: slots.pw };   // ni Face ID ni clé d'appareil dans le fichier
  v.photos = {};
  for (const k of await store.keys()) if (String(k).startsWith('ph:')) v.photos[k.slice(3)] = await store.get(k);
  const name = `mycellar-sauvegarde-${today()}.json`;
  const blob = new Blob([JSON.stringify(v)], { type: 'application/json' });
  const file = new File([blob], name, { type: 'application/json' });
  let ok = false;
  if (navigator.canShare && navigator.canShare({ files: [file] })) {
    try { await navigator.share({ files: [file] }); ok = true; } catch (e) { if (e.name === 'AbortError') return; }
  }
  if (!ok) { const u = URL.createObjectURL(blob), a = document.createElement('a'); a.href = u; a.download = name; a.click(); setTimeout(() => URL.revokeObjectURL(u), 4000); }
  S.settings.lastExport = Date.now(); await save(); render(); toast('Sauvegarde exportée');
}
async function onBackupFile(file) {
  if (!file) return;
  try { pendingImport = JSON.parse(await file.text()); if (pendingImport.app !== 'mycellar') throw 0; }
  catch { pendingImport = null; return toast('Ce fichier n’est pas une sauvegarde MyCellar'); }
  showSheet(() => `${head('Restaurer une sauvegarde')}
    <p class="small">Sauvegarde du ${esc(new Date(pendingImport.savedAt || Date.now()).toLocaleDateString('fr-FR', { day: 'numeric', month: 'long', year: 'numeric' }))}. Elle remplacera la cave de cet appareil.</p>
    <form class="form" data-form="import">${USERFIELD}<label>Mot de passe de cette sauvegarde<input type="password" name="p" autocomplete="current-password" required></label>
      <p class="err" id="ierr" hidden></p><button class="btn primary wide" type="submit">Restaurer</button></form>`);
}
FORMS.import = async (f, d) => {
  const btn = f.querySelector('[type=submit]'); btn.disabled = true; btn.textContent = 'Déchiffrement…';
  try {
    const o = await openVault(pendingImport, { pass: d.p });
    if (mode === 'app' && S.wines.length && !confirm('Remplacer la cave actuelle de cet appareil par cette sauvegarde ?')) { btn.disabled = false; btn.textContent = 'Restaurer'; return; }
    for (const k of await store.keys()) if (String(k).startsWith('ph:')) await store.del(k);
    for (const [id, e] of Object.entries(pendingImport.photos || {})) await store.set('ph:' + id, e);
    await devDisable();
    await adopt({ raw: o.raw, data: o.data, slots: { pw: pendingImport.slots.pw } });
    S.settings.stay = false; S.settings.lastExport = pendingImport.savedAt || Date.now();
    await save(); navigator.storage?.persist?.(); pendingImport = null;
    closeSheet(); enterApp('restauration'); toast('Cave restaurée');
  } catch { btn.disabled = false; btn.textContent = 'Restaurer'; const er = $('#ierr'); er.hidden = false; er.textContent = 'Mot de passe incorrect pour cette sauvegarde.'; }
};
Object.assign(ACT, {

/* ---------- Suivi d'utilisation (v1.6) ----------
   Journal local des gestes : écrans affichés et temps passé, boutons touchés, formulaires validés,
   noms des champs modifiés, appels IA (type, durée, coût), erreurs.
   Ne contient jamais de nom de vin, de note, de commentaire, de prix, de lieu ni de contenu saisi :
   seulement des noms d'actions du code, des écrans et des horodatages. Chiffré avec la clé du coffre,
   jamais envoyé : l'utilisateur exporte lui-même un rapport.
   Chaque événement : [horodatage ms, n° de session, type, nom, écran, détail]. */
const USE_MAX = 20000;
let U = null, uSess = 0, uScreen = '', uPending = null, uDirty = 0, uTimer = null;
const usageOn = () => mode === 'app' && !!S?.settings.usage?.on && !!U;
const uNew = () => ({ v: 1, since: Date.now(), n: 0, ev: [] });
const uBase = () => view + (view === 'cave' ? '/' + caveMode : view === 'deg' ? '/' + degMode : '');
// Détail sûr d'un geste : uniquement des codes courts du programme (jamais un identifiant, un nom ou un texte saisi)
const U_KEYS = ['v', 'm', 'k', 'kind'];
function uDetail(el) {
  const d = el.dataset, out = [];
  for (const k of U_KEYS) if (d[k] != null && /^[a-z0-9_-]{1,16}$/i.test(d[k]) && !/^[0-9a-f]{12}$/.test(d[k])) out.push(d[k]);
  if (d.session) out.push('seance');
  return out.join(',') || undefined;
}
function uLog(k, a, x) {
  if (!usageOn()) return;
  const e = [Date.now(), uSess, k, a || '', uScreen];
  if (x != null) e.push(x);
  U.ev.push(e);
  if (U.ev.length > USE_MAX) U.ev.splice(0, U.ev.length - USE_MAX);
  uDirty++;
  clearTimeout(uTimer); uTimer = setTimeout(() => uFlush(), 4000);
}
// Après chaque affichage : note un changement d'écran (onglet, mode, feuille ouverte)
function uScreenCheck() {
  if (!usageOn()) return;
  const top = sheetStack[sheetStack.length - 1];
  const sc = uBase() + (top ? ' > ' + (top.u || 'feuille') : '') + (introAt != null ? ' > presentation' : '');
  if (sc === uScreen) return;
  uScreen = sc; uLog('screen', sc);
}
async function uFlush(key = dek) {
  if (!U || !key || !uDirty || mode !== 'app') return;
  uDirty = 0;
  try { await store.set('usage', await aesEnc(key, enc.encode(JSON.stringify(U)))); } catch { uDirty++; }
}
async function uLoad() {
  if (U) return;
  try { const r = await store.get('usage'); U = r ? JSON.parse(dec.decode(await aesDec(dek, r.iv, r.ct))) : null; } catch { U = null; }
  if (!U || U.v !== 1 || !Array.isArray(U.ev)) U = uNew();
}
async function uStart(via) {
  if (mode !== 'app') return;
  await uLoad();
  if (!S?.settings.usage?.on) return;
  uSess = ++U.n; uScreen = '';
  uLog('start', via || 'inconnu', `${innerWidth}x${innerHeight}${matchMedia('(display-mode: standalone)').matches ? ',app' : ',navigateur'}`);
  uScreenCheck();
}
function uStop(reason) {
  if (usageOn()) uLog('end', reason);
  const k = dek; clearTimeout(uTimer); uFlush(k); U = null;
}

/* ---------- Erreurs récentes ----------

function errLog(where, e) {
  const msg = String(e?.message || e || '').replace(/\s+/g, ' ').slice(0, 240);
  if (S?.diag) { S.diag.errors.push({ t: Date.now(), where, msg, screen: uScreen || uBase() }); if (S.diag.errors.length > 30) S.diag.errors.splice(0, S.diag.errors.length - 30); }
  uLog('error', where, msg.slice(0, 120));
}
window.addEventListener('error', e => { try { errLog('js', e.error || e.message); } catch {} });
window.addEventListener('unhandledrejection', e => { try { errLog('promesse', e.reason); } catch {} });
// Message d'erreur avec raccourci vers « Signaler un problème »
function errSheet(title, msg) {

    <div class="btns"><button class="btn wide" data-act="sheetback">OK</button>${mode === 'app' ? '<button class="btn ghost wide" data-act="problem">Signaler ce problème</button>' : ''}</div>`);
